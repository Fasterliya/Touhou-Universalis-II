l_korean:
 th_panegyric_of_all_things_advance: "모든 것을 찬미하던 시대"
 th_panegyric_of_all_things_advance_desc: "최초의 시대의 사람들은 세상을 신성한 것과 두려운 것, 살아있는 존재와 존재의 그릇으로 나누지 않았었습니다. 산맥, 강, 대지, 숲, 그리고 이름이 없던 존재들까지, 그 모든 것들은 함께 이야기되며 함께 칭송받았습니다.\n\n황혼과 신비가 대지를 뒤덮고, 어둠 저편에는 아무도 모르는 것이 숨어들었습니다. 사람들은 어둠을 두려워하고, 미지를 공포로 여기기 시작했습니다. 이윽고 구전된 이야기, 괴이현상에 대한 상상, 어둠에 대한 공포가 하나로 뭉치기 시작했습니다.\n\n그리고 그 전승 속에서, 비로소 환상이라는 개념이 탄생하였습니다."
 th_origin_dream_advance: "최초의 꿈"
 th_origin_dream_advance_desc: "환상은 세상이 정의되기 이전부터 이미 존재해 왔습니다. 환상야말로 세상의 첫 번째 모습입니다. 모든 신비, 전설, 기이한 현상, 버려진 환상들, 이 모든 것들이 어둠의 부름에 따라 이 곳으로 모여들었습니다. 그리하여 환상향은 그들의 종착지이자 최초의 원점이 되었습니다."
 th_endless_fantasy_advance: "영원한 밤의 세계"
 th_endless_fantasy_advance_desc: "현실과 환상 사이에는 아직 명확한 경계가 존재하지 않습니다. 꿈은 현실이 될 수도, 소문은 기이한 현상을 품을 수도 있습니다. 신비와 인간은 같은 길을 함께 걷고 있으며, 모든 것은 아직 깨어나지 않은 환상 속에서 부침을 거듭하고 있습니다."
 th_gensokyo_chronicle_advance: "환상향연기"
 th_gensokyo_chronicle_advance_desc: "기록되는 것만이 역사가 됩니다. 전설과 괴이는 이 책에 기록되고 전해졌으며, 대대로 전승되어 지금의 시대에 이르렀습니다."
 th_balance_between_youkai_and_hito_advance: "인간과 요괴의 균형"
 th_balance_between_youkai_and_hito_advance_desc: "이것은 인간이 아직 나약하던 시대의 일입니다. 밤의 장막이 내릴 때면, 사람들은 문을 닫고 마을 밖으로 한 발자국도 내딛지 않았습니다. 마을 외곽의 숲, 죽림, 황야에는 무수한 신비가 도사리고 있었기에, 대부분의 사람들은 삶을 마감할 때까지 마을 밖의 모습을 제대로 알지 못했습니다. 사람들은 무녀의 보호를 통해 안식을 얻었습니다. \n\n요괴는 어둠 속에서 방황하며, 인간의 공포를 양식으로 삼고, 구전된 공포를 통해 자신의 존재를 이어갔습니다. \n\n인간은 요괴를 두려워하고, 요괴는 인간의 공포를 필요로 합니다. 양자는 서로 대립하면서도 서로 의존하며, 이 시대의 질서를 함께 구축해 나갔습니다."
 th_gensokyo_sages_advance: "현자의 보호"
 th_gensokyo_sages_advance_desc: "긴 밤은 아직 끝나지 않았습니다. 환상향의 현자들은 신들이 사랑한 이 땅을 조용히 지켜보고 있습니다. 그들은 현실과 환상의 경계를 지키며, 인간과 요괴의 균형을 유지해 왔습니다. 현자들은 오직 모든 것을 지켜볼 뿐입니다. 하룻밤에 또 하룻밤이, 한 세대에 또 한 세대가 지나가도록. 현자는 오늘 밤도 전과 같이 이야기를 지켜보고, 전승을 지켜보고, 끝이 없는 환상을 지켜봅니다."
 th_spell_card_rules_advance: "스펠 카드 룰"
 th_spell_card_rules_advance_desc: "요괴들이 보다 공정한 방법으로 분쟁을 해결하게 만들기 위해, 현자들은 힘을 합하여 스펠 카드 룰을 확립하였습니. 이 이후로 싸움은 단순히 승패를 가리는 것이 아니게 되었습니다. 탄막은 자신의 존재와 이념을 표현하는 수단이 되었으며, 약자라 할지라도 강자에게 도전할 자격을 갖게 되었습니다. 스펠 카드 룰이라 불리는 이 계약은 환상향의 균형을 지탱하는 기반이 되었습니다."
 th_incident_resolution_advance: "이변의 질서"
 th_incident_resolution_advance_desc: "환상향에서는 이변 또한 환상을 이어가는 중요한 구성 요소입니다. 요괴는 이를 통해 존재를 드러내고, 신들은 이를 통해 신앙을 널리 퍼뜨리며, 인간은 이변을 해결함으로써 균형을 다시 확립합니다."
 th_age_of_stories_and_observations_advance: "전승되는 이야기"
 th_age_of_stories_and_observations_advance_desc: "여행자, 학자, 소설가의 시대가 되었습니다. 서적, 초본, 이야기가 환상향에 널리 퍼짐에 따라, 사람들은 익숙한 마을을 떠나 환상향의 더 머나먼 땅으로 향하기 시작했습니다. 견문은 기록되고, 전설은 정리되며, '이야기'는 새롭게 재구성될 것입니다."
 th_fantasy_book_compacts_advance: "바람이 불어오는 곳"
 th_fantasy_book_compacts_advance_desc: "바람이 어디에서 불어오는지는 아무도 모르며, 어디로 부는지 아는 이 또한 없습니다. 먼 곳의 소문을 듣는 자도 있고, 아직 보지 못한 풍경을 바라보는 자도 있으며, 여행의 견문을 기록하는 자도 있고, 이를 새로운 이야기로 엮어내는 자도 있습니다. 그리하여 본래 아무런 관련도 없던 사람과 사건들이 길과 책, 그리고 말을 통해 서로 연결되기 시작했습니다. 누군가에게서 누군가로, 또 누군가에게서 누군가로. 모든 이야기가 바람과 함께 머나먼 땅으로 흘러들어가며, 환상향은 변하기 시작했습니다."
 th_the_distant_one_advance: "머나먼 무언가"
 th_the_distant_one_advance_desc: "모든 이야기가 시작되기 이전부터, 언제나 닿을 수 없는 목표라는 것이 존재했습니다. 어떤 이는 존재하지 않는 풍경을 쫓고, 어떤 이는 사라진 역사를 쫓으며, 또 어떤 이는 자신의 꿈을 쫓습니다. 닿을 수 없는 것이 있기에, 사람들은 끊임없이 전진해 왔습니다. 그리하여 이야기가 기록되었고, 새로운 시대가 이곳에서 시작되었습니다."
 th_scarlet_destiny_advance: "진홍빛 운명"
 th_scarlet_destiny_advance_desc: "사람들은 처음에는 그저 먼 곳을 바라볼 뿐이었습니다. 안개 너머 신비로운 경계의 바깥에는 그들이 아직 이해하지 못한 무언가가 있는 것처럼 보였습니다. 여행자는 여행을 떠나고, 학자는 책장을 넘기며, 소설가는 새로운 이야기를 쓰기 시작했습니다. 그들은 종착지가 어디인지 몰랐지만 계속 전진했습니다. 미지의 세계는 두렵지만 동시에 동경의 대상이기도 했습니다. 그리하여 사람들은 그저 운명이 찾아오기만을 기다리는 것이 아니라 비로소 스스로 운명을 찾아나서기 시작했습니다."
 th_phantom_dreams_advance: "요요의 꿈"
 th_phantom_dreams_advance_desc: "잊혀진 것. 묻혀있던 것. 봉인되어 있던 것. 한때 역사의 깊은 잠에 빠져 있던 기억은, 다시 깨어났습니다."
 th_eternal_night_advance: "영원한 밤"
 th_eternal_night_advance_desc: "세상이 끊임없이 넓어지고 수많은 사람들이 경계 너머로 향하는 시기가 오면서, 사람들은 더 먼 땅을 바라보기 시작했습니다. 수수께끼가 풀렸다고 해서 이야기가 끝나는 것은 아닙니다. 끝에 도달했다고 해서 꿈이 멈추는 것은 아닙니다. 이어지는 이들의 이야기는 바로 이 밤부터 시작될 것입니다."
 th_new_narratives_of_incidents_advance: "새로운 이변"
 th_new_narratives_of_incidents_advance_desc: "이변은 다시 시작됩니다. 누가 이변을 일으켰는가? 왜 이변을 일으켰는가? 이변을 해결한 자들은 무엇을 경험했는가? 그리고 이변이 끝날 때마다, 새로운 이야기도 새롭게 탄생합니다."
 th_words_like_pearls_advance: "보배로운 글자"
 th_words_like_pearls_advance_desc: "사람들은 기억할 가치가 있는 것만이 역사가 되는 것은 아니라고 생각하기 시작했습니다. 점점 더 많은 이들이 붓을 들어, 보고 들은 것을 종이 위에 남기기 시작했습니다. 이리하여 글자가 서당을 벗어나 사람들의 일상 속에 스며들었다. 이야기는 기록되고, 경험은 남겨지며, 사상은 전파되기 시작했습니다."
 th_cartography_of_rumors_advance: "백문록"
 th_cartography_of_rumors_advance_desc: "한때 애매모호하던 세계는 점차 이름을 갖게 되었고, 미지의 땅도 마침내 종이 위에 그 모습을 드러내게 되었습니다."
 th_chronicles_of_mysteries_advance: "삼라만상의 비밀"
 th_chronicles_of_mysteries_advance_desc: "여행과 교류가 성행함에 따라, 점점 더 많은 이들이 환상향 각지에서 전해지는 기이한 일화와 전설을 기록하기 시작했습니다. 사람들은 마침내 가장 기이한 비술이라 할지라도 전혀 규칙이 없는 것은 아니라는 사실을 깨달았습니다. 그리고 무수한 비밀 뒤에 숨어 있는 더 깊은 비밀은 사람들의 발견을 기다리고 있었습니다."
 th_danmaku_reformation_advance: "스펠 카드 개혁"
 th_danmaku_reformation_advance_desc: "문화가 번성하기 시작하면서 사람들은 자신의 경험, 이념, 능력을 스펠 카드에 녹여내기 시작하였습니다. 스펠 카드의 화려함 또한 승패를 가르는 열쇠가 되었으며, 무수히 다양한 이야기들이 탄막 사이로 교차하기 시작했습니다. 책의 페이지에 글자가 쓰여지듯, 스펠 카드 또한 환상의 그릇이 되었습니다."
 th_printing_press_adoption_advance: "인쇄술"
 th_printing_press_adoption_advance_desc: "인쇄 기술이 점진적으로 보급되면서 서적과 문헌은 더욱 빠르게 복제되고 전파될 수 있게 되었습니다. 과거에는 직접 손으로 필사하는 방식에만 의존했던 역사, 전설, 지식도 이제는 훨씬 더 효율적으로 보존되어 더 많은 사람들에게 퍼져나갈 수 있게 되었습니다."
 th_emergent_journalism_advance: "신문 사업"
 th_emergent_journalism_advance_desc: "마을과 마을, 도시와 도시, 신사와 관련된 일상적인 소식이 정리되고 편찬되면서 보다 안정적인 형식으로 외부에 전해지기 시작하였고, 대중들은 이러한 정기 간행물을 통해 정보를 얻고 세상을 이해하는 법을 배우게 되었습니다. 정보의 흐름은 이와 같이 가속화되었고, 세상의 윤곽 또한 더욱 선명해졌습니다."
 th_silver_currency_standard_advance: "은화 유통"
 th_silver_currency_standard_advance_desc: "은이 화폐로 사용되는 현상이 환상향 각지로 더욱 확산되었습니다. 아주 오래 전부터 은화는 이미 시장 내에서 유통되며 가격의 기준으로 사용되기도 하였습니다. 그러나 이 시대에 이르러 거래 범위의 확대와 왕래 빈도의 증가에 따라 은화는 유통 규모가 현저히 증가하여, 마침내 더 광범위한 경제 활동에서 일반적인 매개체가 되었습니다."
##Third Age Innovations
 th_boundary_gaze_advance: "경계를 응시하다"
 th_boundary_gaze_advance_desc: "처음으로 대결계는 더 이상 벽이 아니라 연구의 대상으로 여겨지기 시작했습니다. 학자와 현자들은 결계 가장자리에 진을 치고, 그 동요와 균열, 그리고 숨결을 기록했습니다."
 th_rumors_of_the_outside_advance: "바깥세상의 소문"
 th_rumors_of_the_outside_advance_desc: "결계를 넘어오는 바람은 바깥세상의 목소리를 실어 나릅니다. 사람들은 '바깥'에 관한 소문을 주고받기 시작했습니다. 요괴가 없는 하늘, 더 이상 신을 믿지 않는 사람들."
 th_gateway_research_advance: "통로를 찾아서"
 th_gateway_research_advance_desc: "어떤 이들은 숲 깊은 곳에서 결계의 약점을 발견했다고 주장했습니다. 원정대가 떠났습니다. 돌아온 자도, 돌아오지 못한 자도 있었지만, 처음으로 그 길이 지도 위에 표시되었습니다."
 th_outside_contact_advance: "최초의 접촉"
 th_outside_contact_advance_desc: "환상향은 처음으로 바깥의 문명과 대화를 나누었습니다. 언어는 달랐고 규칙도 달랐지만, '저쪽'의 물건과 이야기들이 찻집에 나타나기 시작했습니다."
 th_return_of_the_sealed_advance: "돌아온 자들"
 th_return_of_the_sealed_advance_desc: "한때 봉인되고 추방되고 잊혔던 존재들이 차례로 돌아오기 시작했습니다. 그들은 바깥세상의 기억을 되가져왔고, 환상향의 기반을 흔들 만한 질문들도 함께 가져왔습니다."
 th_lunar_almanac_advance: "달의 역법"
 th_lunar_almanac_advance_desc: "사람들은 달의 차고 기움, 월식, 조수 간만을 먹으로 기록하기 시작했습니다. 처음으로 달은 '신'에서 '관찰할 수 있는 대상'으로 옮겨갔습니다."
 th_moon_dialogue_advance: "달과의 대화"
 th_moon_dialogue_advance_desc: "달의 백성이 월면에서 환상향을 지켜보고 있다는 전설이 있습니다. 어떤 이들은 달빛에 응답하려 했고, 어떤 이들은 주술을 통해 달에 닿고자 했습니다. 대화는 아직 시작되지 않았지만, 초대는 이미 보내졌습니다."
 th_eternity_rumor_advance: "불로불사의 이야기"
 th_eternity_rumor_advance_desc: "영원정의 전설이 다시 떠올랐습니다. 봉래의 약, 불로불사, 달에서 추방된 공주. 죽음은 더 이상 건드릴 수 없는 금기가 아니라 논할 수 있는 주제가 되었습니다."
 th_empirical_eye_advance: "실증의 눈"
 th_empirical_eye_advance_desc: "과학 이론가들은 '검증할 수 있는 것만이 믿을 가치가 있다'고 선언했습니다. 처음으로 환상 그 자체가 실험대 위에 올려졌습니다."
 th_gensokyo_law_advance: "환상향법"
 th_gensokyo_law_advance_desc: "각지에 흩어져 있던 풍속과 규칙을 통일된 성문법전으로 편찬합니다. 조리가 분명하고 조목이 명확합니다."
 th_old_learning_advance: "구학독전"
 th_old_learning_advance_desc: "가르침은 오직 옛 고전만을 정통으로 삼아, 외래 학문과 새로운 학설을 받아들이지 않습니다."
 th_education_for_all_advance: "유교무류"
 th_education_for_all_advance_desc: "테라코야 방식을 본뜬 정규 사숙이 일어나, 글 읽기는 더 이상 소수의 특권이 아닙니다."
 th_farming_and_education_advance: "농교병중"
 th_farming_and_education_advance_desc: "교화와 농경을 병행하는 방식을 추진하여 학식 수련과 전답 실천을 모두 게을리하지 않습니다."
 th_common_sense_erosion_advance: "상식의 침식"
 th_common_sense_erosion_advance_desc: "바깥의 상식이 물처럼 환상향에 스며들었습니다. 요괴들은 사람들이 더 이상 자신을 두려워하지 않는다는 것을 깨달았습니다. 이해받는 것, 그것이 요괴에게 가장 깊은 공포입니다."
 th_heavenly_incidents_advance: "천공에서 온 이변"
 th_heavenly_incidents_advance_desc: "새로운 이변은 바깥에서 옵니다. 떨어진 유물, 어긋난 달의 위상, 분류를 거부하는 현상. 처음으로 현자들은 '이름을 붙일 수 없는' 이변과 마주했습니다."
##Fourth Age: Kagura and Matsuri
 th_essence_of_faith_advance: "신앙의 본질"
 th_essence_of_faith_advance_desc: "사방의 신과 승려들이 각자 인간 마을을 자기 것이라 주장할 때, 사람들은 마침내 가장 근본적인 질문을 던지기 시작했습니다. 신앙의 힘은 정말로 신에게서 오는가, 아니면 모든 인간의 마음속에 깃든 믿고자 하는 의지에서 오는가? 처음으로 환상향은 신앙 그 자체를 탐구의 대상으로 삼았습니다."
 th_faith_and_doubt_advance: "신앙과 의심"
 th_faith_and_doubt_advance_desc: "의심은 더 이상 불경이 아니었습니다. '신은 존재하는가'라고 묻는 자가 경건하게 무릎 꿇는 자만큼 많아졌고, 사람들은 의심으로 단련된 신앙만이 진정 굳건할 수 있다는 것을 서서히 배워갔습니다."
 th_god_and_mortal_advance: "인간들 사이의 신"
 th_god_and_mortal_advance_desc: "신들은 신전에서 내려와 인간과 같은 찻상을 마주했고, 요괴들도 처음으로 축제에서 인간과 어깨를 나란히 했습니다. 신과 인간의 경계가 흐려지기 시작했고, 그 흐려짐은 신앙을 그 어느 때보다 가깝게 만들었습니다."
 th_sacred_music_advance: "제례의 장"
 th_sacred_music_advance_desc: "북소리, 피리소리, 신악(카구라)의 춤은 신과 인간 사이에서 가장 오래되고 보편적인 언어가 되었습니다. 축제가 환상향에 울려 퍼질 때, 사람들은 믿었습니다. 신들은 이 소리를 들을 수 있으며, 그 속에서 자신들의 목소리를 들을 수 있다고."
 th_festival_protocol_advance: "축제의 규범"
 th_festival_protocol_advance_desc: "축제는 더 이상 단순한 민간의 흥청거림이 아니었습니다. 환상향은 공통된 제의 규범을 세우기 시작했습니다. 언제 북을 치고, 어떻게 춤을 바치고, 어떤 제물이 적합한지. 의식이 장엄할수록 신앙은 더 무겁고 독실해졌습니다."
 th_schism_of_belief_advance: "신앙의 분열"
 th_schism_of_belief_advance_desc: "같은 환상이 모리야와 하쿠레이, 명련사와 영장전의 눈에는 다르게 이야기되었습니다. 분열은 재앙이 아니었습니다. 사람들은 오직 균열을 통해서만 신앙이 진정 성숙한다는 것을 이해하기 시작했습니다."
 th_reform_of_rites_advance: "의례의 개혁"
 th_reform_of_rites_advance_desc: "낡은 제사 방식이 시대에 뒤떨어진 것으로 여겨져 각지에서 의례가 개혁되었습니다. 화려함을 간소화하고, 카구라를 새로 짜며, 신앙이 시대에 보조를 맞추게 했습니다. 개혁의 불길은 환상향의 모든 신사와 사찰을 휩쓸었습니다."
 th_pilgrimage_roads_advance: "성지순례길의 부상"
 th_pilgrimage_roads_advance_desc: "순례길이 환상향 곳곳을 관통하고 신자들이 그 길을 따라 떠났습니다. 신앙은 처음으로 지리를 얻었습니다. 산과 사찰과 신사가 하나의 길의 그물로 엮였습니다."
 th_human_divinity_advance: "인간의 신성"
 th_human_divinity_advance_desc: "사람들은 기적이 필요 없다는 것을 서서히 발견했습니다. 인간의 선행 자체에 신성이 깃들어 있습니다. 요괴와 인간 모두가 선행에서 빛을 보았을 때, 신앙은 신을 바라보는 일보다 인간 그 자체를 찬미하는 일이 되었습니다."
 th_faith_as_power_advance: "힘이 되는 신앙"
 th_faith_as_power_advance_desc: "신앙은 축적되고 다툴 수 있는 무언가로 이해되기 시작했습니다. 제물, 마음, 명성 모두 권력의 겨룸에 있어 자원이 되었습니다. 모든 축제가 전장이었고, 경건함은 가장 예리한 칼날이었습니다."
 th_eternal_question_advance: "신들의 지속"
 th_eternal_question_advance_desc: "시대가 끝나갈 무렵, 환상향은 공통의 마지막 질문과 마주했습니다. 신앙이 변해야 한다면, 신들은 어떤 형태로 존속할 것인가? 어떤 이들은 카구라로 이름을 살리고, 어떤 이들은 이야기 속에 영혼을 담았으며, 신들의 지속은 이제 인간의 기억 위에 놓였습니다."
##Fifth Age: All Things as One
 th_oneness_philosophy_advance: "일원의 원리"
 th_oneness_philosophy_advance_desc: "신앙의 소란이 잦아든 뒤, 철학자들은 고대의 명제를 논하기 시작했습니다. 모든 것은 같은 환상에서 태어난다. 인간과 요괴, 신과 인간은 하나의 환상이 서로 다른 얼굴을 비춘 것일 뿐이다. 처음으로 환상향은 '일원'이라는 철학을 들었습니다."
 th_dissolution_of_boundary_advance: "경계의 해체"
 th_dissolution_of_boundary_advance_desc: "인간과 요괴, 신과 인간, 평범함과 환상의 경계가 모두 재검토되었습니다. 경계는 자연스러운 것인가, 아니면 만들어진 것인가? 사람들이 그 선을 의심하기 시작하자, 그것은 이미 느슨해지기 시작했습니다."
 th_common_destiny_advance: "공동의 운명"
 th_common_destiny_advance_desc: "바깥의 존재와 미지의 것에 맞서며, 환상향의 국가들은 처음으로 하나의 운명을 공유하고 있음을 깨달았습니다. 차이는 남아 있었지만, 더 이상 아무도 섬인 척할 수 없었습니다. 바람은 모든 것을 같은 곳으로 실어 나릅니다."
 th_unity_of_orders_advance: "많은 법, 하나의 질서"
 th_unity_of_orders_advance_desc: "여러 국가의 얽힌 법들이 재검토되었습니다. 환상향의 모든 국가가 따라야 할 '하나'가 존재하는가? 흩어진 규칙들이 하나의 질서로 흐르기 시작할 때, 통일은 더 이상 꿈이 아니게 됩니다."
 th_great_unification_advance: "대통일"
 th_great_unification_advance_desc: "처음으로 어떤 단일 세력도 넘어서는 틀이 구상되었습니다. 환상향 전체, 더 이상 국가들의 단순한 결합이 아닌 것. 대통일은 아직 미결이지만, 어떤 이들은 이미 그것을 그리기 시작했습니다."
 th_center_and_periphery_advance: "중심과 주변"
 th_center_and_periphery_advance_desc: "통일의 물결 속에서 중심과 주변의 관계가 재정의되었습니다. 주변은 더 이상 정복의 대상이 아니었습니다. 모든 땅이 저마다의 방식으로 '하나'의 형성에 참여합니다."
 th_order_within_chaos_advance: "혼돈 속의 질서"
 th_order_within_chaos_advance_desc: "환상향의 본질은 분열과 혼돈이며, 사람들은 그것을 파괴하지 않을 질서를 그 혼돈 안에 세우는 법을 배우기 시작했습니다. 결계가 만물을 나란히 품듯, 질서와 무질서는 같은 전체의 두 얼굴입니다."
 th_collective_identity_advance: "집단적 정체성"
 th_collective_identity_advance_desc: "종족과 신앙을 초월한 '환상향 사람들'이라는 정체성이 형태를 갖추기 시작했습니다. 사람들이 '어느 땅의 신하'라고 말하는 대신 '환상향의 거주자'라고 부르기 시작했을 때, 일원의 시대는 이미 조용히 도래해 있었습니다."
 th_barrier_and_oneness_advance: "결계와 하나"
 th_barrier_and_oneness_advance_desc: "대결계는 갈라놓는 벽인가, 감싸는 껍질인가? 그것은 분열을 지키면서도 통일을 품습니다. 사람들은 결계가 '하나'의 장애물이 아니라 그 그릇임을 이해하게 되었습니다."
 th_guardians_of_order_advance: "질서의 수호자"
 th_guardians_of_order_advance_desc: "'하나'를 정의할 권리는 누구에게 있는가? 현자와 수호자들은 통일의 시대에 새롭게 질문을 받았습니다. 무녀는 더 이상 단순한 경계자도, 현자는 단순한 관찰자도 아니었습니다. 둘 다 자신이 진정 무엇을 지키고 있는지 답해야 했습니다."
 th_eternal_diversity_advance: "여러 길, 하나의 귀환"
 th_eternal_diversity_advance_desc: "시대의 끝에 도달한 깨달음, 진정한 '하나'는 차이를 지울 필요가 없습니다. 모든 것은 저마다의 길을 가집니다. 요괴는 산으로, 인간은 마을로, 신은 신전으로, 그럼에도 모두 같은 환상으로 돌아옵니다. 여러 길, 그리고 마지막에는 하나의 귀환."