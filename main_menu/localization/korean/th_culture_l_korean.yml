 th_genesis_of_gensokyo_institution: "환상향연기"
 th_genesis_of_gensokyo_institution_desc: "환상향의 시작의 때, 이야기는 모닥불 곁의 대화 속에서 탄생하여 사람과 사람 사이의 속삭임으로 전해지며, 또한 대대로 이어져 온 이야기와 전승을 통해 보존되어 왔습니다. 요괴의 형상, 신의 기적, 이변에 대한 목격담, 고대의 전설이 어우러져 이 땅의 첫 번째 기억을 엮어냈습니다. \n\n그러나 아무리 생생한 이야기라 하더라도 잊혀짐을 통해 흩어지며, 아무리 오래된 전설이라도 세월과 함께 사라지기 마련입니다. 요괴들이 잊혀지지 않기 위해, 전설이 시간 속에 묻히지 않기 위해, 기록은 점차 중요한 요소가 되어 갔습니다. \n\n종이에 기록된 이야기는 입에서 입으로 전해지는 전설을 넘어, 후세에 전해져야 할 역사로 변모하기 시작했습니다. 그리하여 환상향은 비로소 자신만의 기억을 갖게 되었습니다."
 STATIC_MODIFIER_NAME_th_genesis_of_gensokyo_institution_birth: "$th_genesis_of_gensokyo_institution$의 발상지"
 th_gensokyo_fantasy_journey_institution: "견문과 이야기"
 th_gensokyo_fantasy_journey_institution_desc: "오랜 세월 동안, 환상향의 역사는 항상 선조들과 미아레의 자손들에 의해 기록되어 왔습니다. 사람들은 대대로 전해 내려오는 이야기를 믿었고, 『환상향연기』에 기록된 모든 것을 믿었으며, 미지의 존재란 건드리기 어려운 신비로 여겼습니다. \n\n그러나 인쇄와 필사, 그리고 문학의 부흥에 따라 점점 더 많은 이야기가 인간 마을로 전해지기 시작했습니다. 그리고 그 이야기는 신이나 요괴에 관한 것만이 아니었습니다. 여행자의 견문, 상인의 경험, 학자의 연구, 무수한 평범한 사람들의 환상, 모든 것이 점차 새로운 이야기가 되었습니다. 사람들은 비로소 역사뿐만 아니라 ‘사람’의 이야기도 기록할 수 있다는 것을 깨달았습니다. \n\n이에 사람들은 익숙하고 친숙했던 마을을 떠나, 숲과 산, 호수와 늪을 탐험하기 시작했고, 세상이 움직이는 이치를 이해하려 시도하며, 조상들이 남긴 해석에 만족하기를 그만두었습니다. 신비는 여전히 존재하지만, 더 이상 단순한 공포와 금기만은 아니게 되었습니다. 사람과 요괴의 교류는 점차 늘어나고, 상업과 여행은 날로 번성하며, 새로운 사상은 길과 책을 따라 환상향 곳곳으로 전해졌습니다. \n\n바야흐로 여행자·학자·소설가의 시대가 찾아왔습니다. 노래로 전해지던 이야기에서, 스스로 경험하는 이야기로. 기록된 역사에서, 대중의 시대로."
 STATIC_MODIFIER_NAME_th_gensokyo_fantasy_journey_institution_birth: "$th_gensokyo_fantasy_journey_institution$의 발상지"
 th_heavenly_artifact_institution: "바깥세상에서 온 것들"
 th_heavenly_artifact_institution_desc: "이야기가 언덕과 마을을 가로질러 퍼지고, 경계가 거듭 넘어지기 시작했습니다. 사람들이 고개를 들어 처음으로 환상향 하늘에 걸린 달을 제대로 바라보았을 때, 한 가지 생각이 조용히 떠올랐습니다. 환상의 끝 너머에도 다른 세계가 존재하는 것은 아닐까? 바깥에서 온 것들이 결계를 넘어오기 시작했습니다. 떨어진 유물, 잃어버린 인간, 잊혀진 전설, 모두가 자신들은 '바깥'에서 왔다고 주장했습니다. 현자들은 그런 것들을 조용히 지켜볼 뿐, 쫓아내지도 받아들이지도 않았습니다. 그리고 처음으로 환상향의 사람들은 깨달았습니다. 세상은 결코 이 한 땅만이 아니었다는 것을. 먼 곳에서 온, 분류를 거부하는, 무시할 수 없는 것들이 이제 대결계의 문을 두드리고 있었습니다."
 STATIC_MODIFIER_NAME_th_heavenly_artifact_institution_birth: "$th_heavenly_artifact_institution$의 발상지"
 th_kagura_and_matsuri_institution: "카구라와 제례"
 th_kagura_and_matsuri_institution_desc: "바깥에서 온 것들의 두드림이 아직 사라지기도 전에, 환상향의 신앙이 흔들리기 시작했습니다. 모리야의 신들은 먼 산에서 내려와 한 번도 본 적 없는 기적을 베풀며 '신은 이해될 수 있다'고 선언했습니다. 하쿠레이의 무녀는 점점 차가워지는 봉납함을 바라보며, 처음으로 신도 잊힐 수 있는지 의문을 품었습니다. 신령묘의 현자는 가마를 타고 질주하며 이성을 칼로 삼았고, 명련사의 승려는 두 손을 모아 자비를 배로 삼았습니다. 인간 마을은 네 신앙이 충돌하는 판이 되었고, 모든 축제는 소리 없는 전쟁이 되었습니다. 신과 인간, 요괴와 인간, 누가 누구를 섬기는가? 그리고 누가 기억될 것인가?"
 STATIC_MODIFIER_NAME_th_kagura_and_matsuri_institution_birth: "$th_kagura_and_matsuri_institution$의 발상지"
 th_all_things_as_one_institution: "만물이 하나"
 th_all_things_as_one_institution_desc: "신앙의 소란도 조용해지기 마련입니다. 신과 인간, 요괴와 인간이 무수한 축제와 다툼을 통해 마침내 서로를 바라보았을 때, 하나의 오래된 질문이 다시 떠올랐습니다. 처음부터 같은 존재가 아니었던가? 만물은 그 뿌리에서 구별이 없으며, 인간과 요괴는 같은 환상에서 태어나고, 신과 인간은 같은 제단 앞에 서 있습니다. 인간과 요괴의 경계에 무녀로 서 있는 수호자는, 그 경계가 애초에 존재했어야 했는지 의심하기 시작했습니다. 환상향은 처음으로 '하나'라는 부름을 들었고, 그 부름은 가장 오래된 현자조차 불편하게 만들었습니다."
 STATIC_MODIFIER_NAME_th_all_things_as_one_institution_birth: "$th_all_things_as_one_institution$의 발상지"
