 th_gensokyo_culture_chronicle_desc:0 "아레의 딸은 선대의 유지를 이어받아 환상향의 기원을 편찬하였으니, 이것이 요괴들의 만상을 기록한 문화 도감입니다. 이 땅에 완전히 스며든 문화는 완벽하게 기록되어 있으나, 아직도 받아들여지지 않은 이종족들은 여전히 미완의 수수께끼로 남아 있습니다."
