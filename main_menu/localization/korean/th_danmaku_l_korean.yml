l_korean:
 th_danmaku_challenge: "탄막전 도전"
 th_danmaku_challenge_desc: "환상향 국제기구 구성국에 1대1 탄막 결투를 신청한다. 승패는 탄막 화력으로 결정되며, 결코 영토에 미치지 않는다."
 th_danmaku_challenge_title: "탄막전 도전!"
 th_danmaku_challenge_event_desc: "환상향 국제기구의 한 구성국이 우리에게 탄막 결투를 신청했다. 스펠카드 룰에 따라 승패는 탄막 화력으로 결정된다——영토가 바뀌는 일은 없다."
 th_danmaku_challenge_accept: "결투를 받아들인다"
 th_danmaku_challenge_decline: "정중히 사양한다"
 th_danmaku_win_title: "탄막 결투 승리"
 th_danmaku_win_desc: "우리의 탄막이 이겼다! 결투는 우리의 것이 되었고, 그 이름은 환상향에 울려 퍼진다. 공헌·영향력·위신을 얻고, 한동안 '탄막전 챔피언'이라는 이름을 쓴다."
 th_danmaku_lose_title: "탄막 결투 패배"
 th_danmaku_lose_desc: "결투에서 열세였다. 관례에 따라 공물을 바치고 위신을 잃었다——하지만 영토는 잃지 않았다. 이 패배는 교훈으로 삼는다."
 th_danmaku_draw_title: "탄막 결투 무승부"
 th_danmaku_draw_desc: "어느 쪽도 승리를 거머쥐지 못했다. 두 결투자의 명예는 지켜졌고, 약간의 공헌을 얻었다."
 th_danmaku_declined_title: "도전 거절"
 th_danmaku_declined_desc: "우리의 도전은 정중히 거절되었다. 결투는 열리지 않는다."
 th_danmaku_ok: "알았다"
 STATIC_MODIFIER_NAME_th_danmaku_champion_modifier: "탄막전 챔피언"
 STATIC_MODIFIER_DESC_th_danmaku_champion_modifier: "탄막 결투의 승자. 위신 +0.10/월, 관계 개선 +10%, 외교 평판 +1, 인력 +5%."
 STATIC_MODIFIER_NAME_th_title_incident_resolver_modifier: "이변 해결사"
 STATIC_MODIFIER_DESC_th_title_incident_resolver_modifier: "환상향의 이변을 해결하는 자. 위신 +0.05/월, 관계 개선 +5%."
 STATIC_MODIFIER_NAME_th_title_banquet_king_modifier: "연회의 왕"
 STATIC_MODIFIER_DESC_th_title_banquet_king_modifier: "환상향 모든 연회의 주인공. 관계 개선 +10%, 외교 평판 +1."
 STATIC_MODIFIER_NAME_th_title_fastest_in_gensokyo_modifier: "환상향 최속"
 STATIC_MODIFIER_DESC_th_title_fastest_in_gensokyo_modifier: "향에 이보다 빠른 자 없다. 인력 +3%, 위신 +0.03/월."
 STATIC_MODIFIER_NAME_th_title_danmaku_goddess_modifier: "탄막의 여신"
 STATIC_MODIFIER_DESC_th_title_danmaku_goddess_modifier: "탄막의 솜씨, 비할 데 없다. 위신 +0.10/월, 외교 평판 +1."
