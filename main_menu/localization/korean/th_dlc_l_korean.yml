l_korean:
 the_touhou_universalis_ii_key: "#T Touhou Universalis II#! #italic 东方风云II#!"
 the_touhou_universalis_ii_dlc_desc: "본 모드는 전작 《유로파 유니버설리스 4》의 동방풍운 업데이트를 기반으로 한 《동방 프로젝트》 2차 창작물입니다.\n\n서태평양에「#color_gold 환상향#!」이라는 신대륙과 수십 개의 신규 국가, 시대별 신사상을 추가했습니다. 기초 작업은 완료되어 현재 플레이 가능한 프레임 단계입니다 — 전체 구조를 체험할 수 있으나 콘텐츠는 아직 채워지는 중입니다.\n\n#bold 추천 국가:#!\n[GetCountry('T25').GetName]\n[GetCountry('T04').GetName]\n[GetCountry('T14').GetName]\n[GetCountry('T05').GetName]\n[GetCountry('T03').GetName]\n[GetCountry('T89').GetName]\n[GetCountry('T00').GetName]\n[GetCountry('T20').GetName]\n\n#bold 피드백을 기다립니다!#!\nTencent QQ 그룹: #color_very_light_blue 1021199028#!, Discord: https://discord.gg/z6JwYE8Vq.\n\n제작진 및 현지화 인원을 모집 중입니다 — Discord로 놀러오세요 OwO!\n\n#color_red 주의:#! 3D 지도 기능은 현재 정상 표시되지 않습니다. 하드웨어가 좋은 분의 도움이 필요합니다.\n\n#italic 2026.8.2 업데이트: 게임 버전 1.3.11 적용.#!"
