l_simp_chinese:
 the_touhou_universalis_ii_key: "#T 东方风云 II#! #italic Touhou Universalis II#!"
 the_touhou_universalis_ii_dlc_desc: "本 MOD 基于前作《欧陆风云 4》的东方风云 Update 制作，是《东方 Project》的二次创作。\n\n我们在西太平洋添加了一个名为「#color_gold 幻想乡#!」的全新大陆与数十个新国家，并为每个时代新增了一个新思潮。目前，东方风云 II 的基础工作已全部完成，MOD 已处于可正常游玩的空白框架阶段——你可以进入游戏体验整体架构，但需注意当前通用内容尚待后续填充，功能可能略显单薄。在正式版本中，我们还将加入更丰富的风味内容与局势，让这片大陆乃至全世界的命运由你来书写。\n\n#bold 推荐国家（右键对应国家名可查看详情）：#!\n[GetCountry('T25').GetName]（彼岸·阎魔，幻想乡国际组织领袖）\n[GetCountry('T04').GetName]（博丽·灵梦）\n[GetCountry('T14').GetName]（守矢·早苗）\n[GetCountry('T05').GetName]（迷途之家·八云紫）\n[GetCountry('T03').GetName]（人间之里）\n[GetCountry('T89').GetName]（稗田家）\n[GetCountry('T00').GetName]（红魔馆·蕾米莉亚）\n[GetCountry('T20').GetName]（地灵殿·古明地觉）\n\n#bold 我们需要你的积极反馈与建议！#!\n欢迎加入腾讯QQ交流群：#color_very_light_blue 1021199028#!，或加入 Discord：https://discord.gg/z6JwYE8Vq。如在游玩过程中发现异常也请随时反馈，你的每一条意见我们都会认真参考。\n\n制作组长期招募人员中，欢迎感兴趣的朋友们！同样招募本地化成员中，加入 Discord OwO！\n\n#color_red 注意：#!目前的 3D 地图功能暂时无法正常显示。由于作者本机电脑性能有限，难以完成相关编辑工作，因此急需招募硬件配置较强的人员参与进来，解决这一问题。\n\n#italic 2026.8.2 更新内容：已适配游戏版本 1.3.11。#!"
