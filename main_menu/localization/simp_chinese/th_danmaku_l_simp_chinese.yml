l_simp_chinese:
 th_danmaku_challenge: "弹幕战挑战"
 th_danmaku_challenge_desc: "向幻想乡国际组织的成员发起一对一的弹幕决斗。胜负由弹幕火力决定，绝不涉及领土。"
 th_danmaku_challenge_title: "弹幕战挑战！"
 th_danmaku_challenge_event_desc: "幻想乡国际组织的一位成员向我们发起了弹幕决斗。按照符卡规则，胜负由弹幕火力决断——不会有任何领土易手。"
 th_danmaku_challenge_accept: "应战"
 th_danmaku_challenge_decline: "婉言谢绝"
 th_danmaku_win_title: "弹幕决斗胜利"
 th_danmaku_win_desc: "我们的弹幕占了上风！决斗胜利，威名响彻幻想乡。贡献、影响力与威望尽入囊中，并暂时获得「弹幕战冠军」之名。"
 th_danmaku_lose_title: "弹幕决斗败北"
 th_danmaku_lose_desc: "决斗中落于下风。按惯例献上贡品并损失了威望——但并未失去任何领土。此番败北，权当教训。"
 th_danmaku_draw_title: "弹幕决斗平局"
 th_danmaku_draw_desc: "双方均未能取胜。两位决斗者各保名誉，并获得了些许贡献。"
 th_danmaku_declined_title: "挑战被拒"
 th_danmaku_declined_desc: "我们的挑战被婉言谢绝了。不会进行决斗。"
 th_danmaku_ok: "知道了"
 STATIC_MODIFIER_NAME_th_danmaku_champion_modifier: "弹幕战冠军"
 STATIC_MODIFIER_DESC_th_danmaku_champion_modifier: "弹幕决斗的胜者。威望+0.10/月，关系改善+10%，外交声誉+1，人力+5%。"
 STATIC_MODIFIER_NAME_th_title_incident_resolver_modifier: "异变解决者"
 STATIC_MODIFIER_DESC_th_title_incident_resolver_modifier: "解决幻想乡异变之人。威望+0.05/月，关系改善+5%。"
 STATIC_MODIFIER_NAME_th_title_banquet_king_modifier: "宴会之王"
 STATIC_MODIFIER_DESC_th_title_banquet_king_modifier: "幻想乡每场宴会的灵魂人物。关系改善+10%，外交声誉+1。"
 STATIC_MODIFIER_NAME_th_title_fastest_in_gensokyo_modifier: "幻想乡最速"
 STATIC_MODIFIER_DESC_th_title_fastest_in_gensokyo_modifier: "乡中无人能出其右。人力+3%，威望+0.03/月。"
 STATIC_MODIFIER_NAME_th_title_danmaku_goddess_modifier: "弹幕女神"
 STATIC_MODIFIER_DESC_th_title_danmaku_goddess_modifier: "弹幕之技天下无双。威望+0.10/月，外交声誉+1。"
