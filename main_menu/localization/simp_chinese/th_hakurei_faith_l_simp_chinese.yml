### 博丽风俗（old_hakurei）信条与切换行动 —— 设计文档《幻想乡神道「博丽风俗」神像.txt》（含后续扩展）
### 神明（第 1 槽）信条：10 常规
 th_old_hakurei_hakurei_god_aspect: "博丽神"
 th_old_hakurei_hakurei_god_aspect_desc: "博丽神社供奉着「博丽的神」，但即便是代代传承的博丽巫女，也不知晓祂的真身究竟是谁。"
 th_old_hakurei_shinki_aspect: "神绮"
 th_old_hakurei_shinki_aspect_desc: "旧时代魔界的创世之神，即使在幻想乡，她也备受崇敬与畏惧。"
 th_old_hakurei_yuka_aspect: "幽香"
 th_old_hakurei_yuka_aspect_desc: "居住在幻想乡太阳花田的顶级大妖怪，拥有远超寻常妖怪的压倒性力量，是幻想乡本土秩序的核心存在之一。"
 th_old_hakurei_sariel_aspect: "萨丽艾尔"
 th_old_hakurei_sariel_aspect_desc: "萨丽艾尔是堕落的天使。据说她诞生于天界与魔界混元交融的古老时代，在魔界扮演着举足轻重的角色。"
 th_old_hakurei_mima_aspect: "魅魔"
 th_old_hakurei_mima_aspect_desc: "魅魔是样貌鲜为人知的恶灵，但她曲折的经历，以及与博丽信仰中众多著名人物的渊源，令她的地位举足轻重。"
 th_old_hakurei_kutaka_aspect: "庭渡久侘歌"
 th_old_hakurei_kutaka_aspect_desc: "庭渡久侘歌是司职看守地狱关口的古老神明，掌管着异界口岸的秩序，同时拥有治愈咽喉疾病的祈福神力。"
 th_old_hakurei_hecatia_aspect: "赫卡提亚"
 th_old_hakurei_hecatia_aspect_desc: "赫卡提亚·拉碧斯拉祖利是掌管三界地狱的女神。尽管她从未显露过真容，但诸位阎魔对她的尊敬，足以证明她在幻想乡乃至其他境界中都是最伟大的存在。"
 th_old_hakurei_matara_aspect: "摩多罗"
 th_old_hakurei_matara_aspect_desc: "潜藏于万物背面的至高秘神，同时也是地母神、养蚕之神、星宿之神、能乐之神、障碍之神与被差别民之神。她是隐匿于世、默默守护幻想乡秩序的贤者。"
 th_old_hakurei_kasen_aspect: "华扇"
 th_old_hakurei_kasen_aspect_desc: "尽管她并非神明，且出身鬼族，但作为恪守正道的贤者，她始终站在人类一侧守护幻想乡，以善意维系着此地的安稳与秩序，因而备受敬重。"
 th_old_hakurei_yukari_aspect: "紫"
 th_old_hakurei_yukari_aspect_desc: "尽管她事实上并非神明，但作为博丽大结界的建立者与守护幻想乡的贤者，她在幻想乡同样备受尊崇。"
### 神明（第 1 槽）信条：5 专属（仅对应国家可见可选）
 th_old_hakurei_kanako_aspect: "神奈子"
 th_old_hakurei_kanako_aspect_desc: "守矢神社的祭神，山与湖的权化。身为掌管信仰的风神，她为守矢带来繁荣与旺盛的信仰。"
 th_old_hakurei_kaguya_aspect: "辉夜"
 th_old_hakurei_kaguya_aspect_desc: "永远亭的主人，月之都的公主。以月之民的睿智与神秘，在幻想乡的外交舞台上游刃有余。"
 th_old_hakurei_aki_sisters_aspect: "秋姐妹"
 th_old_hakurei_aki_sisters_aspect_desc: "丰穰之祠的祭神。掌管秋日丰收的姐妹神明，为大地带来丰饶与发展。"
 th_old_hakurei_hina_aspect: "雏"
 th_old_hakurei_hina_aspect_desc: "妖怪之森的厄神。收集灾厄、维系安宁的妖怪之森守护者，为信仰她的国度带来稳定与声望。"
 th_old_hakurei_keiki_aspect: "袿姬"
 th_old_hakurei_keiki_aspect_desc: "偶像之境的埴安神。以造物之力创造偶像，庇佑人口繁盛与声望。"
### 次要（第 2 槽）信条：4 季之力（仅信仰摩多罗时可见）
 th_old_hakurei_spring_power_aspect: "春之力"
 th_old_hakurei_spring_power_aspect_desc: "摩多罗侧神像之力。春回大地，万物复苏，人口增长。"
 th_old_hakurei_summer_power_aspect: "夏之力"
 th_old_hakurei_summer_power_aspect_desc: "摩多罗侧神像之力。盛夏繁茂，物产丰盈，加工生产产出提升。"
 th_old_hakurei_autumn_power_aspect: "秋之力"
 th_old_hakurei_autumn_power_aspect_desc: "摩多罗侧神像之力。金秋丰收，税收效率提升。"
 th_old_hakurei_winter_power_aspect: "冬之力"
 th_old_hakurei_winter_power_aspect_desc: "摩多罗侧神像之力。严冬凛冽，守御坚固，要塞防御提升。"
### 次要（第 2 槽）信条：硕果/凋零（选择秋姐妹后可选的专属）
 th_old_hakurei_bounty_aspect: "硕果"
 th_old_hakurei_bounty_aspect_desc: "选择秋姐妹后可选择的专属侧神像之力。秋日硕果累累，食物产出提升。"
 th_old_hakurei_wither_aspect: "凋零"
 th_old_hakurei_wither_aspect_desc: "选择秋姐妹后可选择的专属侧神像之力。秋风萧瑟，敌军在己方领地凋零败退，敌方损耗提升。"
### 切换行动
 th_hakurei_change_statue: "更换神明神像"
 th_hakurei_change_statue_desc: "花费宗教影响力，更换供奉的神明神像。神像切换冷却时间为 25 年。"
 th_hakurei_change_minor_aspect: "更换侧神像分神"
 th_hakurei_change_minor_aspect_desc: "花费少量宗教影响力，快速更换侧神像的季之力（信仰摩多罗）或硕果/凋零（选择秋姐妹）。"
