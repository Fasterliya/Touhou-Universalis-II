l_simp_chinese:

#革新
 th_panegyric_of_all_things_advance: "在歌颂一切之物的时代"
 th_panegyric_of_all_things_advance_desc: "在最初的时代，人们尚未将世界分为神圣或恐怖，生灵或器物。那是一个一切未名之物被歌颂的年代。薄暮与神秘笼罩着大地。而人们畏惧黑暗，而幻想————也正是在这样的传承之中诞生。"
 th_origin_dream_advance: "原初之梦"
 th_origin_dream_advance_desc: "在世界尚未被定义之前，幻想便已存在。幻想，正是世界最初的模样。所有神秘、传说、怪异、被舍弃的幻想————都会循着冥冥中的呼唤，向着这里聚拢。于是，幻想乡成为了它们最后的归宿。这是被遗忘者的乐园，亦是最初之梦。"
 th_endless_fantasy_advance: "常夜之境"
 th_endless_fantasy_advance_desc: ""
 th_gensokyo_chronicle_advance: "幻想乡缘起"
 th_gensokyo_chronicle_advance_desc: "仅仅被记载，才会成为历史。"

