l_simp_chinese:

#革新
##第一时代
 th_panegyric_of_all_things_advance: "在歌颂一切之物的时代"
 th_panegyric_of_all_things_advance_desc: "在最初的时代，人们尚未将世界分为神圣或恐怖，生灵或器物。群山、河流、大地、森林，以及那些尚未拥有名字的存在，都被一同讲述，一同歌颂。\n\n薄暮与神秘笼罩着大地，黑暗之外潜伏着无人知晓之物。人们敬畏黑暗，也畏惧未知。而那些口耳相传的故事，对于怪异的想象，对黑暗的恐惧，渐渐交织汇聚。\n\n幻想————也正是在这样的传承之中诞生。"
 th_origin_dream_advance: "最初之梦"
 th_origin_dream_advance_desc: "在世界尚未被定义之前，幻想便已存在。幻想，正是世界最初的模样。所有神秘、传说、怪异、被舍弃的幻想————都会循着冥冥中的呼唤，向着这里聚拢。于是，幻想乡成为了它们最后的归宿，亦是最初的原点。"
 th_endless_fantasy_advance: "常夜之世"
 th_endless_fantasy_advance_desc: "现实与幻想之间尚不存在明确边界————梦境能够化作真实，传闻能够孕育怪异。神秘与人共同行走在同一条道路之上，一切都沉浮于那尚未醒来的幻想之中。
 th_gensokyo_chronicle_advance: "幻想乡缘起"
 th_gensokyo_chronicle_advance_desc: "仅仅被记载，才会成为历史。传说，怪异于此被书写，被讲述，在一代又一代人的传承之中流传至今。"
 th_balance_between_youkai_and_hito_advance: "人与妖怪的平衡"
 th_balance_between_youkai_and_hito_advance_desc: "这是一个人类尚且弱小的时代。当夜幕降临，人们紧闭门窗，不敢踏出村落半步。村落之外的森林、竹林与荒野之中潜伏着无数神秘，而绝大多数人终其一生，也不曾真正知晓村落外的模样，人依靠巫女的庇护而得以安心。\n\n而妖怪则游荡于黑暗之中，以人类的畏惧为食，以流传于口耳之间的恐惧维系自身的存在。\n\n人类恐惧妖怪，而妖怪需要人类的恐惧。双方彼此对立，却又彼此依存，共同构成了这个时代的秩序。"
 th_gensokyo_sages_advance: "贤者守望"
 th_gensokyo_sages_advance_desc: "长夜未曾结束。幻想乡的贤者们静静守望着这片被幻想所眷顾的土地。他们维持着现实与幻想的边界，维持着人类与妖怪之间的均衡。而贤者只是注视着这一切。一夜又一夜，一世又一世。贤者今宵依旧如此————守望着故事，守望着传承，守望着永不终结的幻想。"
 th_spell_card_rules_advance: "符卡规则"
 th_spell_card_rules_advance_desc: "为了让妖怪之间能够以更加公平的方式解决纷争，贤者们共同确立符卡规则。自此之后，决斗不再仅仅追求胜负。弹幕成为表达自身存在与理念的方式。即使弱者，也拥有挑战强者的资格。而被称作符卡规则的契约，也成为维系幻想乡平衡的基石。"
 th_incident_resolution_advance: "异变秩序"
 th_incident_resolution_advance_desc: "对于幻想乡而言，异变本身亦是维系幻想的重要组成部分。妖怪借此展现存在。神明借此传播信仰。而人类则通过解决异变重新确立平衡。"
##第二时代
 th_age_of_stories_and_observations_advance: "流传的故事"
 th_age_of_stories_and_observations_advance_desc: "这是一个属于旅人、学者与小说家的时代。随着书籍、抄本与故事在幻想乡的广泛流传，人们开始走出熟悉的村落，前往幻想乡更遥远的地方。见闻被记录，传说被整理，「故事」将被重新讲述。"
 th_fantasy_book_compacts_advance: "风之所向"
 th_fantasy_book_compacts_advance_desc: "没有人知道风从何而来。也没有人知道它将吹向何方。有人听见远方的传闻，有人看见未曾见过的风景，有人记录旅途中的见闻，有人将它们写成新的故事。于是那些原本毫无关联的人与事，因为道路、书页与话语而彼此连接。某人到某人，从某物到某物。所有故事都随着风流向更远的地方，而幻想乡也因此开始改变。"
 th_the_distant_one_advance: "遥远之物"
 th_the_distant_one_advance_desc: "在每一个故事开始之前。总会存在一个遥不可及的目标。有人追寻那不存在的风景。有人追寻失落的历史。有人追寻自己的梦。正因为存在着无法抵达之物。人们才会不断向前。于是，故事被书写，新的时代由此开始。"
 th_scarlet_destiny_advance: "暗红命运"
 th_scarlet_destiny_advance_desc: "最初的时候，人们只是看见了远方。在雾霭以外，在妖神秘之外，似乎还有某种尚未被理解的存在。旅人踏出道路，学者翻开书页，小说家开始书写新的故事。他们不知道终点在何方。却依旧向前。未知令人恐惧。却也令人向往。于是人们第一次开始主动追寻命运。而非等待命运降临。"
 th_phantom_dreams_advance: "妖妖之梦"
 th_phantom_dreams_advance_desc: "被遗忘之物。被埋葬之物。被封印之物。那些曾经沉睡于历史深处的记忆重新苏醒。"
 th_eternal_night_advance: "永久之夜"
 th_eternal_night_advance_desc: "当世界不断扩张。边界不断被跨越。人们开始仰望更遥远的地方。故事不会因为谜题解开而结束。梦想也不会因为抵达终点而终止。而所有后来者的故事。都将从这一夜开始。"
 th_new_narratives_of_incidents_advance: "异变新叙事"
 th_new_narratives_of_incidents_advance_desc: "异变再次出现。是谁发起了异变？又为何会发起异变？那些解决异变的人们经历了什么？而每一次异变结束之后，新的物语也随之诞生。"
 th_words_like_pearls_advance: "字字珠玑"
 th_words_like_pearls_advance_desc: "人们开始相信，值得被记住的不仅仅是历史。越来越多的人提起笔墨，将所见所闻留存于纸页之间。文字因此走出学堂，进入人们的日常生活。故事会得到书写，经历会得到记载，思想会得到传播。"
 th_cartography_of_rumors_advance: "百闻录"
 th_cartography_of_rumors_advance_desc: "曾经模糊不清的世界逐渐拥有了名字，而那些未知之地，也第一次出现在纸页之上。"
 th_chronicles_of_mysteries_advance: "森罗秘闻"
 th_chronicles_of_mysteries_advance_desc: "随着旅途与交流的兴盛，越来越多的人开始记录幻想乡各地流传的奇闻异事。人们逐渐发现，即便是最离奇的秘术，也并非毫无规律可循。而隐藏于无数秘闻背后的奥秘，正等待着后来者去发掘。"
 th_danmaku_reformation_advance: "符卡改革"
 th_danmaku_reformation_advance_desc: "随着文化的繁荣，人们开始将自身经历、理念与能力融入符卡之中，符卡的华丽也成为了决胜的关键因素，无数不同的故事在弹幕之间交汇。正如书页记录文字一般，符卡也成为幻想的载体。"
 th_printing_press_adoption_advance: "印刷术"
 th_printing_press_adoption_advance_desc: "随着印刷技术逐渐普及，书籍与文献得以更快地复制与传播。过去只能依靠手工抄录的历史、传说与知识，如今能够以更高的效率保存下来，并流传至更多人的手中。"
 th_emergent_journalism_advance: "新闻业"
 th_emergent_journalism_advance_desc: "围绕村落、城镇与神社的日常见闻开始被整理、汇编，并以更稳定的形式向外传播。民众开始通过这些定期流通的刊物获取信息，理解世界。信息的流动因此加速，世界的轮廓也随之变得更加清晰。"
 th_silver_currency_standard_advance: "白银流通"
 th_silver_currency_standard_advance_desc: "白银作为货币的使用在幻想乡各地进一步扩大。早在更久远的年代，银币便已在市场之间流通，作为计价的基础。而在这一时代，随着交易范围的扩大与往来频率的增加，银币的流通规模显著增长，并逐渐成为更广泛经济活动中的通用媒介。"
##第三时代革新