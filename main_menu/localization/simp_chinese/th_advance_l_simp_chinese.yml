l_simp_chinese:

#革新
##第一时代
 th_panegyric_of_all_things_advance: "在歌颂一切之物的时代"
 th_panegyric_of_all_things_advance_desc: "在最初的时代，人们尚未将世界分为神圣或恐怖，生灵或器物。群山、河流、大地、森林，以及那些尚未拥有名字的存在，都被一同讲述，一同歌颂。\n\n薄暮与神秘笼罩着大地，黑暗之外潜伏着无人知晓之物。人们敬畏黑暗，也畏惧未知。而那些口耳相传的故事，对于怪异的想象，对黑暗的恐惧，渐渐交织汇聚。\n\n幻想————也正是在这样的传承之中诞生。"
 th_origin_dream_advance: "最初之梦"
 th_origin_dream_advance_desc: "在世界尚未被定义之前，幻想便已存在。幻想，正是世界最初的模样。所有神秘、传说、怪异、被舍弃的幻想————都会循着冥冥中的呼唤，向着这里聚拢。于是，幻想乡成为了它们最后的归宿，亦是最初的原点。"
 th_endless_fantasy_advance: "常夜之世"
 th_endless_fantasy_advance_desc: "现实与幻想之间尚不存在明确边界————梦境能够化作真实，传闻能够孕育怪异。神秘与人共同行走在同一条道路之上，一切都沉浮于那尚未醒来的幻想之中。"
 th_gensokyo_chronicle_advance: "幻想乡缘起"
 th_gensokyo_chronicle_advance_desc: "仅仅被记载，才会成为历史。传说，怪异于此被书写，被讲述，在一代又一代人的传承之中流传至今。"
 th_balance_between_youkai_and_hito_advance: "人与妖怪的平衡"
 th_balance_between_youkai_and_hito_advance_desc: "这是一个人类尚且弱小的时代。当夜幕降临，人们紧闭门窗，不敢踏出村落半步。村落之外的森林、竹林与荒野之中潜伏着无数神秘，而绝大多数人终其一生，也不曾真正知晓村落外的模样，人依靠巫女的庇护而得以安心。\n\n而妖怪则游荡于黑暗之中，以人类的畏惧为食，以流传于口耳之间的恐惧维系自身的存在。\n\n人类恐惧妖怪，而妖怪需要人类的恐惧。双方彼此对立，却又彼此依存，共同构成了这个时代的秩序。"
 th_gensokyo_sages_advance: "贤者守望"
 th_gensokyo_sages_advance_desc: "长夜未曾结束。幻想乡的贤者们静静守望着这片被幻想所眷顾的土地。他们维持着现实与幻想的边界，维持着人类与妖怪之间的均衡。而贤者只是注视着这一切。一夜又一夜，一世又一世。贤者今宵依旧如此————守望着故事，守望着传承，守望着永不终结的幻想。"
 th_spell_card_rules_advance: "符卡规则"
 th_spell_card_rules_advance_desc: "为了让妖怪之间能够以更加公平的方式解决纷争，贤者们共同确立符卡规则。自此之后，决斗不再仅仅追求胜负。弹幕成为表达自身存在与理念的方式。即使弱者，也拥有挑战强者的资格。而被称作符卡规则的契约，也成为维系幻想乡平衡的基石。"
 th_incident_resolution_advance: "异变秩序"
 th_incident_resolution_advance_desc: "对于幻想乡而言，异变本身亦是维系幻想的重要组成部分。妖怪借此展现存在。神明借此传播信仰。而人类则通过解决异变重新确立平衡。"
##第二时代
 th_age_of_stories_and_observations_advance: "流传的故事"
 th_age_of_stories_and_observations_advance_desc: "这是一个属于旅人、学者与小说家的时代。随着书籍、抄本与故事在幻想乡的广泛流传，人们开始走出熟悉的村落，前往幻想乡更遥远的地方。见闻被记录，传说被整理，「故事」将被重新讲述。"
 th_fantasy_book_compacts_advance: "风之所向"
 th_fantasy_book_compacts_advance_desc: "没有人知道风从何而来。也没有人知道它将吹向何方。有人听见远方的传闻，有人看见未曾见过的风景，有人记录旅途中的见闻，有人将它们写成新的故事。于是那些原本毫无关联的人与事，因为道路、书页与话语而彼此连接。某人到某人，从某物到某物。所有故事都随着风流向更远的地方，而幻想乡也因此开始改变。"
 th_the_distant_one_advance: "遥远之物"
 th_the_distant_one_advance_desc: "在每一个故事开始之前。总会存在一个遥不可及的目标。有人追寻那不存在的风景。有人追寻失落的历史。有人追寻自己的梦。正因为存在着无法抵达之物。人们才会不断向前。于是，故事被书写，新的时代由此开始。"
 th_scarlet_destiny_advance: "暗红命运"
 th_scarlet_destiny_advance_desc: "最初的时候，人们只是看见了远方。在雾霭以外，在妖神秘之外，似乎还有某种尚未被理解的存在。旅人踏出道路，学者翻开书页，小说家开始书写新的故事。他们不知道终点在何方。却依旧向前。未知令人恐惧。却也令人向往。于是人们第一次开始主动追寻命运。而非等待命运降临。"
 th_phantom_dreams_advance: "妖妖之梦"
 th_phantom_dreams_advance_desc: "被遗忘之物。被埋葬之物。被封印之物。那些曾经沉睡于历史深处的记忆重新苏醒。"
 th_eternal_night_advance: "永久之夜"
 th_eternal_night_advance_desc: "当世界不断扩张。边界不断被跨越。人们开始仰望更遥远的地方。故事不会因为谜题解开而结束。梦想也不会因为抵达终点而终止。而所有后来者的故事。都将从这一夜开始。"
 th_new_narratives_of_incidents_advance: "异变新叙事"
 th_new_narratives_of_incidents_advance_desc: "异变再次出现。是谁发起了异变？又为何会发起异变？那些解决异变的人们经历了什么？而每一次异变结束之后，新的物语也随之诞生。"
 th_words_like_pearls_advance: "字字珠玑"
 th_words_like_pearls_advance_desc: "人们开始相信，值得被记住的不仅仅是历史。越来越多的人提起笔墨，将所见所闻留存于纸页之间。文字因此走出学堂，进入人们的日常生活。故事会得到书写，经历会得到记载，思想会得到传播。"
 th_cartography_of_rumors_advance: "百闻录"
 th_cartography_of_rumors_advance_desc: "曾经模糊不清的世界逐渐拥有了名字，而那些未知之地，也第一次出现在纸页之上。"
 th_chronicles_of_mysteries_advance: "森罗秘闻"
 th_chronicles_of_mysteries_advance_desc: "随着旅途与交流的兴盛，越来越多的人开始记录幻想乡各地流传的奇闻异事。人们逐渐发现，即便是最离奇的秘术，也并非毫无规律可循。而隐藏于无数秘闻背后的奥秘，正等待着后来者去发掘。"
 th_danmaku_reformation_advance: "符卡改革"
 th_danmaku_reformation_advance_desc: "随着文化的繁荣，人们开始将自身经历、理念与能力融入符卡之中，符卡的华丽也成为了决胜的关键因素，无数不同的故事在弹幕之间交汇。正如书页记录文字一般，符卡也成为幻想的载体。"
 th_printing_press_adoption_advance: "印刷术"
 th_printing_press_adoption_advance_desc: "随着印刷技术逐渐普及，书籍与文献得以更快地复制与传播。过去只能依靠手工抄录的历史、传说与知识，如今能够以更高的效率保存下来，并流传至更多人的手中。"
 th_emergent_journalism_advance: "新闻业"
 th_emergent_journalism_advance_desc: "围绕村落、城镇与神社的日常见闻开始被整理、汇编，并以更稳定的形式向外传播。民众开始通过这些定期流通的刊物获取信息，理解世界。信息的流动因此加速，世界的轮廓也随之变得更加清晰。"
 th_silver_currency_standard_advance: "白银流通"
 th_silver_currency_standard_advance_desc: "白银作为货币的使用在幻想乡各地进一步扩大。早在更久远的年代，银币便已在市场之间流通，作为计价的基础。而在这一时代，随着交易范围的扩大与往来频率的增加，银币的流通规模显著增长，并逐渐成为更广泛经济活动中的通用媒介。"
##第三时代革新
 th_boundary_gaze_advance: "凝视边界"
 th_boundary_gaze_advance_desc: "大结界第一次不再被视为「墙」，而成为「研究对象」。学者与贤者在结界边缘扎营，记录它的波动、裂隙与呼吸。"
 th_rumors_of_the_outside_advance: "外界的传闻"
 th_rumors_of_the_outside_advance_desc: "越过结界的风带来外界的声音。人们开始交换关于「外面」的传闻——那里的天空没有妖怪，那里的人不再相信神明。"
 th_gateway_research_advance: "通途探索"
 th_gateway_research_advance_desc: "有人声称在森林深处发现了结界的薄弱处。探索队出发了。有人回来，有人没有。但道路，第一次被标记在地图上。"
 th_outside_contact_advance: "初遇外界"
 th_outside_contact_advance_desc: "幻想乡第一次与外界文明产生对话。语言不同，规则不同，但茶馆里开始出现来自「那边」的器物与故事。"
 th_return_of_the_sealed_advance: "归还者"
 th_return_of_the_sealed_advance_desc: "曾经被封印、被放逐、被遗忘的人与物，开始陆续归来。他们带回了外界的记忆——也带回了足以动摇幻想乡根基的疑问。"
 th_lunar_almanac_advance: "月相之书"
 th_lunar_almanac_advance_desc: "人们开始以纸笔记录月相、月食与潮汐。月亮第一次从「神明」变为「可以被观测的对象」。"
 th_moon_dialogue_advance: "与月对话"
 th_moon_dialogue_advance_desc: "传说月之民在月面注视着幻想乡。有人尝试回应月光，有人尝试以术法登月。对话尚未开始，但邀请已经发出。"
 th_eternity_rumor_advance: "不死之谈"
 th_eternity_rumor_advance_desc: "关于永远亭的传说再度流传——蓬莱之药、不老不死、被放逐的月之姬。死亡不再是不可触碰的禁忌，而成为被讨论的话题。"
 th_empirical_eye_advance: "实证之眼"
 th_empirical_eye_advance_desc: "科学论者宣称「唯有可被验证的才值得相信」。第一次，幻想本身被摆上了实验台。"
 th_gensokyo_law_advance: "幻想乡法"
 th_gensokyo_law_advance_desc: "将各地零散的风俗规矩汇编为统一的成文法典籍，条理分明、条目清晰。"
 th_old_learning_advance: "旧学独传"
 th_old_learning_advance_desc: "教学只以古旧典籍作为正统依据，不接纳外来学问与新兴学说。"
 th_education_for_all_advance: "有教无类"
 th_education_for_all_advance_desc: "仿照寺子屋模式的正规私塾逐步兴起，读书识字不再是少数人的特权。"
 th_farming_and_education_advance: "农教并重"
 th_farming_and_education_advance_desc: "推行教化与农耕并举的模式，学识修习与田间实践并行，两方面都不荒废。"
 th_common_sense_erosion_advance: "常识渗透"
 th_common_sense_erosion_advance_desc: "外界的常识如水般渗入幻想乡。妖怪发现人们不再害怕自己。被理解，是妖怪最深的恐惧。"
 th_heavenly_incidents_advance: "天外异变"
 th_heavenly_incidents_advance_desc: "新的异变来自天外——坠落的器物、失衡的月相、无法归类的现象。贤者第一次面对「无法命名」的异变。"

##第四时代：神乐与祭囃
 th_essence_of_faith_advance: "信仰的本相"
 th_essence_of_faith_advance_desc: "当四方的神明与僧侣在人间之里各执一词，人们终于开始追问那个最根本的问题——信仰的力量，究竟源于神，还是源于人心中那份愿意相信的幻想？幻想乡第一次把信仰本身当作审视的对象。"
 th_faith_and_doubt_advance: "信与疑"
 th_faith_and_doubt_advance_desc: "质疑不再是亵渎。敢问「神是否存在」的人，与虔诚供奉的人一样多——而人们渐渐发现，唯有经过怀疑的信仰，才真正牢不可破。"
 th_god_and_mortal_advance: "神人同席"
 th_god_and_mortal_advance_desc: "神明走下神龛，与凡人同坐于茶席之间；妖怪也第一次在祭典上与人类并肩而立。神与人的界限开始模糊，而这种模糊，让信仰变得前所未有的亲近。"
 th_sacred_music_advance: "祭囃之章"
 th_sacred_music_advance_desc: "鼓声、笛声与神乐之舞，成为沟通神人最古老也最普遍的语言。当祭囃在幻想乡各处奏响，人们相信——神听的见这声音，而人，也在这声音里听见了自己。"
 th_festival_protocol_advance: "祭典仪轨"
 th_festival_protocol_advance_desc: "祭典不再只是民间的狂欢。幻想乡各地开始订立统一的祭祀规范——何时击鼓、如何献舞、何种祭品合宜。仪式越是庄严，信仰便越是凝重，也越是虔诚。"
 th_schism_of_belief_advance: "信仰的分裂"
 th_schism_of_belief_advance_desc: "同一片幻想，在守矢与博丽、命莲寺与仙界眼中各执一词。分裂并非灾难——人们开始明白，唯有经历过裂痕，信仰才真正走向成熟。"
 th_reform_of_rites_advance: "礼仪改革"
 th_reform_of_rites_advance_desc: "旧的祭祀方式被认为不合时宜，各地开始革新仪式——简化繁文，重编神乐，让信仰跟上时代。改革的火焰，烧遍了幻想乡的每一座神社与寺庙。"
 th_pilgrimage_roads_advance: "参道之兴"
 th_pilgrimage_roads_advance_desc: "朝圣的道路贯通幻想乡，信徒沿着参道踏上旅途。信仰第一次有了地理的形态——山川、庙宇与神社，因一条条参道而连成了一张网。"
 th_human_divinity_advance: "人之神圣"
 th_human_divinity_advance_desc: "人们渐渐发现：无需神迹，人之善行本身即含神圣。当妖怪与人类都在德行中看见光辉，信仰便不再只是对神明的仰望，也是对人自身的礼赞。"
 th_faith_as_power_advance: "信仰即力"
 th_faith_as_power_advance_desc: "信仰被理解为一种可以积累、可以争夺的力量。香火、人心与声望，都成为诸势力竞逐的资源——祭典即战场，而虔诚，是最好的兵刃。"
 th_eternal_question_advance: "神之存续"
 th_eternal_question_advance_desc: "时代行至尽头，幻想乡共同面对最后一个问题——若信仰终将改变，神明将以何种形态继续存在？有人以神乐延续其名，有人以故事承载其灵，而神明的存续，从此取决于人的记忆。"

##第五时代：万物一心
 th_oneness_philosophy_advance: "一体之理"
 th_oneness_philosophy_advance_desc: "信仰的喧嚣散去之后，哲学家开始论证一个古老的命题——万物本出于同一幻想。人与妖、神与人，不过是同一片幻想的不同映照。幻想乡第一次听见了「一体」的哲学。"
 th_dissolution_of_boundary_advance: "界限之解"
 th_dissolution_of_boundary_advance_desc: "人妖之界、神人之界、现世与幻想之界，皆被重新审视。界限究竟是天然的，还是人为的？当人们开始怀疑这道线，它便已悄悄松动。"
 th_common_destiny_advance: "共同命运"
 th_common_destiny_advance_desc: "面对天外之物与未知，幻想乡各国第一次意识到彼此共享同一命运。分歧依旧，但没有人再能假装自己是孤岛——风，会把一切吹向同一处。"
 th_unity_of_orders_advance: "万律归一"
 th_unity_of_orders_advance_desc: "各国纷杂的律法被重新审视——是否存在着所有幻想乡国家都应遵循的「一」？当纷乱的规矩开始汇向同一部秩序，统一便不再是梦想。"
 th_great_unification_advance: "大同之制"
 th_great_unification_advance_desc: "超越单个势力的统一架构第一次有了蓝图——幻想乡作为整体而存在，不再只是诸国的拼合。大同之制悬而未决，但已经有人开始构想它。"
 th_center_and_periphery_advance: "中心与边缘"
 th_center_and_periphery_advance_desc: "统一的浪潮中，中央与边缘的关系被重新定义。边缘不再是待征服的对象——每一片土地，都以自己的方式参与「一」的构成。"
 th_order_within_chaos_advance: "混沌有序"
 th_order_within_chaos_advance_desc: "幻想乡的本质是破碎与混沌，而人们开始学习在混沌之中建立不摧毁它的秩序。正如结界之内万象并存——有序与无序，本就是一体两面。"
 th_collective_identity_advance: "共同体认"
 th_collective_identity_advance_desc: "超越种族与信仰的「幻想乡民」认同开始形成。当人们自称「我是幻想乡的居民」而非「我是某国的子民」，一体的时代便已悄然降临。"
 th_barrier_and_oneness_advance: "结界与一"
 th_barrier_and_oneness_advance_desc: "大结界究竟是隔离之墙，还是包容之壳？它既守护着分裂，也承载着统一——人们第一次明白，结界不是「一」的障碍，而是「一」的容器。"
 th_guardians_of_order_advance: "秩序守望"
 th_guardians_of_order_advance_desc: "谁有权定义「一」？贤者与守护者在统一时代被重新拷问。巫女不再只是分隔者，贤者也不再只是旁观者——他们都必须回答：自己守护的，究竟是什么。"
 th_eternal_diversity_advance: "殊途同归"
 th_eternal_diversity_advance_desc: "时代终章的洞见——真正的「一」不必消灭差异。万物各有其道，妖怪归山，人类归里，神明归祠，却都归于同一片幻想。殊途，终是同归。"