###CULTURE_START
 acgv_touhou_fairy_culture: "妖精"
 acgv_touhou_fairy_culture_desc: "由大地生机所生的自然精灵，在幻想乡中无忧无虑地嬉闹。身躯纤弱却为数众多，她们的恶作剧造就了这片土地日常的奇迹。"
 acgv_touhou_doubutsu_goast_culture: "动物灵"
 acgv_touhou_doubutsu_goast_culture_desc: "觉醒为妖怪的兽类，从睿智的狐与豪迈的狸，到平凡的猫与兔。它们行于兽之道，借岁月与传说积累力量。"
 acgv_touhou_haniyasushin_culture: "造型神"
 acgv_touhou_haniyasushin_culture_desc: "大地之神工，以粘土与岩石塑成生命的容器。作为技艺与创造的守护者，他们栖于泥土与灵性交汇之处。"
 acgv_touhou_goast_culture: "幽灵"
 acgv_touhou_goast_culture_desc: "因未尽之执念而滞留于幻想乡的漂泊之魂。虚幻而哀伤，他们在生者之世与彼岸之间徘徊。"
 acgv_touhou_eastern_kami_culture: "神明"
 acgv_touhou_eastern_kami_culture_desc: "幻想乡山岳、神社与圣地的神明。古老而超然，他们依靠信仰与土地上子民的敬仰而存续。"
 acgv_touhou_oni_culture: "鬼族"
 acgv_touhou_oni_culture_desc: "强大而骄傲的山之居民，蛮力与尘世欲望的主人。曾令整个幻想乡畏惧，如今大多隐居于世。"
 acgv_touhou_reonna_culture: "妖兽"
 acgv_touhou_reonna_culture_desc: "凭本能与野性之力而活的妖兽。坦率直爽，视力量为至上，鄙夷诡计。"
 acgv_touhou_eastern_youkai_culture: "妖怪"
 acgv_touhou_eastern_youkai_culture_desc: "由人类的恐惧与惊奇所生的幻想乡万般妖怪。各自独一无二，受自身的本性、传说与弱点所束缚。"
 acgv_touhou_lunar_culture: "月之民"
 acgv_touhou_lunar_culture_desc: "永生的月之民，继承了无与伦比的纯净与长寿文明。他们以遥远而安详的目光俯视大地众生。"
 acgv_touhou_scarlet_culture: "红魔馆"
 acgv_touhou_scarlet_culture_desc: "栖身于红魔馆的吸血鬼及其仆从。猩红之夜、优雅的颓废与对禁忌之物的渴求之家。"
 acgv_touhou_tsugumogami_culture: "付丧神"
 acgv_touhou_tsugumogami_culture_desc: "度过百年岁月后获得生命的器物与珍宝。它们忠心事主——若被抛弃，则起而反抗。"
 acgv_touhou_makai_culture: "魔界"
 acgv_touhou_makai_culture_desc: "境界彼端的魔界，由魔界的魔法使统治。魔法与无序之地，宏伟与琐碎的阴谋交织其间。"
 acgv_touhou_poltergeist_culture: "骚灵"
 acgv_touhou_poltergeist_culture_desc: "以幻影演奏萦绕红魔馆的骚灵乐手。顽皮而才华横溢，她们以无形之音编织旋律。"
 acgv_touhou_seikai_culture: "仙界"
 acgv_touhou_seikai_culture_desc: "仙人的宁静乐园，开悟者在其中修习超脱之术。时光缓缓流淌，仙人们精进着他们的永生。"
 acgv_touhou_shinkirou_culture: "心绮楼"
 acgv_touhou_shinkirou_culture_desc: "蜃气楼之民，栖于现实与幻象的边缘。身为梦幻的主宰，他们模糊了存在与表象的界限。"
 acgv_touhou_western_youkai_culture: "西方妖怪"
 acgv_touhou_western_youkai_culture_desc: "越过境界进入幻想乡的西方异邦之魔。古老而世故，他们带来了远方的传说。"
 acgv_touhou_kaguya_culture: "永远亭"
 acgv_touhou_kaguya_culture_desc: "永远亭中月之公主的宫廷，由永生的月人守护。在这里，医药与炼金术为永恒本身效力。"
 acgv_touhou_myoukai_culture: "冥界"
 acgv_touhou_myoukai_culture_desc: "死者静驻于庭园之中的广大冥界。其幽灵居民在安详的寂静中履行着各自的职责。"
 acgv_touhou_kappa_culture: "河童"
 acgv_touhou_kappa_culture_desc: "擅长机关与发明的河之妖怪。好奇、勤勉、永远偏爱黄瓜，他们守护着幻想乡的水道。"
 acgv_touhou_yamawaru_culture: "山童"
 acgv_touhou_yamawaru_culture_desc: "山中的孩童般精灵，河童的近亲。他们居于峰顶，捉弄旅人，也会帮助自己中意的人。"
 acgv_touhou_tengu_culture: "天狗"
 acgv_touhou_tengu_culture_desc: "统御风与高天的骄傲山妖。迅捷而严明，他们自高处俯瞰幻想乡，是消息与传统的守护者。"
 acgv_touhou_western_kami_culture: "外界神"
 acgv_touhou_western_kami_culture_desc: "为寻求信仰与新家而从外界越过境界的神明。他们将外来的崇敬与这片土地的本土信仰相融合。"
 acgv_touhou_higan_culture: "彼岸"
 acgv_touhou_higan_culture_desc: "三途川的彼岸，亡者在此受审。其居民——死神与摆渡人——执行着冥界不偏不倚的公务。"
 acgv_touhou_hibito_culture: "小人族"
 acgv_touhou_hibito_culture_desc: "隐秘国度的小人一族，其工艺与药方品质非凡。他们居于世界的缝隙之中，难得一见，备受珍视。"
 acgv_touhou_kamui_culture: "神灵"
 acgv_touhou_kamui_culture_desc: "统御山岳与森林的北方大国灵。既受崇拜亦令人畏惧，他们是自然之力的化身。"
 acgv_touhou_yakubyougami_culture: "疫病神"
 acgv_touhou_yakubyougami_culture_desc: "行至何处便带去灾厄与疾病的疫病神。令人畏惧、遭人回避，却也能解除自己所降下的诅咒。"
 acgv_touhou_chireiden_culture: "地灵殿"
 acgv_touhou_chireiden_culture_desc: "旧地狱的地灵殿，地灵们在此执掌宫廷。其居民统御着地热深渊与其间的火之野兽。"
 acgv_touhou_ningyou_culture: "蓬莱人形"
 acgv_touhou_ningyou_culture_desc: "超自然世界的人偶，从地下室沉眠的七人偶到魔法使们数之不尽的傀儡。小小的躯壳，承载着伟大的心灵。"
 acgv_touhou_yumemi_culture: "梦幻世界"
 acgv_touhou_yumemi_culture_desc: "梦境与幻想的流变之国，想象在此化作实体。其居民漂游于世间沉睡的心灵之中。"
 acgv_touhou_yakumo_culture: "迷途之家"
 acgv_touhou_yakumo_culture_desc: "幻想乡边缘的迷宫般的居所，境界操纵者的家园。一个方向会迷失、时间会变得奇异的所在。"
 acgv_touhou_gensokyo_hito_culture: "幻想乡人类"
 acgv_touhou_gensokyo_hito_culture_desc: "人间之里的凡人，在大结界下与妖怪比邻而居。身体纤弱，精神坚韧，他们的技艺支撑着这片土地。"
 acgv_touhou_myouren_culture: "命莲寺"
 acgv_touhou_myouren_culture_desc: "接纳寻求救赎之妖怪的佛寺，僧侣与信徒在此庇护他们。在这里，信仰为最迷途的魂魄也准备了第二条路。"
 acgv_touhou_tennin_culture: "天界"
 acgv_touhou_tennin_culture_desc: "幻想乡之上的天界，天人与其神侍在永恒的极乐中安居。他们的乐声与舞姿回荡于云间。"
 acgv_touhou_tokoyo_culture: "常世神"
 acgv_touhou_tokoyo_culture_desc: "海之彼方的常世之国，古老的珍宝与仙人曾由此而来。一个存在于时间之外的传说之地。"
###CULTURE_END

###TRAITS_START
 touhou_reimu_traits: "乐园的巫女"
 touhou_reimu_traits_desc: "以弹幕与信念解决幻想乡异变的博丽巫女。她所立之处，便是这片土地的平衡所在。"
 touhou_akyuu_traits: "御阿礼之子"
 touhou_akyuu_traits_desc: "人间之里的年轻记述者，她的梦想是有朝一日写下一本堪与《幻想乡缘起》媲美、记录幻想乡奇观的书籍。"
