 th_cc_desc_th_vampire_culture:0 "$BULLET$主要危险度：极高（频度：低；多样性：极低）\n$BULLET$主要遭遇：任何地点（时间：夜间）\n$BULLET$特征：幻想乡最强的#E妖怪#!种族，力量平衡的支柱之一，被称为「夜晚的帝王」。\n以人类血液为主食，被吸干血液的人会变成#E丧尸#!，听其指挥，被阳光照到就会崩溃。与妖怪们战斗落败后，双方缔结#E契约#!：妖怪提供作为食物的人类，吸血鬼不得袭击幻想乡的人类，契约至今有效。\n拥有惊人的力量与魔力，但弱点也很明显：害怕阳光和流水，不敢靠近沙丁鱼头和柊树枝，被炒豆打中皮肤会烧伤。"
