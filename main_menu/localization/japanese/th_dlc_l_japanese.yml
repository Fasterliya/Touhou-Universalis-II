 the_touhou_universalis_ii_key: "#T Touhou Universalis II#! #italic 東方風雲II#!"
 the_touhou_universalis_ii_dlc_desc: "本MODは前作『Europa Universalis 4』の東方風雲アップデートを基にした、『東方Project』の二次創作です。\n\n西太平洋に「#color_gold 幻想郷#!」という新大陸と数十の新国家、各時代に新思潮を追加しました。基礎作業は完了し、現在はプレイ可能なフレーム段階です——全体の構造を体験できますが、汎用コンテンツは今後充実していきます。\n\n#bold おすすめ国家:#!\n[GetCountry('T25').GetName]\n[GetCountry('T04').GetName]\n[GetCountry('T14').GetName]\n[GetCountry('T05').GetName]\n[GetCountry('T03').GetName]\n[GetCountry('T89').GetName]\n[GetCountry('T00').GetName]\n[GetCountry('T20').GetName]\n\n#bold フィードバックをお待ちしています！#!\nTencent QQグループ: #color_very_light_blue 1021199028#!、Discord: https://discord.gg/z6JwYE8Vq。\n\n制作チームはメンバーとローカライザーを募集しています——Discordへどうぞ OwO！\n\n#color_red 注意:#! 3Dマップは現在正常に表示できません。高性能なハードウェアをお持ちの方の協力を募集中です。\n\n#italic 2026.8.2 更新: ゲームバージョン 1.3.11 に対応。#!"
