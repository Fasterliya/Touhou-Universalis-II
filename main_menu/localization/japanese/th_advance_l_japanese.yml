l_japanese:

#革新
##第一时代
 th_panegyric_of_all_things_advance: "凡百ノ物ヲ謳歌セシ時代"
 th_panegyric_of_all_things_advance_desc: "最初の時代、人々は未だ世界を神聖なるものと恐ろしきもの、生きとし生けるものと器とに分かちたらず。群山、河流、大地、森林、そして未だ名を持たざる存在も、ともに語られ、ともに謳われたり。\n\n薄暮と神秘は大地を覆い、闇の彼方には知る者なきものが潜みたり。人々は闇を畏れ、未知を恐れたり。而して口伝の物語、怪異への想像、闇への恐懼は、やがて交錯し集結せり。\n\n幻想——かくてその伝承の中にこそ生まれ出でたり。"
 th_origin_dream_advance: "最初ノ夢"
 th_origin_dream_advance_desc: "世界が未だ定義せられざる先より、幻想は既に存在せり。幻想こそ、世界の最初の姿なり。凡べての神秘、伝説、怪異、棄てられし幻想は——冥々の呼び声に従いて、此処に集い来たる。かくて幻想郷は、それらの最後の帰趨となり、また最初の原点となりぬ。"
 th_endless_fantasy_advance: "常夜ノ世"
 th_endless_fantasy_advance_desc: "現実と幻想の間に未だ明確なる境界は存在せず——夢は現実と化し、噂は怪異を孕み得たり。神秘と人は同じ道を共に歩み、全ては未だ覚醒せざる幻想の中に浮沈せり。"
 th_gensokyo_chronicle_advance: "幻想郷縁起"
 th_gensokyo_chronicle_advance_desc: "記録せられてのみ、歴史と為る。伝説、怪異は此処に記され、語られ、代々の伝承の中に伝わりて今日に至れり。"
 th_balance_between_youkai_and_hito_advance: "人間ト妖怪ノ均衡"
 th_balance_between_youkai_and_hito_advance_desc: "これは人間が未だ弱かりし時代なり。夜の帷が下りる時、人々は戸を閉ざし、村の外に一歩も踏み出さず。村外れの森、竹林、荒野には無数の神秘が潜み、ほとんどの者は一生を終えるまで村の外の様を真に知ることはなかりき。人は巫女の庇護に依りて安らぎを得たり。\n\n妖怪は暗黒の中に彷徨い、人間の恐懼を糧とし、口伝の恐怖に依りて自らの存在を繋ぎ止めたり。\n\n人間は妖怪を恐れ、妖怪は人間の恐懼を必要とす。両者は互いに対立しつつも、互いに依存し合いて、この時代の秩序を共に築きたり。"
 th_gensokyo_sages_advance: "賢者ノ見守リ"
 th_gensokyo_sages_advance_desc: "長夜は未だ終わりたらず。幻想郷の賢者たちは、幻想に愛でられしこの地を静かに見守れり。彼らは現実と幻想の境界を保ち、人間と妖怪の均衡を維持せり。而して賢者は唯、全てを見守るのみ。一夜また一夜、一世また一世。賢者は今宵もまた然り——物語を見守り、伝承を見守り、終わることなき幻想を見守る。"
 th_spell_card_rules_advance: "スペルカード規則"
 th_spell_card_rules_advance_desc: "妖怪たちがより公平なる方法で紛争を解決せんが為、賢者たちは共同してスペルカード規則を確立せり。此れより後、決闘は単なる勝敗を求めるものに非ず。弾幕は自らの存在と理念を表現する手段と為れり。弱き者といえども、強き者に挑む資格を持つ。スペルカード規則と呼ばれし契約は、幻想郷の均衡を支える基盤とも成りぬ。"
 th_incident_resolution_advance: "異変秩序"
 th_incident_resolution_advance_desc: "幻想郷にとって、異変そのものもまた幻想を繋ぐ重要な構成要素なり。妖怪は此れに依りて存在を示し、神々は此れに依りて信仰を広め、人間は異変を解決することに依りて均衡を再び確立す。"
##第二时代
 th_age_of_stories_and_observations_advance: "伝承ノ物語"
 th_age_of_stories_and_observations_advance_desc: "これは旅人、学者、小説家の時代なり。書籍、抄本、物語が幻想郷に広く流布するに伴い、人々は見知らぬ村を出でて、幻想郷のより遠き地へと向かい始めたり。見聞は記録され、伝説は整理され、「物語」は新たに語り直されん。"
 th_fantasy_book_compacts_advance: "風ノ向カウ先"
 th_fantasy_book_compacts_advance_desc: "風が何処より来たるか、誰も知らず。また何処へ吹き行くかも知る者なし。遠方の噂を聞く者あり、未だ見ざる風景を観る者あり、旅の見聞を記す者あり、それらを新たな物語に綴る者あり。かくて元より関わり無かりし人と事は、道と書頁と言葉に依りて互いに結ばれたり。某より某へ、某より某へ。全ての物語は風と共により遠き地へと流れ、幻想郷は此れに依りて変わり始めたり。"
 th_the_distant_one_advance: "遠キモノ"
 th_the_distant_one_advance_desc: "凡べての物語が始まる以前。常に遥かに届かざる目標ありき。ある者は存在せざる風景を追い、ある者は失われし歴史を追い、ある者は自らの夢を追う。届かざるものが在ればこそ。人々は絶えず前進せり。かくて物語は記され、新たな時代は此処に始まれり。"
 th_scarlet_destiny_advance: "暗紅ノ運命"
 th_scarlet_destiny_advance_desc: "最初、人々は唯、遠方を視たるのみ。霧の彼方、妖神秘の外に、未だ理解せざる何ものかが在るが如し。旅人は道を踏み出し、学者は書頁を繰り、小説家は新たな物語を書き始めたり。彼らは終点の在り処を知らず。されど前進せり。未知は人を恐れしむ。されどまた憧れしむ。かくて人々は初めて、自ら運命を追い求めることを始めたり。運命の到来を待つのみに非ずして。"
 th_phantom_dreams_advance: "妖妖ノ夢"
 th_phantom_dreams_advance_desc: "忘れられしもの。葬り去られしもの。封ぜられしもの。曾て歴史の深き眠りに就きし記憶、再び目覚めたり。"
 th_eternal_night_advance: "永久ノ夜"
 th_eternal_night_advance_desc: "世界が絶えず拡がり行くとき。境界は絶えず越えられ行くとき。人々はより遠き地を仰ぎ始めたり。物語は謎が解かれし故に終わるものに非ず。夢もまた終点に至りし故に止むものに非ず。而して全ての後継者の物語は。この夜より始まる。"
 th_new_narratives_of_incidents_advance: "異変新叙事"
 th_new_narratives_of_incidents_advance_desc: "異変、再び現る。誰が異変を起こしし？何故に異変を起こしし？異変を解決せし人々は何を経験せし？而して異変の終わる毎に、新たな物語もまた生まれ出づ。"
 th_words_like_pearls_advance: "字字珠璣"
 th_words_like_pearls_advance_desc: "人々は、記憶するに値するは歴史のみにあらざることを信じ始めたり。ますます多くの者が筆を執り、見聞きせしものを紙の間に留めたり。文字はかくて学舎を出でて、人々の日常の中に入り込めり。物語は記され、経験は録され、思想は伝えられん。"
 th_cartography_of_rumors_advance: "百聞録"
 th_cartography_of_rumors_advance_desc: "曾て曖昧朦朧とせし世界は次第に名を持ち、未知の地もまた初めて紙の上に現れたり。"
 th_chronicles_of_mysteries_advance: "森羅秘聞"
 th_chronicles_of_mysteries_advance_desc: "旅と交流の興隆に伴い、ますます多くの者が幻想郷の各地に伝わる奇聞異事を記し始めたり。人々は漸く、最も奇異なる秘術と雖も、全く規則無きに非ざることを発見せり。而して無数の秘聞の陰に隠れし奥義は、後継者の発見を待ちたり。"
 th_danmaku_reformation_advance: "スペルカード改革"
 th_danmaku_reformation_advance_desc: "文化の繁栄に伴い、人々は自らの経験、理念、能力をスペルカードに融け込ましめ始めたり。スペルカードの華麗さもまた勝敗を決する鍵と為り、無数の異なる物語が弾幕の間に交錯せり。書頁が文字を記す如く、スペルカードもまた幻想の器と為れり。"
 th_printing_press_adoption_advance: "印刷術"
 th_printing_press_adoption_advance_desc: "印刷技術の漸次的普及に伴い、書籍と文献はより速やかに複製され伝播することを得たり。過去には手書きによる筆写のみに頼りし歴史、伝説、知識も、今やより高き効率にて保存せられ、より多き人々の手に伝わり得るものと為れり。"
 th_emergent_journalism_advance: "新聞業"
 th_emergent_journalism_advance_desc: "村々、町々、神社にまつわる日常の見聞が整理され、編纂され、より安定的なる形式にて外部へ伝えられ始めたり。民衆はこれら定期刊行物を通じて情報を取得し、世界を理解することを覚えたり。情報の流れはかくて加速し、世界の輪郭もまたより鮮明と為れり。"
 th_silver_currency_standard_advance: "白銀流通"
 th_silver_currency_standard_advance_desc: "白銀が通貨として用いられること、幻想郷の各地に更に拡大せり。遥か昔より、銀貨は既に市場の間に流通し、価格の基準として用いられたり。而してこの時代、取引範囲の拡大と往来頻度の増加に伴ひ、銀貨の流通規模は著しく増大し、漸くより広き経済活動における一般の媒介と為れり。"
##第三时代革新
 th_boundary_gaze_advance: "境界ヲ凝視ス"
 th_boundary_gaze_advance_desc: "大結界は初めて「壁」と見なされず、「研究の対象」と為れり。学者と賢者は結界の縁に野営し、その波動、亀裂、息吹を記録せり。"
 th_rumors_of_the_outside_advance: "外界ノ噂"
 th_rumors_of_the_outside_advance_desc: "結界を越ゆる風は、外界の声を運び来たり。人々は「外」の噂を交はし始めたり——そこの空には妖怪なく、そこの人々は神を信ぜざるなり。"
 th_gateway_research_advance: "通途探索"
 th_gateway_research_advance_desc: "森の深き処に結界の薄弱点を見出せしと称する者あり。探索隊は出立せり。帰り来し者あり、帰らざる者あり。されど道は、初めて地図の上に記されぬ。"
 th_outside_contact_advance: "外界トノ初会"
 th_outside_contact_advance_desc: "幻想郷は初めて外界の文明と対話せり。言葉異なり、掟も異なれど、茶屋には「あちら」よりの器物と物語が現れ始めぬ。"
 th_return_of_the_sealed_advance: "帰還者"
 th_return_of_the_sealed_advance_desc: "曾て封ぜられ、追放され、忘れられし人と物は、続々と帰り来たり。彼らは外界の記憶を持ち帰りたり——幻想郷の根幹を揺るがすに足る問ひもまた共に。"
 th_lunar_almanac_advance: "月相ノ書"
 th_lunar_almanac_advance_desc: "人々は月相、月食、潮汐を紙筆に記し始めたり。月は初めて「神」より「観測し得る対象」と為れり。"
 th_moon_dialogue_advance: "月トノ対話"
 th_moon_dialogue_advance_desc: "月の民は月面より幻想郷を見守ると伝ふ。月光に応ぜんと試みる者あり、術法にて月へ登らんと試みる者あり。対話は未だ始まりたらず——されど招待状は既に送られたり。"
 th_eternity_rumor_advance: "不死ノ談"
 th_eternity_rumor_advance_desc: "永遠亭の伝説が再び流布せり——蓬莱の薬、不老不死、追放されし月の姫。死は最早、触れ得ざる禁忌に非ず、語るべき題目と為れり。"
 th_empirical_eye_advance: "実証ノ眼"
 th_empirical_eye_advance_desc: "科学論者は「検証し得るもののみ信ずるに値す」と宣べたり。初めて、幻想そのものが実験台に載せられぬ。"
 th_common_sense_erosion_advance: "常識ノ浸透"
 th_common_sense_erosion_advance_desc: "外界の常識は水の如く幻想郷に浸透せり。妖怪は、人々が最早自らを恐れざることを見出せり。理解せらるること——それは妖怪最も深き恐怖なり。"
 th_heavenly_incidents_advance: "天外異変"
 th_heavenly_incidents_advance_desc: "新たな異変は天外より来たり——墜ちし器物、崩れし月相、分類し能はざる現象。賢者は初めて「名付くる能はざる」異変に直面せり。"

##第四時代：神楽ト祭囃
 th_essence_of_faith_advance: "信仰ノ本相"
 th_essence_of_faith_advance_desc: "四方ノ神ト僧侶ガ人間ノ里ニ於テ各々己レノ説ヲ掲グル時、人々ハ漸ク最モ根本ナル問ヒヲ発シ始メタリ——信仰ノ力ハ、果タシテ神ヨリ来ルカ、人ノ心ノ内ニ存スル信ゼントスル想ヒヨリ来ルカ。幻想郷ハ初メテ信仰其ノモノヲ凝視ノ対象ト為セリ。"
 th_faith_and_doubt_advance: "信ト疑"
 th_faith_and_doubt_advance_desc: "疑ヒハ最早冒涜ニ非ズ。「神ハ在ルヤ」ト敢テ問フ者ハ、敬虔ニ礼拝スル者ト同ク多シ——而シテ人々ハ漸ク、疑ヒヲ経テノミ信仰ハ真ニ堅牢ト為ルコトヲ知レリ。"
 th_god_and_mortal_advance: "神人同席"
 th_god_and_mortal_advance_desc: "神ハ神龕ヲ下リテ、凡ノ人ト茶席ヲ共ニシ、妖怪モ亦初メテ祭礼ノ上ニ人間ト肩ヲ並ベタリ。神ト人ノ境界ハ曖昧トナリ始メ、其ノ曖昧サガ信仰ヲ未曾有ノ親シサニ導キタリ。"
 th_sacred_music_advance: "祭囃ノ章"
 th_sacred_music_advance_desc: "太鼓ノ音、笛ノ声、神楽ノ舞——神ト人ヲ通フ最モ古クシテ最モ普遍ナル言語ナリ。祭囃ガ幻想郷ノ各所ニ響ク時、人々ハ信ゼリ——神ハ此ノ音ヲ聞ク、而シテ人モ亦此ノ音ノ中ニ己ヲ聞クト。"
 th_festival_protocol_advance: "祭典儀軌"
 th_festival_protocol_advance_desc: "祭典ハ最早、民ノ歓楽ノミニ非ズ。幻想郷ノ各地ハ祭祀ノ規範ヲ定メ始メタリ——何時太鼓ヲ撃チ、如何ニ舞ヲ捧ゲ、何ノ供物ヲ以テ合ヒトスルヤ。儀式ガ荘厳ナレバナルホド、信仰ハ重ク、而シテ敬虔トナレリ。"
 th_schism_of_belief_advance: "信仰ノ分裂"
 th_schism_of_belief_advance_desc: "同一ノ幻想ハ、守矢ト博麗、命蓮寺ト仙界ノ眼ニ於テ各々異リテ語ラレタリ。分裂ハ災害ニ非ズ——人々ハ始メテ、裂目ヲ経テノミ信仰ハ真ニ成熟スルコトヲ悟リタリ。"
 th_reform_of_rites_advance: "礼儀改革"
 th_reform_of_rites_advance_desc: "旧キ祭祀ノ方法ハ時宜ニ適ハズト見做サレ、各地ニ於テ儀式ハ革新セラレタリ——繁文ヲ簡ニシ、神楽ヲ編ミ直シ、信仰ヲ時代ニ追従セシメタリ。改革ノ焔ハ、幻想郷ノ凡テノ神社ト寺院ヲ焼キ廻レリ。"
 th_pilgrimage_roads_advance: "参道ノ興"
 th_pilgrimage_roads_advance_desc: "参詣ノ道ハ幻想郷ヲ貫キ、信徒ハ其ノ道ニ沿ヒテ旅ニ出デタリ。信仰ハ初メテ地理ノ形ヲ有セリ——山川、寺社ハ、一條一條ノ参道ニ依リテ一ツノ網ト為レリ。"
 th_human_divinity_advance: "人ノ神聖"
 th_human_divinity_advance_desc: "人々ハ漸ク発見セリ——神迹ヲ要スルコトナク、人ノ善行其ノモノニ神聖ハ存スト。妖怪ト人間ガ徳ノ中ニ光輝ヲ見出ス時、信仰ハ最早唯神ヲ仰グノミニ非ズ、人其ノモノノ讃歌トナレリ。"
 th_faith_as_power_advance: "信仰ハ力ナリ"
 th_faith_as_power_advance_desc: "信仰ハ蓄積シ、争フコトヲ得ル力トシテ理解セラレタリ。香火、人心、声望——凡テガ諸勢力ノ競フ資源トナリ、祭典ハ即チ戦場、而シテ敬虔ハ最良ノ刃トナレリ。"
 th_eternal_question_advance: "神ノ存続"
 th_eternal_question_advance_desc: "時代ノ果テニ、幻想郷ハ最後ノ一問ヲ共ニ問ヘリ——信仰ガ必ズ変ハラントスルナラバ、神ハ如何ナル形ニ於テ存続セン。或ル者ハ神楽ニテ其名ヲ継ギ、或ル者ハ物語ニテ其霊ヲ宿ス。神ノ存続ハ、此ノ日ヨリ人ノ記憶ニ依リヌ。"

##第五時代：万物一心
 th_oneness_philosophy_advance: "一体ノ理"
 th_oneness_philosophy_advance_desc: "信仰ノ喧騒ガ去リシ後、哲学者ハ古キ命題ヲ論ジ始メタリ——万物ハ同一ノ幻想ヨリ生ズト。人ト妖、神ト人ハ、唯其ノ一幻想ノ異ナル映影ナリ。幻想郷ハ初メテ「一体」ノ哲学ヲ聞ケリ。"
 th_dissolution_of_boundary_advance: "境界ノ解"
 th_dissolution_of_boundary_advance_desc: "人妖ノ界、神人ノ界、現世ト幻想ノ界——皆、再ビ凝視セラレタリ。境界ハ天然ナルヤ、人為ナルヤ。人々ガ其ノ線ヲ疑ヒ始メシ時、其ノ線ハ既ニ密カニ動キ始メタリ。"
 th_common_destiny_advance: "共同運命"
 th_common_destiny_advance_desc: "天外ノ物ト未知ニ向ヒ、幻想郷ノ諸国ハ初メテ互イニ同一ノ運命ヲ共有セルコトヲ悟レリ。差異ハ尚モ在レド、最早誰モ孤島ニ非ズト装フコト能ハザル——風ハ凡テヲ同一ノ処ニ吹キ行ク。"
 th_unity_of_orders_advance: "万律帰一"
 th_unity_of_orders_advance_desc: "諸国ノ錯綜セル律法ハ再ビ検討セラレタリ——幻想郷ノ凡テノ国ガ従フベキ「一」ハ在ルヤ。散リシ掟ガ単一ノ秩序ニ向ヒ流レ始メシ時、統一ハ最早夢ニ非ズ。"
 th_great_unification_advance: "大同ノ制"
 th_great_unification_advance_desc: "単一ノ勢力ヲ超ユル統合ノ構想ハ初メテ其ノ輪郭ヲ現セリ——幻想郷ガ其ノ全トシテ存シ、最早諸国ノ寄合ノミニ非ザラントスル青写真ナリ。大同ノ制ハ未ダ決セザレド、既ニ之ヲ描キ始メシ者アリ。"
 th_center_and_periphery_advance: "中心ト辺境"
 th_center_and_periphery_advance_desc: "統一ノ潮流ノ中ニ、中心ト辺境ノ関係ハ再定義セラレタリ。辺境ハ最早征服ノ対象ニ非ズ——凡テノ土地ガ、己ノ様ニシテ「一」ノ構成ニ与ル。"
 th_order_within_chaos_advance: "混沌ノ中ノ秩序"
 th_order_within_chaos_advance_desc: "幻想郷ノ本質ハ破碎ト混沌ナリ。而シテ人々ハ混沌ノ中ニ、之ヲ壊サザル秩序ヲ建ツルコトヲ学ビ始メタリ。結界ノ内ニ万象ガ並存スル如ク——有序ト無序ハ、一ツノ全体ノ両面ナリ。"
 th_collective_identity_advance: "共同体ノ自覚"
 th_collective_identity_advance_desc: "種族ト信仰ヲ超エタル「幻想郷ノ民」ノ自覚ガ形ヲ成シ始メタリ。人々ガ「某国ノ民」ニ非ズシテ「幻想郷ノ住人」ト自称スル時、一体ノ時代ハ既ニ密カニ到来セリ。"
 th_barrier_and_oneness_advance: "結界ト一体"
 th_barrier_and_oneness_advance_desc: "大結界ハ果タシテ分ツ壁ナルヤ、包ム殻ナルヤ。之ハ分裂ヲ守リツツ、統一ヲモ其内ニ宿ス——人々ハ始メテ、結界ハ「一」ノ障壁ニ非ズ、其ノ容器ナルコトヲ知レリ。"
 th_guardians_of_order_advance: "秩序ノ見守リ"
 th_guardians_of_order_advance_desc: "誰ニ「一」ヲ定義スル権有ルヤ。賢者ト守護者ハ統一ノ時代ニ於テ改メテ問ハレタリ。巫女ハ最早唯ノ分隔者ニ非ズ、賢者モ最早唯ノ傍観者ニ非ズ——彼等ハ共ニ、己レガ護リシモノガ果タシテ何ナルカヲ答ヘザルベカラザルニ至レリ。"
 th_eternal_diversity_advance: "殊途同帰"
 th_eternal_diversity_advance_desc: "時代ノ終章ノ洞見——真ノ「一」ハ差異ヲ消スヲ要セズ。万物各々己ノ道ヲ歩ム：妖ハ山ニ、人ハ里ニ、神ハ祠ニ——而シテ皆、同一ノ幻想ニ帰ル。殊ナル道、而シテ終ニ一ノ帰趨ナリ。"
