l_japanese:

#革新
##第一时代
 th_panegyric_of_all_things_advance: "在讃えし万物の時代"
 th_panegyric_of_all_things_advance_desc: "最初の時代、人々はまだ世界を神聖や恐怖、生霊や器物に分けてはいなかった。山々、河川、大地、森、そしてまだ名を持たぬ存在たちは、みな等しく語られ、等しく讃えられていた。薄暮と神秘が大地を覆い、闇の向こうには誰も知らぬ何かが潜んでいた。人々は闇を畏れ、未知を怖れた。そして口から耳へと継がれる物語、怪異への想像、闇への恐怖が、次第に絡み合い、集まっていった。幻想————それは、そうした伝承の中から生まれたのである。"
 th_origin_dream_advance: "最初の夢"
 th_origin_dream_advance_desc: "世界が定義されるよりも前、幻想はすでに存在していた。幻想こそが、世界の最初の姿である。あらゆる神秘、伝説、怪異、捨てられた幻想————みな冥々たる呼び声に導かれ、この地へと集う。かくして幻想郷は、それらにとって最後の帰宿であり、最初の原点となった。"
 th_endless_fantasy_advance: "常夜の世"
 th_endless_fantasy_advance_desc: "現実と幻想の間にはまだ明確な境界はなく————夢は現実となり、噂は怪異を生み出した。神秘と人は同じ道の上を共に歩み、すべては未だ醒めやらぬ幻想の中に揺蕩っていた。"
 th_gensokyo_chronicle_advance: "幻想郷縁起"
 th_gensokyo_chronicle_advance_desc: "記されてこそ、歴史となる。伝説も怪異も、ここに書き綴られ、語り継がれ、幾代もの人々の伝承の中で今日まで伝えられてきた。"
 th_balance_between_youkai_and_hito_advance: "人と妖怪の均衡"
 th_balance_between_youkai_and_hito_advance_desc: "これは人間がまだ弱かった時代。夜の帳が下りると、人々は門や窓を固く閉ざし、村の外へ一歩も出ようとはしなかった。村の外の森や竹林、荒野には無数の神秘が潜んでおり、ほとんどの人は生涯、村の外の姿を本当に知ることはなかった。人は巫女の庇護によって安らぎを得ていたのである。一方、妖怪は闇の中を彷徨い、人間の畏怖を糧とし、口から耳へと伝わる恐怖によってその存在を繋いでいた。人間は妖怪を恐れ、妖怪は人間の恐怖を必要とする。両者は対立しながらも、互いに依存し合い、この時代の秩序を共に形作っていた。"
 th_gensokyo_sages_advance: "賢者の見守り"
 th_gensokyo_sages_advance_desc: "長き夜は未だ終わらない。幻想郷の賢者たちは、幻想に愛されたこの地を静かに見守り続ける。彼らは現実と幻想の境界を保ち、人間と妖怪の均衡を保つ。賢者はただ、そのすべてを見つめている。幾夜も幾夜も、幾世も幾世も。賢者は今宵も変わらず————物語を見守り、伝承を見守り、終わることのない幻想を見守っている。"
 th_spell_card_rules_advance: "スペルカードルール"
 th_spell_card_rules_advance_desc: "妖怪同士がより公正に争いを解決できるよう、賢者たちはスペルカードルールを制定した。それ以来、決闘は単なる勝敗を超えたものとなった。弾幕は自身の存在と理念を表現する手段となった。弱者にも強者に挑む資格がある。そしてスペルカードルールと呼ばれるこの契約は、幻想郷の均衡を支える礎となった。"
 th_incident_resolution_advance: "異変の秩序"
 th_incident_resolution_advance_desc: "幻想郷にとって、異変そのものも幻想を支える重要な要素である。妖怪はこれによって存在を示し、神はこれによって信仰を広め、人間は異変を解決することで再び均衡を取り戻す。"
##第二时代
 th_age_of_stories_and_observations_advance: "語り継がれる物語"
 th_age_of_stories_and_observations_advance_desc: "これは旅人と学者と物語作家の時代。書物や写本、物語が幻想郷に広く流布するにつれ、人々は慣れ親しんだ村を出て、幻想郷のより遠くへと足を伸ばすようになった。見聞は記録され、伝説は整理され、「物語」は新たに語り直される。"
 th_fantasy_book_compacts_advance: "書物の到来"
 th_fantasy_book_compacts_advance_desc: "書物が新たな絆となった。契約も物語も知識も、紙の頁とともに幻想郷の隅々まで伝わっていく。妖怪の山からの知らせ、鈴奈庵が収蔵する奇書、あるいは旅人が自ら綴った伝記が、書き写され、貸し出され、広まっていく。異なる種族が同じ「物語」を読み、異なる文化が同じ「見聞」を共有する時代が訪れた。"