l_japanese:
 th_danmaku_challenge: "弾幕戦挑戦"
 th_danmaku_challenge_desc: "幻想郷国際組織の構成国に一対一の弾幕決闘を挑む。勝敗は弾幕火力によって決し、決して領土には及ばない。"
 th_danmaku_challenge_title: "弾幕戦の挑戦！"
 th_danmaku_challenge_event_desc: "幻想郷国際組織の構成国の一つが、我々に弾幕決闘を挑んできた。スペルカード・ルールに従い、勝敗は弾幕火力によって決する——領土が動くことはない。"
 th_danmaku_challenge_accept: "受けて立つ"
 th_danmaku_challenge_decline: "丁重に辞退する"
 th_danmaku_win_title: "弾幕決闘勝利"
 th_danmaku_win_desc: "我々の弾幕が勝った！決闘は我が物となり、その名は幻想郷に響く。貢献・影響力・威信を手にし、暫く「弾幕戦チャンピオン」の名を戴く。"
 th_danmaku_lose_title: "弾幕決闘敗北"
 th_danmaku_lose_desc: "決闘では分が悪かった。慣例に従い貢物を納め、威信を損なった——だが領土は失っていない。この敗北は教訓とする。"
 th_danmaku_draw_title: "弾幕決闘引き分け"
 th_danmaku_draw_desc: "双方いずれも勝利を掴めなかった。両者の名誉は保たれ、僅かながら貢献を得た。"
 th_danmaku_declined_title: "挑戦の辞退"
 th_danmaku_declined_desc: "我々の挑戦は丁重に辞退された。決闘は行われない。"
 th_danmaku_ok: "承知した"
 STATIC_MODIFIER_NAME_th_danmaku_champion_modifier: "弾幕戦チャンピオン"
 STATIC_MODIFIER_DESC_th_danmaku_champion_modifier: "弾幕決闘の勝者。威信+0.10/月、関係改善+10%、外交評判+1、人的資源+5%。"
 STATIC_MODIFIER_NAME_th_title_incident_resolver_modifier: "異変解決者"
 STATIC_MODIFIER_DESC_th_title_incident_resolver_modifier: "幻想郷の異変を解決する者。威信+0.05/月、関係改善+5%。"
 STATIC_MODIFIER_NAME_th_title_banquet_king_modifier: "宴会の王"
 STATIC_MODIFIER_DESC_th_title_banquet_king_modifier: "幻想郷の全ての宴会を盛り上げる者。関係改善+10%、外交評判+1。"
 STATIC_MODIFIER_NAME_th_title_fastest_in_gensokyo_modifier: "幻想郷最速"
 STATIC_MODIFIER_DESC_th_title_fastest_in_gensokyo_modifier: "郷にこれより速き者なし。人的資源+3%、威信+0.03/月。"
 STATIC_MODIFIER_NAME_th_title_danmaku_goddess_modifier: "弾幕の女神"
 STATIC_MODIFIER_DESC_th_title_danmaku_goddess_modifier: "弾幕の技、比類なし。威信+0.10/月、外交評判+1。"
