### 博麗風俗（old_hakurei）信条・切替行動 —— 設計文書：幻想郷神道「博麗風俗」神像.txt（以降の拡張を含む）
### 神明（第 1 枠）信条：10 通常
 th_old_hakurei_hakurei_god_aspect: "博麗神"
 th_old_hakurei_hakurei_god_aspect_desc: "博麗神社が祀る「博麗の神」。代々受け継がれてきた博麗の巫女でさえ、その正体を知らないという。"
 th_old_hakurei_shinki_aspect: "神綺"
 th_old_hakurei_shinki_aspect_desc: "旧き魔界の創世神。幻想郷においても崇敬と畏怖を集めている。"
 th_old_hakurei_yuka_aspect: "幽香"
 th_old_hakurei_yuka_aspect_desc: "幻想郷の太陽の花畑に住まう最上級の大妖怪。並の妖怪を凌駕する圧倒的な力を持ち、幻想郷の秩序の要の一つ。"
 th_old_hakurei_sariel_aspect: "サリエル"
 th_old_hakurei_sariel_aspect_desc: "堕天使サリエル。天界と魔界が混ざり合う古き時代に生まれ、魔界で重要な役割を担ってきたとされる。"
 th_old_hakurei_mima_aspect: "魅魔"
 th_old_hakurei_mima_aspect_desc: "姿の知られぬ悪霊。その波乱の来歴と博麗信仰の名だたる人々との縁は、彼女の地位を不動のものにしている。"
 th_old_hakurei_kutaka_aspect: "庭渡久侘歌"
 th_old_hakurei_kutaka_aspect_desc: "地獄の関所を守る古き神。異界の門の秩序を司り、喉の病を治す神力を持つ。"
 th_old_hakurei_hecatia_aspect: "ヘカーティア"
 th_old_hakurei_hecatia_aspect_desc: "三界の地獄を統べる女神。その素顔は明かされぬが、閻魔たちの尊敬は彼女が幻想郷を超えて最も偉大な存在であることを示している。"
 th_old_hakurei_matara_aspect: "摩多羅"
 th_old_hakurei_matara_aspect_desc: "万物の裏に潜む至高の秘神。地母神・養蚕の神・星宿の神・能楽の神・障碍の神・被差別民の神でもある。幻想郷の秩序を陰から守る賢者。"
 th_old_hakurei_kasen_aspect: "華扇"
 th_old_hakurei_kasen_aspect_desc: "神ではなく鬼の出身だが、正道を貫く賢者として常に人間の側に立ち幻想郷を守り、その善意で安寧と秩序を保ち続け、篤く敬われている。"
 th_old_hakurei_yukari_aspect: "紫"
 th_old_hakurei_yukari_aspect_desc: "実際には神ではないが、博麗大結界の創設者にして幻想郷を守る賢者として、同様に尊崇されている。"
### 神明（第 1 枠）信条：5 専属（対応する国のみ選択可能）
 th_old_hakurei_kanako_aspect: "神奈子"
 th_old_hakurei_kanako_aspect_desc: "守矢神社の祭神、山と湖の権化。信仰を司る風神として、守矢に繁栄と旺盛な信仰をもたらす。"
 th_old_hakurei_kaguya_aspect: "輝夜"
 th_old_hakurei_kaguya_aspect_desc: "永遠亭の主、月の都の姫。月の民の叡智と神秘をもって、幻想郷の外交舞台を軽やかに渡り歩く。"
 th_old_hakurei_aki_sisters_aspect: "秋姉妹"
 th_old_hakurei_aki_sisters_aspect_desc: "豊穣の祠の祭神。秋の実りを司る姉妹神であり、大地に豊穣と発展をもたらす。"
 th_old_hakurei_hina_aspect: "雛"
 th_old_hakurei_hina_aspect_desc: "妖怪の森の厄神。厄を集め安寧を保つ妖怪の森の守護者で、信仰する国に安定と名声をもたらす。"
 th_old_hakurei_keiki_aspect: "袿姫"
 th_old_hakurei_keiki_aspect_desc: "偶像の境の埴安神。造物の力で偶像を創り、人口の繁栄と名声を恵む。"
### 次要（第 2 枠）信条：四季の力（摩多羅を信仰する時のみ見える）
 th_old_hakurei_spring_power_aspect: "春の力"
 th_old_hakurei_spring_power_aspect_desc: "摩多羅側神像の力。春は万物を甦らせ、人口を増やす。"
 th_old_hakurei_summer_power_aspect: "夏の力"
 th_old_hakurei_summer_power_aspect_desc: "摩多羅側神像の力。盛夏は実りを豊かにし、加工生産産出を高める。"
 th_old_hakurei_autumn_power_aspect: "秋の力"
 th_old_hakurei_autumn_power_aspect_desc: "摩多羅側神像の力。金秋の収穫は税収効率を高める。"
 th_old_hakurei_winter_power_aspect: "冬の力"
 th_old_hakurei_winter_power_aspect_desc: "摩多羅側神像の力。厳冬は守りを固め、要塞防御を高める。"
### 次要（第 2 枠）信条：碩果/凋零（秋姉妹を選んだ後に選べる専属）
 th_old_hakurei_bounty_aspect: "碩果"
 th_old_hakurei_bounty_aspect_desc: "秋姉妹を選んだ後に選べる専属の側神像の力。秋の豊かな実りは食料産出を高める。"
 th_old_hakurei_wither_aspect: "凋零"
 th_old_hakurei_wither_aspect_desc: "秋姉妹を選んだ後に選べる専属の側神像の力。秋風は敵軍を凋落させ、敵の損耗を高める。"
### 切替行動
 th_hakurei_change_statue: "神明神像の変更"
 th_hakurei_change_statue_desc: "宗教影響力を消費して、祀る神明神像を変更する。神像の切替クールダウンは 25 年。"
 th_hakurei_change_minor_aspect: "側神像の分神変更"
 th_hakurei_change_minor_aspect_desc: "少量の宗教影響力で側神像の力を素早く変更する（摩多羅信仰時は四季の力、秋姉妹選択後は碩果/凋零）。"
 th_hakurei_change_statue_select_existing: "変更する神像を選択"
 th_hakurei_change_statue_select_new: "新しい神像を選択"
 th_hakurei_change_minor_aspect_select_existing: "変更する分神を選択"
 th_hakurei_change_minor_aspect_select_new: "新しい分神を選択"
