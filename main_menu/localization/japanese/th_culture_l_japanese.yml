###思潮
 th_genesis_of_gensokyo_institution: "幻想郷縁起"
 th_genesis_of_gensokyo_institution_desc: "幻想郷の始まりの時代、物語は焚き火のそばでの語らいの中から生まれ、人々の囁きの中を流れ、幾世代にもわたる語りと継承の中で紡がれてきた。妖怪の姿、神の奇跡、異変の見聞、そして古の伝説——それらはすべて、この地の最初の記憶を織り成していた。\n\nしかし、どんなに素晴らしい物語も忘却とともに消え去り、どんなに古い伝説も時の流れとともに失われていく。妖怪が忘れ去られることなく、伝説が時の彼方に埋もれることのないよう、記録することは次第に重要な営みとなった。\n\n紙の上に書き留められた物語は、口伝えの伝説を超え、後世に伝わる歴史へと変わり始めた。そして幻想郷は、初めて自分自身の記憶を持つこととなった。"
 STATIC_MODIFIER_NAME_th_genesis_of_gensokyo_institution_birth: "$th_genesis_of_gensokyo_institution$発源地"
 th_gensokyo_fantasy_journey_institution: "見聞と物語"
 th_gensokyo_fantasy_journey_institution_desc: "長い歳月の中で、幻想郷の歴史は常に先人と御阿礼の子によって綴られてきた。人々は語り継がれてきた物語を信じ、『幻想郷縁起』に記されたすべてを信じ、未知を触れてはならぬ神秘と見なしてきた。\n\nしかし、印刷や筆写、文学の隆盛に伴い、ますます多くの物語が人間の里で語られるようになった。それらはもはや神や妖怪だけに関するものではない。旅人の見聞、商人の経験、学者の研究、そして無数の普通の人々の幻想が、次第に新たな物語となっていく。人々は初めて、記録されるのは歴史だけではなく、「人」の物語もあるのだと気づいたのである。\n\nやがて人々は慣れ親しんだ村を離れ、森や山、湖を探索し始めた。世界の仕組みを理解しようと試み、先人の残した解釈に満足するのではなくなった。神秘は依然として存在するが、もはや恐怖と禁忌だけではない。人と妖怪の交流は次第に増え、商業と旅は日に日に栄え、新たな思想が道や書物に沿って幻想郷の各所へと伝わっていった。\n\nこれは旅人、学者、そして小説家たちの時代である。語り継がれる物語から、自ら経験する物語へ。記録された歴史から、すべての人の時代へ。"
