###思潮
 th_genesis_of_gensokyo_institution: "The Gensokyo Chronicle"
 th_genesis_of_gensokyo_institution_desc: "In the early days of Gensokyo, stories were born from idle talk around campfires, spread through whispered conversations between people, and carried on through generations of telling and passing down. The figures of youkai, the miracles of gods, accounts of strange incidents, and ancient legends all wove together the earliest memories of this land.\n\nHowever, even the most wonderful tales would fade with forgetfulness, and the most ancient legends would be lost to the passage of time. To ensure that youkai would not be forgotten and that legends would not be buried in the passing years, recording gradually became an important endeavor.\n\nThose stories written on paper began to transcend oral traditions, transforming into histories that could be passed down through the ages. And thus, for the first time, Gensokyo came to possess its own memories."
 STATIC_MODIFIER_NAME_th_genesis_of_gensokyo_institution_birth: "$th_genesis_of_gensokyo_institution$ Cradle"
 th_gensokyo_fantasy_journey_institution: "Travelogues and Tales"
 th_gensokyo_fantasy_journey_institution_desc: "Over the long years, the history of Gensokyo had always been recorded by the ancestors and the Children of Miare. People believed in the stories passed down, trusted everything recorded in The Gensokyo Chronicle, and regarded the unknown as an untouchable mystery.\n\nHowever, with the flourishing of printing, transcription, and literature, more and more stories began to circulate in the Human Village. They were no longer only about gods and youkai. Travelers' accounts, merchants' experiences, scholars' research, and the fantasies of countless ordinary people gradually became new stories. For the first time, people realized that it was not only history that could be recorded, but also the stories of 'people.'\n\nThus, people began to leave their familiar villages, exploring forests, mountains, and lakes. They started trying to understand the laws governing the world, rather than being satisfied with the explanations left by their ancestors. Mystery still existed, but it was no longer merely fear and taboo. Exchanges between humans and youkai gradually increased, commerce and travel grew ever more prosperous, and new ideas spread throughout Gensokyo along roads and through books.\n\nThis was an era belonging to travelers, scholars, and novelists. From stories that were told, to stories personally experienced; from recorded history, to an era belonging to everyone."
 STATIC_MODIFIER_NAME_th_gensokyo_fantasy_journey_institution_birth: "$th_gensokyo_fantasy_journey_institution$ Cradle"

