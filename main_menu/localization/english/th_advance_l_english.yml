l_english:

#革新
##第一时代
 th_panegyric_of_all_things_advance: "Age of the Panegyric of All Things"
 th_panegyric_of_all_things_advance_desc: "In the earliest age, people had not yet divided the world into sacred or terrible, living spirit or lifeless object. Mountains, rivers, the earth, forests — and those beings that had not yet been given names — were all spoken of together, celebrated together.\n\nTwilight and mystery shrouded the land, and beyond the darkness lurked things unknown. People revered the darkness and feared the unknown. And those stories passed from mouth to ear — imaginings of the strange, fear of the dark — gradually intertwined and converged.\n\nFantasy — was born from such traditions."
 th_origin_dream_advance: "The First Dream"
 th_origin_dream_advance_desc: "Before the world was defined, fantasy already existed. Fantasy is the world's original form. All mysteries, legends, strangeness, and abandoned fantasies — drawn by an unseen call, they gather here. Thus, Gensokyo became their final refuge and their first origin."
 th_endless_fantasy_advance: "Eternal Night"
 th_endless_fantasy_advance_desc: "There was no clear boundary between reality and fantasy — dreams could become real, and rumors could give birth to the strange. Mystery and humanity walked the same path together, everything adrift in a fantasy not yet awakened."
 th_gensokyo_chronicle_advance: "Gensokyo Chronicle"
 th_gensokyo_chronicle_advance_desc: "Only what is recorded becomes history. Legends and strange tales were written here, told here, passed down through generations to the present day."
 th_balance_between_youkai_and_hito_advance: "Balance of Humans and Youkai"
 th_balance_between_youkai_and_hito_advance_desc: "This was an age when humanity was still weak. When night fell, people shut their doors and windows, not daring to step beyond the village. In the forests, bamboo groves, and wilds beyond the village lurked countless mysteries, and most people never truly knew what lay beyond in their lifetime. They relied on the shrine maiden's protection for peace of mind.\n\nMeanwhile, youkai roamed the darkness, feeding on human fear, sustaining themselves on the terror passed from mouth to ear.\n\nHumans feared youkai, and youkai needed human fear. They opposed each other, yet depended on each other, together forming the order of this age."
 th_gensokyo_sages_advance: "Sages' Vigil"
 th_gensokyo_sages_advance_desc: "The long night has not ended. The Sages of Gensokyo quietly watch over this land blessed by fantasy. They maintain the boundary between reality and fantasy, the balance between humans and youkai. The Sages simply observe it all. Night after night, age after age. Tonight, the Sages do as they always have — watching over the stories, watching over the traditions, watching over the never-ending fantasy."
 th_spell_card_rules_advance: "Spell Card Rules"
 th_spell_card_rules_advance_desc: "To allow youkai to resolve disputes more fairly, the Sages jointly established the Spell Card Rules. Henceforth, duels were no longer merely about victory or defeat. Danmaku became a means of expressing one's existence and ideals. Even the weak had the right to challenge the strong. And this contract called the Spell Card Rules became the cornerstone maintaining Gensokyo's balance."
 th_incident_resolution_advance: "Incident Resolution"
 th_incident_resolution_advance_desc: "For Gensokyo, incidents themselves are an essential part of sustaining fantasy. Youkai use them to demonstrate their existence. Gods use them to spread faith. And humans restore balance by resolving them."
##第二时代
 th_age_of_stories_and_observations_advance: "Tales Passed Down"
 th_age_of_stories_and_observations_advance_desc: "This is an age of travelers, scholars, and novelists. As books, manuscripts, and stories spread widely across Gensokyo, people began to leave their familiar villages and venture to more distant parts of Gensokyo. Accounts were recorded, legends were compiled, and 'stories' would be told anew."
 th_fantasy_book_compacts_advance: "Book Fever"
 th_fantasy_book_compacts_advance_desc: "Books became a new bond. Contracts, stories, and knowledge spread across Gensokyo on the pages of books. News from Youkai Mountain, rare books collected at Suzunaan, and travelogues written by wanderers — all were copied, borrowed, and circulated. Different races began to read the same 'stories,' and different cultures began to share the same 'accounts.'"
 th_the_distant_one_advance: "The Distant One"
 th_the_distant_one_advance_desc: "Before every story begins, there is always a distant, unreachable goal. Some seek a landscape that does not exist. Some seek a lost history. Some seek their own dreams. It is precisely because unreachable things exist that people continue to move forward. And so, stories are written, and a new age begins."
 th_scarlet_destiny_advance: "Scarlet Destiny"
 th_scarlet_destiny_advance_desc: "In the beginning, people only saw the distance. Beyond the mist, beyond the youkai mysteries, there seemed to be something yet to be understood. Travelers set out on roads, scholars turned pages, novelists began writing new stories. They did not know where the destination lay. Yet they moved forward nonetheless. The unknown frightened them. Yet it also beckoned them. And so for the first time, people began to actively pursue destiny — rather than wait for it to arrive."
 th_phantom_dreams_advance: "Phantom Dreams"
 th_phantom_dreams_advance_desc: "Forgotten things. Buried things. Sealed things. Those memories that once slumbered in the depths of history begin to awaken once more."
 th_eternal_night_advance: "Eternal Night"
 th_eternal_night_advance_desc: "As the world expands ever outward. As boundaries are crossed one after another. People begin to look toward places even more distant. Stories do not end because riddles are solved. Dreams do not cease because destinations are reached. And the tales of all who follow will begin from this night."
 th_new_narratives_of_incidents_advance: "New Narratives of Incidents"
 th_new_narratives_of_incidents_advance_desc: "Incidents appear once more. Who started them? And why were they started? What did those who resolved the incidents experience? And after each incident concludes, new tales are born."
 th_words_like_pearls_advance: "Words Like Pearls"
 th_words_like_pearls_advance_desc: "People began to believe that not only history was worth remembering. More and more took up brush and ink, preserving what they had seen and heard on paper. Thus, writing stepped out of the schoolhouse and into daily life. Stories were written down, experiences recorded, thoughts spread."
 th_cartography_of_rumors_advance: "Cartography of Rumors"
 th_cartography_of_rumors_advance_desc: "The once-vague world gradually gained names, and those unknown lands appeared on paper for the first time."
 th_chronicles_of_mysteries_advance: "Chronicles of Mysteries"
 th_chronicles_of_mysteries_advance_desc: "As travel and exchange flourished, more and more people began recording the strange tales and extraordinary events circulating throughout Gensokyo. Gradually, people discovered that even the most bizarre arcane arts were not without patterns to be found. And the secrets hidden behind countless mysteries await future generations to uncover them."
 th_danmaku_reformation_advance: "Danmaku Reformation"
 th_danmaku_reformation_advance_desc: "With the flourishing of culture, people began to infuse their own experiences, ideals, and abilities into their spell cards. The brilliance of spell cards became a decisive factor in victory. Countless different stories intersected within danmaku. Just as pages record words, spell cards became vessels of fantasy."
 th_printing_press_adoption_advance: "Printing Press"
 th_printing_press_adoption_advance_desc: "As printing technology gradually spread, books and documents could be reproduced and circulated more quickly. Histories, legends, and knowledge that once could only be preserved through manual transcription could now be saved with greater efficiency and reach more hands."
 th_emergent_journalism_advance: "Journalism"
 th_emergent_journalism_advance_desc: "Everyday accounts from around the villages, towns, and shrines began to be compiled, assembled, and distributed in more stable forms. The public began to obtain information and understand the world through these regularly circulated publications. The flow of information accelerated, and the contours of the world grew clearer."
 th_silver_currency_standard_advance: "Silver Currency Standard"
 th_silver_currency_standard_advance_desc: "The use of silver as currency expanded further across Gensokyo. Even in ages long past, silver coins had circulated in markets as a basis for valuation. In this era, as the scope of trade expanded and the frequency of exchange increased, the circulation of silver coins grew significantly, gradually becoming a common medium in broader economic activities."
