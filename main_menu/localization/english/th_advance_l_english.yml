l_english:

#Innovations
##First Age
 th_panegyric_of_all_things_advance: "In the Age of Praising All Things"
 th_panegyric_of_all_things_advance_desc: "In the earliest age, people had yet to divide the world into the sacred or the terrifying, the living or the inanimate. Mountains, rivers, the earth, forests, and those beings that had not yet been named were all spoken of together, all praised together.\n\nTwilight and mystery shrouded the land, and beyond the darkness lurked things unknown. People stood in awe of the darkness and feared the unknown. And the tales passed from mouth to ear — the imaginings of the strange, the fear of the dark — gradually intertwined and coalesced.\n\nFantasy itself was born from just such a legacy."
 th_origin_dream_advance: "The Original Dream"
 th_origin_dream_advance_desc: "Before the world was defined, fantasy already existed. Fantasy is the original form of the world. All mysteries, legends, oddities, and discarded fantasies — drawn by an unseen call — gather here. Thus Gensokyo became their final refuge, and also their original starting point."
 th_endless_fantasy_advance: "The Eternal Night"
 th_endless_fantasy_advance_desc: "No clear boundary yet existed between reality and fantasy — dreams could become reality, rumors could give birth to strange beings. The mysterious walked the same path as humanity, and all things drifted within that still-unawakened fantasy."
 th_gensokyo_chronicle_advance: "Gensokyo Chronicle"
 th_gensokyo_chronicle_advance_desc: "Only by being recorded does something become history. Legends and strange tales are written and told here, passed down through the generations to this very day."
 th_balance_between_youkai_and_hito_advance: "Balance Between Humans and Youkai"
 th_balance_between_youkai_and_hito_advance_desc: "This is an age when humans are still weak. When night falls, people bolt their doors and windows, not daring to set foot outside the village. Beyond the villages, countless mysteries lurk in the forests, bamboo groves, and wilderness — yet most people live their entire lives without truly knowing what lies outside. Humans rely on the protection of shrine maidens for peace of mind.\n\nYoukai roam the darkness, feeding on human fear, sustaining their existence through the terror passed from mouth to ear.\n\nHumans fear youkai, and youkai need human fear. The two sides stand opposed, yet remain interdependent — together they form the order of this age."
 th_gensokyo_sages_advance: "The Sages' Vigil"
 th_gensokyo_sages_advance_desc: "The long night has not ended. The sages of Gensokyo quietly watch over this land blessed by fantasy. They maintain the boundary between reality and fantasy, preserve the equilibrium between humans and youkai. And the sages merely observe. Night after night. Age after age. Tonight, the sages remain the same — watching over the stories, watching over the traditions, watching over the never-ending fantasy."
 th_spell_card_rules_advance: "Spell Card Rules"
 th_spell_card_rules_advance_desc: "To allow youkai to resolve disputes in a fairer manner, the sages jointly established the Spell Card Rules. From then on, duels were no longer merely about victory or defeat. Danmaku became a way to express one's existence and ideals. Even the weak gained the right to challenge the strong. And this covenant, known as the Spell Card Rules, became the cornerstone maintaining the balance of Gensokyo."
 th_incident_resolution_advance: "Incident Resolution Order"
 th_incident_resolution_advance_desc: "For Gensokyo, incidents themselves are an important part of sustaining fantasy. Youkai use them to demonstrate their existence. Gods use them to spread their faith. And humans re-establish balance by resolving incidents."
##Second Age
 th_age_of_stories_and_observations_advance: "Tales That Travel Far"
 th_age_of_stories_and_observations_advance_desc: "This is an age of travelers, scholars, and novelists. As books, manuscripts, and stories spread widely throughout Gensokyo, people began to leave their familiar villages and venture to more distant places. Experiences are recorded, legends are compiled, and stories are retold anew."
 th_fantasy_book_compacts_advance: "Where the Wind Blows"
 th_fantasy_book_compacts_advance_desc: "No one knows where the wind comes from. Nor where it will blow. Some hear rumors from distant lands, some see sights never before witnessed, some record their travels, and some weave them into new stories. And so people and events once entirely unconnected become linked through roads, pages, and words. From one to another, from one thing to the next. All stories drift with the wind to ever more distant places, and Gensokyo begins to change."
 th_the_distant_one_advance: "The Distant One"
 th_the_distant_one_advance_desc: "Before every story begins, there is always an unreachable goal. Some seek a landscape that does not exist. Some seek a lost history. Some pursue their own dreams. It is precisely because something remains beyond reach that people continue to move forward. And thus, stories are written, and a new era begins."
 th_scarlet_destiny_advance: "Scarlet Destiny"
 th_scarlet_destiny_advance_desc: "At first, people simply saw the distance. Beyond the mist, beyond the youkai and gods, there seemed to be something yet to be understood. Travelers set out on the road, scholars turned pages, novelists began writing new tales. They knew not where the end lay, yet still they pressed forward. The unknown brings fear, but also longing. And so, for the first time, people began to actively seek their fate, rather than waiting for it to arrive."
 th_phantom_dreams_advance: "Phantom Dream"
 th_phantom_dreams_advance_desc: "Things forgotten. Things buried. Things sealed away. Memories once dormant in the depths of history begin to reawaken."
 th_eternal_night_advance: "Eternal Night"
 th_eternal_night_advance_desc: "As the world continues to expand, as boundaries are continuously crossed, people begin to gaze toward ever more distant places. Stories do not end because mysteries are solved. Dreams do not cease because a destination is reached. And the tales of all who come after will begin from this night."
 th_new_narratives_of_incidents_advance: "New Narratives of Incidents"
 th_new_narratives_of_incidents_advance_desc: "Incidents appear once more. Who started them? And why? What did those who resolved them experience? And with each incident's conclusion, new tales are born."
 th_words_like_pearls_advance: "Words Like Pearls"
 th_words_like_pearls_advance_desc: "People began to believe that it was not only history worth remembering. More and more took up brush and ink, preserving what they had seen and heard between pages. Thus written words stepped out of the schoolhouse and into daily life. Stories are written, experiences are recorded, and ideas are spread."
 th_cartography_of_rumors_advance: "Records of a Hundred Rumors"
 th_cartography_of_rumors_advance_desc: "The once vague and indistinct world gradually gained names, and those unknown lands appeared on paper for the first time."
 th_chronicles_of_mysteries_advance: "Chronicles of Mysteries"
 th_chronicles_of_mysteries_advance_desc: "As travel and exchange flourished, more and more people began to record the strange tales and extraordinary events circulating throughout Gensokyo. Gradually, people discovered that even the most arcane secrets were not without discernible patterns. And the truths hidden behind countless mysteries await discovery by those yet to come."
 th_danmaku_reformation_advance: "Spell Card Reformation"
 th_danmaku_reformation_advance_desc: "With the flourishing of culture, people began to infuse their experiences, ideals, and abilities into Spell Cards. The brilliance of Spell Cards became a decisive factor in victory, and countless different stories converged within the danmaku. Just as pages record words, Spell Cards became vessels of fantasy."
 th_printing_press_adoption_advance: "Printing Press"
 th_printing_press_adoption_advance_desc: "As printing technology gradually spread, books and documents could be copied and circulated more quickly. History, legends, and knowledge that once could only be transcribed by hand could now be preserved with greater efficiency and reach more hands."
 th_emergent_journalism_advance: "Journalism"
 th_emergent_journalism_advance_desc: "Everyday observations from villages, towns, and shrines began to be compiled and disseminated in more stable forms. The public began to obtain information and understand the world through these regularly circulated publications. The flow of information accelerated, and the contours of the world grew clearer."
 th_silver_currency_standard_advance: "Silver Currency Circulation"
 th_silver_currency_standard_advance_desc: "The use of silver as currency expanded further throughout Gensokyo. In ages long past, silver coins already circulated in markets as a basis for valuation. In this era, with the expanding scope of trade and the increased frequency of exchange, the circulation of silver coins grew significantly, gradually becoming a universal medium in broader economic activities."
##Third Age Innovations
 th_boundary_gaze_advance: "Gazing Upon the Boundary"
 th_boundary_gaze_advance_desc: "For the first time, the Great Barrier was no longer seen as a wall, but as an object of study. Scholars and sages camped at its edge, recording its fluctuations, its fissures, and its breathing."
 th_rumors_of_the_outside_advance: "Rumors From Beyond"
 th_rumors_of_the_outside_advance_desc: "The wind crossing the barrier carries voices from beyond. People began to exchange rumors of \"the outside\"—a sky with no youkai, a people who no longer believed in gods."
 th_gateway_research_advance: "Seeking the Passage"
 th_gateway_research_advance_desc: "Some claimed to have found a weak point in the barrier deep in the forest. Expeditions set out. Some returned, some did not. But for the first time, the paths were marked upon maps."
 th_outside_contact_advance: "First Contact"
 th_outside_contact_advance_desc: "Gensokyo held its first dialogue with an outside civilization. Languages differed, rules differed, yet objects and stories from \"over there\" began to appear in the teahouses."
 th_return_of_the_sealed_advance: "The Returned"
 th_return_of_the_sealed_advance_desc: "Those once sealed away, banished, and forgotten began to return one after another. They carried back memories of the outside—and with them, questions enough to shake the very foundations of Gensokyo."
 th_lunar_almanac_advance: "Almanac of the Moon"
 th_lunar_almanac_advance_desc: "People began to record the phases of the moon, eclipses, and tides in ink. For the first time, the moon shifted from \"deity\" to \"an object that could be observed.\""
 th_moon_dialogue_advance: "Dialogue With the Moon"
 th_moon_dialogue_advance_desc: "Legend holds that the moon people watch over Gensokyo from the lunar surface. Some attempted to answer the moonlight, others sought to reach the moon through sorcery. The dialogue has not yet begun—but the invitation has already been sent."
 th_eternity_rumor_advance: "Tale of Immortality"
 th_eternity_rumor_advance_desc: "Legends of the Eientei resurfaced—the Hourai Elixir, immortality, the exiled princess of the moon. Death was no longer an untouchable taboo, but a topic to be discussed."
 th_empirical_eye_advance: "The Empirical Eye"
 th_empirical_eye_advance_desc: "The theorists of science proclaimed that \"only what can be verified deserves belief.\" For the first time, fantasy itself was placed upon the experimental table."
 th_common_sense_erosion_advance: "Erosion of Common Sense"
 th_common_sense_erosion_advance_desc: "The common sense of the outside seeped into Gensokyo like water. Youkai found that people no longer feared them. To be understood—that is a youkai's deepest terror."
 th_heavenly_incidents_advance: "Incidents From Beyond"
 th_heavenly_incidents_advance_desc: "The new incidents come from beyond—fallen relics, disrupted lunar phases, phenomena that defy classification. For the first time, the sages faced incidents that \"could not be named.\""

##Fourth Age: Kagura and Matsuri
 th_essence_of_faith_advance: "The Essence of Faith"
 th_essence_of_faith_advance_desc: "When the gods and monks of four directions each claimed the Human Village as their own, people at last began to ask the most fundamental question—does the power of faith truly come from the gods, or from the willingness to believe that dwells in every human heart? For the first time, Gensokyo made faith itself the object of its scrutiny."
 th_faith_and_doubt_advance: "Faith and Doubt"
 th_faith_and_doubt_advance_desc: "Doubt was no longer blasphemy. As many dared to ask \"do the gods exist\" as knelt in devotion—and people slowly learned that only a faith tempered by doubt can truly hold firm."
 th_god_and_mortal_advance: "Gods Among Mortals"
 th_god_and_mortal_advance_desc: "The gods descended from their shrines to sit at the same tea tables as mortals; youkai, too, for the first time stood shoulder to shoulder with humans at festivals. The line between god and man began to blur—and that blurring brought faith closer than ever before."
 th_sacred_music_advance: "The Chapter of Matsuri"
 th_sacred_music_advance_desc: "The beat of drums, the song of flutes, and the dance of kagura became the oldest and most universal tongue between gods and mortals. When matsuri resounded across Gensokyo, people believed—the gods could hear this sound, and in it, they could hear themselves."
 th_festival_protocol_advance: "Festival Protocols"
 th_festival_protocol_advance_desc: "Festivals were no longer mere folk revelry. Gensokyo began to establish common rites of worship—when to strike the drum, how to offer the dance, what offerings were fitting. The more solemn the ritual, the heavier and more devout the faith."
 th_schism_of_belief_advance: "The Schism of Belief"
 th_schism_of_belief_advance_desc: "The same fantasy was spoken of differently in the eyes of Moriya and Hakurei, Myourenji and the Immortal Realm. Schism was no catastrophe—people began to understand that only through fracture does faith truly come of age."
 th_reform_of_rites_advance: "The Reform of Rites"
 th_reform_of_rites_advance_desc: "Old ways of worship were deemed out of step with the age, and rites were reformed everywhere—simplifying the ornate, reweaving the kagura, letting faith keep pace with the times. The flame of reform swept every shrine and temple in Gensokyo."
 th_pilgrimage_roads_advance: "The Rise of Pilgrimage Roads"
 th_pilgrimage_roads_advance_desc: "Pilgrimage routes threaded through Gensokyo, and the faithful set out along them. Faith took on a geography for the first time—mountains, temples, and shrines woven together into a single web of paths."
 th_human_divinity_advance: "The Divinity of Man"
 th_human_divinity_advance_desc: "People slowly discovered that no miracle was needed—human virtue itself holds the divine. When both youkai and humans saw radiance in good deeds, faith became less a gazing upon gods and more a celebration of humanity itself."
 th_faith_as_power_advance: "Faith as Power"
 th_faith_as_power_advance_desc: "Faith came to be understood as something that could be accumulated and contended for. Offerings, hearts, and renown all became resources in the contest of the powers—every festival a battlefield, and piety the keenest blade."
 th_eternal_question_advance: "The Persistence of Gods"
 th_eternal_question_advance_desc: "As the age drew to its end, Gensokyo faced one last question in common—if faith must change, in what form shall the gods endure? Some kept their names alive with kagura, some carried their spirits in stories, and the persistence of gods henceforth rested upon the memory of mortals."

##Fifth Age: All Things as One
 th_oneness_philosophy_advance: "The Principle of Oneness"
 th_oneness_philosophy_advance_desc: "After the clamor of faith fell quiet, philosophers began to argue an ancient thesis—that all things are born of the same fantasy. Human and youkai, god and mortal are but different reflections of a single fantasy. For the first time, Gensokyo heard the philosophy of \"oneness.\""
 th_dissolution_of_boundary_advance: "The Dissolution of Boundaries"
 th_dissolution_of_boundary_advance_desc: "The lines between human and youkai, god and mortal, the mundane and the fantastic—all were re-examined. Are boundaries natural, or are they made? Once people began to doubt the line, it had already begun to loosen."
 th_common_destiny_advance: "A Shared Destiny"
 th_common_destiny_advance_desc: "Faced with things from beyond and the unknown, the nations of Gensokyo for the first time realized they shared a single destiny. Differences remained, but no one could pretend to be an island any longer—the wind carries all things to the same place."
 th_unity_of_orders_advance: "Many Laws, One Order"
 th_unity_of_orders_advance_desc: "The tangled laws of many nations were re-examined—is there a \"one\" that all nations of Gensokyo should follow? When scattered rules begin to flow toward a single order, unification ceases to be a dream."
 th_great_unification_advance: "The Great Unification"
 th_great_unification_advance_desc: "For the first time, a framework beyond any single power was conceived—Gensokyo as a whole, no longer merely the piecing together of its nations. The Great Unification remains unresolved, yet some have already begun to envision it."
 th_center_and_periphery_advance: "Center and Periphery"
 th_center_and_periphery_advance_desc: "In the tide of unification, the relation between center and periphery was redefined. The periphery was no longer an object to be conquered—every land participates in the making of \"the one\" in its own way."
 th_order_within_chaos_advance: "Order Within Chaos"
 th_order_within_chaos_advance_desc: "The essence of Gensokyo is fragmentation and chaos, and people began to learn how to build an order within the chaos that would not destroy it. As the barrier holds ten thousand things side by side—order and disorder are but two faces of the same whole."
 th_collective_identity_advance: "Collective Identity"
 th_collective_identity_advance_desc: "An identity of \"the people of Gensokyo,\" transcending race and faith, began to take shape. When people called themselves \"a resident of Gensokyo\" rather than \"a subject of some land,\" the age of oneness had already quietly arrived."
 th_barrier_and_oneness_advance: "The Barrier and the One"
 th_barrier_and_oneness_advance_desc: "Is the Great Barrier a wall that separates, or a shell that contains? It guards division even as it holds unification within—people came to understand that the barrier is not an obstacle to \"the one,\" but its vessel."
 th_guardians_of_order_advance: "Guardians of Order"
 th_guardians_of_order_advance_desc: "Who has the right to define \"the one\"? The sages and the guardians were questioned anew in the age of unification. The shrine maiden was no longer merely a divider, nor the sages mere observers—both had to answer what it was they truly guarded."
 th_eternal_diversity_advance: "Many Paths, One Return"
 th_eternal_diversity_advance_desc: "The insight of the age's end—the true \"one\" need not erase difference. All things have their own paths: youkai to the mountains, humans to the villages, gods to their shrines—yet all return to the same fantasy. Many paths, and in the end, one return."
