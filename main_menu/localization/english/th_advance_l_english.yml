#Innovations
##First Age
 th_panegyric_of_all_things_advance: "In the Age of Praising All Things"
 th_panegyric_of_all_things_advance_desc: "In the earliest age, people had yet to divide the world into the sacred or the terrifying, the living or the inanimate. Mountains, rivers, the earth, forests, and those beings that had not yet been named were all spoken of together, all praised together.\n\nTwilight and mystery shrouded the land, and beyond the darkness lurked things unknown. People stood in awe of the darkness and feared the unknown. And the tales passed from mouth to ear — the imaginings of the strange, the fear of the dark — gradually intertwined and coalesced.\n\nFantasy itself was born from just such a legacy."
 th_origin_dream_advance: "The Original Dream"
 th_origin_dream_advance_desc: "Before the world was defined, fantasy already existed. Fantasy is the original form of the world. All mysteries, legends, oddities, and discarded fantasies — drawn by an unseen call — gather here. Thus Gensokyo became their final refuge, and also their original starting point."
 th_endless_fantasy_advance: "The Eternal Night"
 th_endless_fantasy_advance_desc: "No clear boundary yet existed between reality and fantasy — dreams could become reality, rumors could give birth to strange beings. The mysterious walked the same path as humanity, and all things drifted within that still-unawakened fantasy."
 th_gensokyo_chronicle_advance: "Gensokyo Chronicle"
 th_gensokyo_chronicle_advance_desc: "Only by being recorded does something become history. Legends and strange tales are written and told here, passed down through the generations to this very day."
 th_balance_between_youkai_and_hito_advance: "Balance Between Humans and Youkai"
 th_balance_between_youkai_and_hito_advance_desc: "This is an age when humans are still weak. When night falls, people bolt their doors and windows, not daring to set foot outside the village. Beyond the villages, countless mysteries lurk in the forests, bamboo groves, and wilderness — yet most people live their entire lives without truly knowing what lies outside. Humans rely on the protection of shrine maidens for peace of mind.\n\nYoukai roam the darkness, feeding on human fear, sustaining their existence through the terror passed from mouth to ear.\n\nHumans fear youkai, and youkai need human fear. The two sides stand opposed, yet remain interdependent — together they form the order of this age."
 th_gensokyo_sages_advance: "The Sages' Vigil"
 th_gensokyo_sages_advance_desc: "The long night has not ended. The sages of Gensokyo quietly watch over this land blessed by fantasy. They maintain the boundary between reality and fantasy, preserve the equilibrium between humans and youkai. And the sages merely observe. Night after night. Age after age. Tonight, the sages remain the same — watching over the stories, watching over the traditions, watching over the never-ending fantasy."
 th_spell_card_rules_advance: "Spell Card Rules"
 th_spell_card_rules_advance_desc: "To allow youkai to resolve disputes in a fairer manner, the sages jointly established the Spell Card Rules. From then on, duels were no longer merely about victory or defeat. Danmaku became a way to express one's existence and ideals. Even the weak gained the right to challenge the strong. And this covenant, known as the Spell Card Rules, became the cornerstone maintaining the balance of Gensokyo."
 th_incident_resolution_advance: "Incident Resolution Order"
 th_incident_resolution_advance_desc: "For Gensokyo, incidents themselves are an important part of sustaining fantasy. Youkai use them to demonstrate their existence. Gods use them to spread their faith. And humans re-establish balance by resolving incidents."
##Second Age
 th_age_of_stories_and_observations_advance: "Tales That Travel Far"
 th_age_of_stories_and_observations_advance_desc: "This is an age of travelers, scholars, and novelists. As books, manuscripts, and stories spread widely throughout Gensokyo, people began to leave their familiar villages and venture to more distant places. Experiences are recorded, legends are compiled, and stories are retold anew."
 th_fantasy_book_compacts_advance: "Where the Wind Blows"
 th_fantasy_book_compacts_advance_desc: "No one knows where the wind comes from. Nor where it will blow. Some hear rumors from distant lands, some see sights never before witnessed, some record their travels, and some weave them into new stories. And so people and events once entirely unconnected become linked through roads, pages, and words. From one to another, from one thing to the next. All stories drift with the wind to ever more distant places, and Gensokyo begins to change."
 th_the_distant_one_advance: "The Distant One"
 th_the_distant_one_advance_desc: "Before every story begins, there is always an unreachable goal. Some seek a landscape that does not exist. Some seek a lost history. Some pursue their own dreams. It is precisely because something remains beyond reach that people continue to move forward. And thus, stories are written, and a new era begins."
 th_scarlet_destiny_advance: "Scarlet Destiny"
 th_scarlet_destiny_advance_desc: "At first, people simply saw the distance. Beyond the mist, beyond the youkai and gods, there seemed to be something yet to be understood. Travelers set out on the road, scholars turned pages, novelists began writing new tales. They knew not where the end lay, yet still they pressed forward. The unknown brings fear, but also longing. And so, for the first time, people began to actively seek their fate, rather than waiting for it to arrive."
 th_phantom_dreams_advance: "Phantom Dream"
 th_phantom_dreams_advance_desc: "Things forgotten. Things buried. Things sealed away. Memories once dormant in the depths of history begin to reawaken."
 th_eternal_night_advance: "Eternal Night"
 th_eternal_night_advance_desc: "As the world continues to expand, as boundaries are continuously crossed, people begin to gaze toward ever more distant places. Stories do not end because mysteries are solved. Dreams do not cease because a destination is reached. And the tales of all who come after will begin from this night."
 th_new_narratives_of_incidents_advance: "New Narratives of Incidents"
 th_new_narratives_of_incidents_advance_desc: "Incidents appear once more. Who started them? And why? What did those who resolved them experience? And with each incident's conclusion, new tales are born."
 th_words_like_pearls_advance: "Words Like Pearls"
 th_words_like_pearls_advance_desc: "People began to believe that it was not only history worth remembering. More and more took up brush and ink, preserving what they had seen and heard between pages. Thus written words stepped out of the schoolhouse and into daily life. Stories are written, experiences are recorded, and ideas are spread."
 th_cartography_of_rumors_advance: "Records of a Hundred Rumors"
 th_cartography_of_rumors_advance_desc: "The once vague and indistinct world gradually gained names, and those unknown lands appeared on paper for the first time."
 th_chronicles_of_mysteries_advance: "Chronicles of Mysteries"
 th_chronicles_of_mysteries_advance_desc: "As travel and exchange flourished, more and more people began to record the strange tales and extraordinary events circulating throughout Gensokyo. Gradually, people discovered that even the most arcane secrets were not without discernible patterns. And the truths hidden behind countless mysteries await discovery by those yet to come."
 th_danmaku_reformation_advance: "Spell Card Reformation"
 th_danmaku_reformation_advance_desc: "With the flourishing of culture, people began to infuse their experiences, ideals, and abilities into Spell Cards. The brilliance of Spell Cards became a decisive factor in victory, and countless different stories converged within the danmaku. Just as pages record words, Spell Cards became vessels of fantasy."
 th_printing_press_adoption_advance: "Printing Press"
 th_printing_press_adoption_advance_desc: "As printing technology gradually spread, books and documents could be copied and circulated more quickly. History, legends, and knowledge that once could only be transcribed by hand could now be preserved with greater efficiency and reach more hands."
 th_emergent_journalism_advance: "Journalism"
 th_emergent_journalism_advance_desc: "Everyday observations from villages, towns, and shrines began to be compiled and disseminated in more stable forms. The public began to obtain information and understand the world through these regularly circulated publications. The flow of information accelerated, and the contours of the world grew clearer."
 th_silver_currency_standard_advance: "Silver Currency Circulation"
 th_silver_currency_standard_advance_desc: "The use of silver as currency expanded further throughout Gensokyo. In ages long past, silver coins already circulated in markets as a basis for valuation. In this era, with the expanding scope of trade and the increased frequency of exchange, the circulation of silver coins grew significantly, gradually becoming a universal medium in broader economic activities."
##Third Age Innovations
