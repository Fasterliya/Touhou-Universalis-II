### Hakurei Folk Belief (old_hakurei) aspects & switch actions — design doc: 幻想乡神道「博丽风俗」神像.txt
### Deity (slot 1) aspects
 th_old_hakurei_hakurei_god_aspect: "The Hakurei God"
 th_old_hakurei_hakurei_god_aspect_desc: "The Hakurei Shrine enshrines 'the God of Hakurei,' yet even the shrine maidens who pass down the tradition generation after generation do not know its true identity."
 th_old_hakurei_shinki_aspect: "Shinki"
 th_old_hakurei_shinki_aspect_desc: "The creator goddess of the old Makai. Even in Gensokyo she is revered and feared alike."
 th_old_hakurei_yuka_aspect: "Yuka"
 th_old_hakurei_yuka_aspect_desc: "A top-class youkai residing in the Sunflower Fields of Gensokyo, with overwhelming power far beyond ordinary youkai; one of the core presences of Gensokyo's native order."
 th_old_hakurei_sariel_aspect: "Sariel"
 th_old_hakurei_sariel_aspect_desc: "Sariel is a fallen angel, said to have been born in the ancient age when Heaven and Makai mingled, playing a pivotal role in Makai."
 th_old_hakurei_mima_aspect: "Mima"
 th_old_hakurei_mima_aspect_desc: "A malevolent spirit whose appearance is rarely known, yet her twisted history and deep ties with many famed figures of Hakurei belief make her standing considerable."
 th_old_hakurei_kutaka_aspect: "Kutaka"
 th_old_hakurei_kutaka_aspect_desc: "Kutaka is an ancient god who guards the gate of Hell, keeping order at the border crossing to the other world, and bearing the divine power to cure throat ailments."
 th_old_hakurei_hecatia_aspect: "Hecatia"
 th_old_hakurei_hecatia_aspect_desc: "Hecatia Lapislazuli is the goddess ruling the three realms of Hell. Though her true face is never revealed, the respect of the Enma proves she is the greatest in Gensokyo and beyond."
 th_old_hakurei_matara_aspect: "Matara"
 th_old_hakurei_matara_aspect_desc: "The supreme secret god lurking behind all things; earth mother, god of sericulture, stars, noh, obstacles, and of the discriminated. A sage who silently guards Gensokyo's order."
 th_old_hakurei_kasen_aspect: "Kasen"
 th_old_hakurei_kasen_aspect_desc: "Though not a god and of oni descent, as a righteous sage she stands with humanity to protect Gensokyo, upholding peace and order with goodwill, and is deeply respected."
 th_old_hakurei_yukari_aspect: "Yukari"
 th_old_hakurei_yukari_aspect_desc: "Though not truly a god, as the founder of the Great Hakurei Barrier and a sage guardian of Gensokyo, she is equally revered."
### Minor (slot 2) aspects: Matara's side statue, six sub-gods
 th_old_hakurei_earth_mother_aspect: "Earth Mother"
 th_old_hakurei_earth_mother_aspect_desc: "One of Matara's secondary statues. The great mother of the earth, blessing cultivation and harvest, increasing raw material output."
 th_old_hakurei_silkworm_god_aspect: "God of Sericulture"
 th_old_hakurei_silkworm_god_aspect_desc: "One of Matara's secondary statues. Protector of silkworms and weaving, increasing silk output."
 th_old_hakurei_star_god_aspect: "God of the Stars"
 th_old_hakurei_star_god_aspect_desc: "One of Matara's secondary statues. Ruling stars and fate, increasing monthly prosperity."
 th_old_hakurei_noh_god_aspect: "God of Noh"
 th_old_hakurei_noh_god_aspect_desc: "One of Matara's secondary statues. Guardian of arts and noh, increasing cultural tradition."
 th_old_hakurei_obstacle_god_aspect: "God of Obstacles"
 th_old_hakurei_obstacle_god_aspect_desc: "One of Matara's secondary statues. Ruling obstacles and trials, increasing the fort limit."
 th_old_hakurei_discriminated_god_aspect: "God of the Discriminated"
 th_old_hakurei_discriminated_god_aspect_desc: "One of Matara's secondary statues. Protector of the discriminated, increasing pop assimilation speed."
### Switch actions
 th_hakurei_change_statue: "Change Deity Statue"
 th_hakurei_change_statue_desc: "Spend religious influence to change the enshrined deity statue. Switching statues has a cooldown of 25 years."
 th_hakurei_change_minor_aspect: "Change Side Statue Aspect"
 th_hakurei_change_minor_aspect_desc: "Spend a little religious influence to quickly change the aspect of Matara's side statue (Earth Mother, God of Sericulture, God of the Stars, God of Noh, God of Obstacles, God of the Discriminated)."
 th_hakurei_change_statue_select_existing: "Select the statue to replace"
 th_hakurei_change_statue_select_new: "Select the new statue"
 th_hakurei_change_minor_aspect_select_existing: "Select the aspect to replace"
 th_hakurei_change_minor_aspect_select_new: "Select the new aspect"
 th_hakurei_change_aspect_no_existing: "No replaceable aspect"
 th_hakurei_change_aspect_no_new: "No new aspect available"
