l_english:
 the_touhou_universalis_ii_key: "#T Touhou Universalis II#! #italic 东方风云II#!"
 the_touhou_universalis_ii_dlc_desc: "This MOD is based on the Touhou Fuun Update of its predecessor, Europa Universalis 4, and is a derivative work of the Touhou Project.\n\nWe have added a brand-new continent named 「#color_gold Gensokyo#!」 in the western Pacific, along with dozens of new countries, and a new institution for each era. The foundation of Touhou Universalis II is complete — the MOD is now a playable framework: you can enter the game and experience the overall architecture, though the generic content is still to be filled in and features may feel sparse. In the full release we will add richer flavour content and situations, so that the fate of this land — and of the whole world — is written by you.\n\n#bold Recommended countries (right-click a country name for details):#!\n[GetCountry('T25').GetName] (Higan — Yama, leader of the Gensokyo IO)\n[GetCountry('T04').GetName] (Hakurei — Reimu)\n[GetCountry('T14').GetName] (Moriya — Sanae)\n[GetCountry('T05').GetName] (Mayohiga — Yukari)\n[GetCountry('T03').GetName] (Human Village)\n[GetCountry('T89').GetName] (Hieda Clan)\n[GetCountry('T00').GetName] (Scarlet Devil Mansion — Remilia)\n[GetCountry('T20').GetName] (Chireiden — Satori)\n\n#bold We need your feedback!#!\nJoin our Tencent QQ group: #color_very_light_blue 1021199028#!, or our Discord: https://discord.gg/z6JwYE8Vq. Please report any issues you encounter — every piece of feedback is valued.\n\nThe dev team is recruiting! We are also looking for localisation members — join the Discord OwO!\n\n#color_red Note:#! The 3D map feature is temporarily unavailable. Due to the author's limited hardware, the related editing work cannot be completed — we urgently need people with stronger hardware to help solve this.\n\n#italic 2026.8.2 Update: adapted to game version 1.3.11.#!"
