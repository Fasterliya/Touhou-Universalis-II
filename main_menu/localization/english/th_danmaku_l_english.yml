l_english:
 th_danmaku_challenge: "Danmaku Challenge"
 th_danmaku_challenge_desc: "Challenge a fellow member of the Gensokyo International Organization to a one-on-one danmaku duel. Victory and defeat are decided by danmaku firepower, and never touch upon territory."
 th_danmaku_challenge_title: "A Danmaku Challenge!"
 th_danmaku_challenge_event_desc: "A member of the Gensokyo International Organization has challenged us to a danmaku duel. Under the Spell Card Rules, the winner is decided by danmaku firepower — no territory will change hands."
 th_danmaku_challenge_accept: "Accept the Duel"
 th_danmaku_challenge_decline: "Politely Decline"
 th_danmaku_win_title: "Danmaku Duel Victory"
 th_danmaku_win_desc: "Our danmaku has prevailed! The duel is ours, and our name echoes through Gensokyo. Contribution, influence, and prestige are ours — and the title of Danmaku Champion for a time."
 th_danmaku_lose_title: "Danmaku Duel Defeat"
 th_danmaku_lose_desc: "We were outmatched in the duel. According to custom, we paid a tribute and suffered a loss of prestige — but no territory was lost. The defeat serves as a lesson."
 th_danmaku_draw_title: "Danmaku Duel Draw"
 th_danmaku_draw_desc: "Neither side could claim victory in the duel. Both duelists emerged with their reputations intact and a modest gain in contribution."
 th_danmaku_declined_title: "Challenge Declined"
 th_danmaku_declined_desc: "Our challenge was politely declined. No duel will take place."
 th_danmaku_ok: "Understood"
 STATIC_MODIFIER_NAME_th_danmaku_champion_modifier: "Danmaku Champion"
 STATIC_MODIFIER_DESC_th_danmaku_champion_modifier: "The victor of a danmaku duel. Prestige +0.10/month, improve relations +10%, diplomatic reputation +1, manpower +5%."
 STATIC_MODIFIER_NAME_th_title_incident_resolver_modifier: "Incident Resolver"
 STATIC_MODIFIER_DESC_th_title_incident_resolver_modifier: "One who resolves the incidents of Gensokyo. Prestige +0.05/month, improve relations +5%."
 STATIC_MODIFIER_NAME_th_title_banquet_king_modifier: "Banquet King"
 STATIC_MODIFIER_DESC_th_title_banquet_king_modifier: "The life of every banquet in Gensokyo. Improve relations +10%, diplomatic reputation +1."
 STATIC_MODIFIER_NAME_th_title_fastest_in_gensokyo_modifier: "Fastest in Gensokyo"
 STATIC_MODIFIER_DESC_th_title_fastest_in_gensokyo_modifier: "There is none swifter in the realm. Manpower +3%, prestige +0.03/month."
 STATIC_MODIFIER_NAME_th_title_danmaku_goddess_modifier: "Danmaku Goddess"
 STATIC_MODIFIER_DESC_th_title_danmaku_goddess_modifier: "A master of danmaku beyond compare. Prestige +0.10/month, diplomatic reputation +1."
