 th_gensokyo_culture_chronicle_desc:0 "The Child of the Hieda, carrying on the mission of her ancestors, continues to compile the Gensokyo Chronicle — a cultural encyclopedia recording a hundred youkai and ten thousand sights. Cultures that have integrated into this land are fully documented, while those yet to be accepted remain unsolved mysteries."
