 the_touhou_universalis_ii_dlc_desc:"Этот мод — продолжение обновления Touhou Fuun из Europa Universalis 4; производная работа по мотивам Touhou Project.\n\nМы добавили в западной части Тихого океана новый континент «#color_gold Генсокё#!» с десятками новых стран и по новой идее для каждой эпохи. База мода завершена — сейчас это играбельная рамка: можно опробовать общую архитектуру, но наполнение ещё впереди.\n\n#bold Рекомендуемые страны:#!\n[GetCountry('T25').GetName]\n[GetCountry('T04').GetName]\n[GetCountry('T14').GetName]\n[GetCountry('T05').GetName]\n[GetCountry('T03').GetName]\n[GetCountry('T89').GetName]\n[GetCountry('T00').GetName]\n[GetCountry('T20').GetName]\n\n#bold Нам нужна ваша обратная связь!#!\nГруппа Tencent QQ: #color_very_light_blue 1021199028#!, Discord: https://discord.gg/z6JwYE8Vq.\n\nКоманда набирает сотрудников и локализаторов — заходите в Discord OwO!\n\n#color_red Внимание:#! 3D-карта временно не работает; автору нужны люди с более мощным железом для её завершения.\n\n#italic Обновление 2026.8.2: адаптировано к версии игры 1.3.11.#!"
