### ============================================================
### Touhou-Universalis-II Russian Localization
### Автоматический перевод (машинный) — глоссарий согласован
### ============================================================
 th_panegyric_of_all_things_advance:"В эпоху восхваления всего сущего"
 th_panegyric_of_all_things_advance_desc:"В древнейшие времена люди ещё не разделяли мир на священное и ужасное, живое и неодушевлённое. Горы, реки, земля, леса и те существа, что ещё не обрели имён, — обо всём говорили вместе, всё восхваляли вместе.\n\nСумерки и тайна окутывали землю, а за пределами тьмы таилось неведомое. Люди благоговели перед тьмой и страшились неведомого. А истории, передаваемые из уст в уста, — вымыслы о необычном, страх перед тьмой — постепенно переплетались и сливались воедино.\n\nСама фантазия родилась именно из такого наследия."
 th_origin_dream_advance:"Изначальный сон"
 th_origin_dream_advance_desc:"Прежде чем мир обрёл форму, фантазия уже существовала. Фантазия — изначальная форма мира. Все тайны, легенды, диковинки и отвергнутые фантазии, привлечённые незримым зовом, собираются здесь. Так Генсокё стал их последним прибежищем, а также их изначальной точкой отсчёта."
 th_endless_fantasy_advance:"Вечная ночь"
 th_endless_fantasy_advance_desc:"Между реальностью и фантазией ещё не существовало чёткой границы — сны могли становиться явью, слухи могли порождать странных существ. Таинственное шло тем же путём, что и человечество, и всё сущее пребывало в той ещё не пробудившейся фантазии."
 th_gensokyo_chronicle_advance:"Хроника Генсокё"
 th_gensokyo_chronicle_advance_desc:"Только будучи записанным, нечто становится историей. Легенды и странные сказания здесь записывают и пересказывают, передавая из поколения в поколение вплоть до наших дней."
 th_balance_between_youkai_and_hito_advance:"Равновесие между людьми и ёкаями"
 th_balance_between_youkai_and_hito_advance_desc:"Это эпоха, когда люди ещё слабы. Когда наступает ночь, люди запирают двери и окна, не смея ступить за пределы деревни. За пределами деревень в лесах, бамбуковых рощах и диких пустошах таится бесчисленное множество тайн — и всё же большинство людей проживает всю жизнь, так и не узнав по-настоящему, что находится снаружи. Люди полагаются на защиту жриц святилищ ради спокойствия духа.\n\nЁкаи бродят во тьме, питаясь человеческим страхом и поддерживая своё существование ужасом, передающимся из уст в уста.\n\nЛюди боятся ёкаев, а ёкаям нужен человеческий страх. Две стороны противостоят друг другу, но остаются взаимозависимыми — вместе они образуют порядок этой эпохи."
 th_gensokyo_sages_advance:"Дозор мудрецов"
 th_gensokyo_sages_advance_desc:"Долгая ночь ещё не закончилась. Мудрецы Генсокё тихо наблюдают за этой землёй, благословенной фантазией. Они поддерживают границу между реальностью и фантазией, сохраняют равновесие между людьми и ёкаями. А мудрецы лишь наблюдают. Ночь за ночью. Эпоха за эпохой. И сегодня ночью мудрецы всё те же — они хранят истории, хранят традиции, хранят бесконечную фантазию."
 th_spell_card_rules_advance:"Правила заклинательных карт"
 th_spell_card_rules_advance_desc:"Чтобы ёкаи могли разрешать споры более справедливым образом, мудрецы сообща установили Правила заклинательных карт. С тех пор дуэли перестали быть лишь вопросом победы или поражения. Данмаку стало способом выразить своё существование и идеалы. Даже слабые получили право бросить вызов сильным. И этот завет, известный как Правила заклинательных карт, стал краеугольным камнем, поддерживающим равновесие Генсокё."
 th_incident_resolution_advance:"Порядок разрешения инцидентов"
 th_incident_resolution_advance_desc:"Для Генсокё сами инциденты — важная часть поддержания фантазии. Ёкаи используют их, чтобы заявить о своём существовании. Боги используют их, чтобы распространять свою веру. А люди восстанавливают равновесие, разрешая инциденты."
 th_age_of_stories_and_observations_advance:"Сказания, что разносятся далеко"
 th_age_of_stories_and_observations_advance_desc:"Это век путешественников, учёных и романистов. Когда книги, рукописи и истории широко распространились по Генсокё, люди начали покидать родные деревни и отправляться в более дальние места. Впечатления записываются, легенды собираются, а истории пересказываются заново."
 th_fantasy_book_compacts_advance:"Куда дует ветер"
 th_fantasy_book_compacts_advance_desc:"Никто не знает, откуда берётся ветер. И куда он подует. Одни слышат слухи из далёких земель, другие видят то, чего никогда не видели прежде, третьи записывают свои путешествия, а четвёртые сплетают их в новые истории. Так люди и события, некогда совершенно не связанные, соединяются дорогами, страницами и словами. От одного к другому, от одного к следующему. Все истории плывут по ветру во всё более дальние края, и Генсокё начинает меняться."
 th_the_distant_one_advance:"Далёкая"
 th_the_distant_one_advance_desc:"Перед началом каждой истории всегда есть недостижимая цель. Кто-то ищет пейзаж, которого не существует. Кто-то ищет утраченную историю. Кто-то преследует собственные мечты. Именно потому, что что-то остаётся недосягаемым, люди продолжают двигаться вперёд. И так пишутся истории, и начинается новая эпоха."
 th_scarlet_destiny_advance:"Алая судьба"
 th_scarlet_destiny_advance_desc:"Сначала люди просто видели даль. За туманом, за ёкаями и богами, казалось, скрывалось нечто, что ещё предстояло понять. Путешественники отправлялись в путь, учёные перелистывали страницы, романисты начинали писать новые сказания. Они не знали, где находится конец, но всё равно шли вперёд. Неизвестность приносит страх, но также и влечение. И вот впервые люди начали активно искать свою судьбу, а не ждать, когда она придёт сама."
 th_phantom_dreams_advance:"Призрачный сон"
 th_phantom_dreams_advance_desc:"Забытое. Погребённое. Запечатанное. Воспоминания, некогда дремавшие в глубинах истории, пробуждаются."
 th_eternal_night_advance:"Вечная ночь"
 th_eternal_night_advance_desc:"Мир продолжает расширяться, границы постоянно пересекаются, и люди начинают вглядываться во всё более далёкие места. Истории не заканчиваются, потому что загадки разгаданы. Мечты не прекращаются, потому что цель достигнута. И сказания всех, кто придёт после, начнутся с этой ночи."
 th_new_narratives_of_incidents_advance:"Новые истории об инцидентах"
 th_new_narratives_of_incidents_advance_desc:"Инциденты появляются вновь. Кто их начал? И зачем? Что пережили те, кто их разрешил? И с завершением каждого инцидента рождаются новые истории."
 th_words_like_pearls_advance:"Слова, подобные жемчужинам"
 th_words_like_pearls_advance_desc:"Люди начали верить, что запоминать стоит не только историю. Всё больше людей брались за кисть и чернила, сохраняя увиденное и услышанное на страницах. Так письменное слово вышло из школы и вошло в повседневную жизнь. Пишутся истории, записываются впечатления, распространяются идеи."
 th_cartography_of_rumors_advance:"Записи ста слухов"
 th_cartography_of_rumors_advance_desc:"Некогда смутный и расплывчатый мир постепенно обретал имена, и те неведомые земли впервые появились на бумаге."
 th_chronicles_of_mysteries_advance:"Хроники загадок"
 th_chronicles_of_mysteries_advance_desc:"По мере того как путешествия и обмен процветали, всё больше людей начинали записывать странные истории и необычайные события, распространявшиеся по Генсокё. Постепенно люди обнаружили, что даже самые сокровенные тайны не лишены различимых закономерностей. И истины, скрытые за бесчисленными загадками, ждут тех, кто ещё придёт."
 th_danmaku_reformation_advance:"Реформа карт заклинаний"
 th_danmaku_reformation_advance_desc:"С расцветом культуры люди начали вкладывать свои переживания, идеалы и способности в карты заклинаний. Блеск карт заклинаний стал решающим фактором победы, и бесчисленные истории сошлись в даммаку. Подобно тому как страницы сохраняют слова, карты заклинаний стали сосудами фантазии."
 th_printing_press_adoption_advance:"Печатный станок"
 th_printing_press_adoption_advance_desc:"По мере распространения печатной технологии книги и документы можно было копировать и распространять быстрее. История, легенды и знания, которые когда-то можно было только переписывать вручную, теперь могли более эффективно сохраняться и попадать в руки большего числа людей."
 th_emergent_journalism_advance:"Журналистика"
 th_emergent_journalism_advance_desc:"Повседневные наблюдения из деревень, городов и святилищ начали собираться и распространяться в более постоянных формах. Публика начала получать информацию и понимать мир через эти регулярно издаваемые публикации. Поток информации ускорился, и очертания мира становились яснее."
 th_silver_currency_standard_advance:"Обращение серебряной валюты"
 th_silver_currency_standard_advance_desc:"Использование серебра в качестве валюты расширилось по всему Генсокё. В давние времена серебряные монеты уже ходили на рынках как основа для оценки стоимости. В эту эпоху, с расширением сферы торговли и ростом частоты обмена, обращение серебряных монет значительно выросло, постепенно становясь универсальным средством обмена в более широкой экономической деятельности."
##Third Age Innovations
 th_boundary_gaze_advance:"Взгляд на границу"
 th_boundary_gaze_advance_desc:"Впервые Великий барьер стал не стеной, а объектом изучения. Учёные и мудрецы разбивали лагеря у его края, записывая его колебания, трещины и дыхание."
 th_rumors_of_the_outside_advance:"Слухи извне"
 th_rumors_of_the_outside_advance_desc:"Ветер, пересекающий барьер, приносит голоса извне. Люди начали обмениваться слухами о «внешнем мире» — небе без ёкаев, людях, которые больше не верят в богов."
 th_gateway_research_advance:"В поисках прохода"
 th_gateway_research_advance_desc:"Некоторые утверждали, что нашли слабое место барьера в глубине леса. Снаряжались экспедиции. Кто-то вернулся, кто-то нет. Но впервые пути были отмечены на картах."
 th_outside_contact_advance:"Первый контакт"
 th_outside_contact_advance_desc:"Генсокё провёл первый диалог с внешней цивилизацией. Языки различались, правила различались, но предметы и истории «оттуда» начали появляться в чайных домах."
 th_return_of_the_sealed_advance:"Вернувшиеся"
 th_return_of_the_sealed_advance_desc:"Те, кто был запечатан, изгнан и забыт, начали возвращаться один за другим. Они приносили воспоминания о внешнем мире — а с ними и вопросы, способные поколебать самые основы Генсокё."
 th_lunar_almanac_advance:"Альманах луны"
 th_lunar_almanac_advance_desc:"Люди начали записывать фазы луны, затмения и приливы чернилами. Впервые луна перешла из категории «божества» в категорию «объекта, который можно наблюдать»."
 th_moon_dialogue_advance:"Диалог с луной"
 th_moon_dialogue_advance_desc:"Легенда гласит, что лунные люди наблюдают за Генсокё с лунной поверхности. Некоторые пытались ответить лунному свету, другие стремились достичь луны колдовством. Диалог ещё не начался — но приглашение уже отправлено."
 th_eternity_rumor_advance:"Сказание о бессмертии"
 th_eternity_rumor_advance_desc:"Легенды Эйэнтей всплыли вновь — эликсир Хорай, бессмертие, изгнанная принцесса луны. Смерть больше не была неприкосновенным табу, а темой для обсуждения."
 th_empirical_eye_advance:"Эмпирическое око"
 th_empirical_eye_advance_desc:"Теоретики науки провозгласили, что «достойно веры лишь то, что можно проверить». Впервые сама фантазия была положена на экспериментальный стол."
 th_common_sense_erosion_advance:"Размывание здравого смысла"
 th_common_sense_erosion_advance_desc:"Здравый смысл внешнего мира просачивался в Генсокё, как вода. Ёкаи обнаружили, что люди больше их не боятся. Быть понятым — вот глубочайший ужас ёкая."
 th_heavenly_incidents_advance:"Инциденты извне"
 th_heavenly_incidents_advance_desc:"Новые инциденты приходят извне — павшие реликвии, нарушенные лунные фазы, явления, не поддающиеся классификации. Впервые мудрецы столкнулись с инцидентами, которые «нельзя было назвать»."
##Fourth Age: Kagura and Matsuri
 th_essence_of_faith_advance:"Сущность веры"
 th_essence_of_faith_advance_desc:"Когда боги и монахи четырёх сторон объявили Деревню людей своей, люди наконец задали самый фундаментальный вопрос — исходит ли сила веры действительно от богов, или от готовности верить, что живёт в каждом человеческом сердце? Впервые Генсокё сделал саму веру предметом пристального изучения."
 th_faith_and_doubt_advance:"Вера и сомнение"
 th_faith_and_doubt_advance_desc:"Сомнение перестало быть богохульством. Столько же людей дерзали спросить «существуют ли боги», сколько и преклоняли колени — и люди медленно учились, что лишь вера, закалённая сомнением, может по-настоящему стоять твёрдо."
 th_god_and_mortal_advance:"Боги среди смертных"
 th_god_and_mortal_advance_desc:"Боги спустились из своих святилищ и сели за те же чайные столы, что и смертные; ёкаи тоже впервые встали плечом к плечу с людьми на праздниках. Грань между богом и человеком начала стираться — и это стирание приблизило веру как никогда прежде."
 th_sacred_music_advance:"Глава мацури"
 th_sacred_music_advance_desc:"Бой барабанов, пение флейт и танец кагуры стали древнейшим и всеобщим языком между богами и смертными. Когда мацури разносилось по Генсокё, люди верили — боги слышат этот звук, и в нём слышат самих себя."
 th_festival_protocol_advance:"Протоколы праздников"
 th_festival_protocol_advance_desc:"Праздники перестали быть простым народным весельем. Генсокё начал устанавливать общие обряды поклонения — когда бить в барабан, как предлагать танец, какие подношения уместны. Чем торжественнее ритуал, тем тяжелее и благочестивее вера."
 th_schism_of_belief_advance:"Раскол веры"
 th_schism_of_belief_advance_desc:"Об одной и той же фантазии говорили по-разному в глазах Мории и Хакурей, Мёрёндзи и Мира Бессмертных. Раскол не был катастрофой — люди начали понимать, что лишь через раскол вера по-настоящему взрослеет."
 th_reform_of_rites_advance:"Реформа обрядов"
 th_reform_of_rites_advance_desc:"Старые способы поклонения сочли не отвечающими эпохе, и обряды реформировали повсюду — упрощая вычурное, переплетая кагуру заново, позволяя вере идти в ногу со временем. Пламя реформ охватило каждое святилище и храм Генсокё."
 th_pilgrimage_roads_advance:"Расцвет паломнических дорог"
 th_pilgrimage_roads_advance_desc:"Паломнические маршруты пронизали Генсокё, и верующие отправились по ним. Впервые вера обрела географию — горы, храмы и святилища, сплетённые в единую сеть путей."
 th_human_divinity_advance:"Божественность человека"
 th_human_divinity_advance_desc:"Люди медленно обнаружили, что чудо не нужно — человеческая добродетель сама несёт божественное. Когда и ёкаи, и люди увидели сияние в добрых делах, вера стала менее созерцанием богов и более празднованием самого человечества."
 th_faith_as_power_advance:"Вера как сила"
 th_faith_as_power_advance_desc:"Вера стала пониматься как нечто, что можно накапливать и за что можно бороться. Подношения, сердца и известность стали ресурсами в состязании сил — каждый праздник полем битвы, а благочестие острейшим клинком."
 th_eternal_question_advance:"Стойкость богов"
 th_eternal_question_advance_desc:"Когда эпоха подходила к концу, Генсокё столкнулся с одним общим вопросом — если вера должна измениться, в какой форме пребудут боги? Одни хранили свои имена кагурой, другие несли свои души в историях, и отныне стойкость богов покоилась на памяти смертных."
##Fifth Age: All Things as One
 th_oneness_philosophy_advance:"Принцип единства"
 th_oneness_philosophy_advance_desc:"Когда шум веры затих, философы начали спорить о древнем тезисе — что всё рождено из одной фантазии. Человек и ёкай, бог и смертный — лишь разные отражения единой фантазии. Впервые Генсокё услышал философию «единства»."
 th_dissolution_of_boundary_advance:"Растворение границ"
 th_dissolution_of_boundary_advance_desc:"Линии между человеком и ёкаем, богом и смертным, обыденным и фантастическим — все были пересмотрены. Границы естественны или созданы? Как только люди начали сомневаться в черте, она уже начала ослабевать."
 th_common_destiny_advance:"Общая судьба"
 th_common_destiny_advance_desc:"Перед лицом пришедшего извне и неизвестного государства Генсокё впервые осознали, что разделяют единую судьбу. Различия оставались, но никто больше не мог притворяться островом — ветер несёт всё в одно место."
 th_unity_of_orders_advance:"Много законов, один порядок"
 th_unity_of_orders_advance_desc:"Запутанные законы многих государств были пересмотрены — существует ли «одно», которому должны следовать все государства Генсокё? Когда разрозненные правила начинают течь к единому порядку, объединение перестаёт быть мечтой."
 th_great_unification_advance:"Великое объединение"
 th_great_unification_advance_desc:"Впервые была задумана структура, превосходящая любую отдельную державу — Генсокё как целое, а не просто соединение его государств. Великое объединение остаётся нерешённым, но некоторые уже начали его воображать."
 th_center_and_periphery_advance:"Центр и периферия"
 th_center_and_periphery_advance_desc:"В потоке объединения отношение между центром и периферией было переопределено. Периферия больше не была объектом завоевания — каждая земля по-своему участвует в создании «единого»."
 th_order_within_chaos_advance:"Порядок внутри хаоса"
 th_order_within_chaos_advance_desc:"Суть Генсокё — раздробленность и хаос, и люди начали учиться строить порядок внутри хаоса, который не разрушал бы его. Как барьер удерживает рядом десять тысяч вещей — порядок и беспорядок лишь две грани одного целого."
 th_collective_identity_advance:"Коллективная идентичность"
 th_collective_identity_advance_desc:"Идентичность «народа Генсокё», преодолевающая расу и веру, начала обретать форму. Когда люди стали называть себя «жителем Генсокё», а не «подданным какой-то земли», эпоха единства уже тихо наступила."
 th_barrier_and_oneness_advance:"Барьер и единое"
 th_barrier_and_oneness_advance_desc:"Великий барьер — это стена, которая разделяет, или оболочка, которая вмещает? Он охраняет разделение, даже заключая в себе объединение — люди поняли, что барьер не препятствие для «единого», а его сосуд."
 th_guardians_of_order_advance:"Хранители порядка"
 th_guardians_of_order_advance_desc:"Кто вправе определять «единое»? Мудрецы и хранители были подвергнуты новым вопросам в эпоху объединения. Жрица больше не была лишь разделительницей, ни мудрецы — лишь наблюдателями; обоим пришлось ответить, что именно они на самом деле охраняют."
 th_eternal_diversity_advance:"Много путей, одно возвращение"
 th_eternal_diversity_advance_desc:"Прозрение конца эпохи — истинному «единому» не нужно стирать различия. У всего есть свои пути: ёкаи — к горам, люди — к деревням, боги — к своим святилищам; и всё же все возвращаются к одной фантазии. Много путей, и в конце одно возвращение."
