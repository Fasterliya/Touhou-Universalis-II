### ============================================================
### Touhou-Universalis-II Russian Localization
### Автоматический перевод (машинный) — глоссарий согласован
### ============================================================
 th_panegyric_of_all_things_advance:"В эпоху восхваления всего сущего"
 th_panegyric_of_all_things_advance_desc:"В древнейшие времена люди ещё не разделяли мир на священное и ужасное, живое и неодушевлённое. Горы, реки, земля, леса и те существа, что ещё не обрели имён, — обо всём говорили вместе, всё восхваляли вместе.\n\nСумерки и тайна окутывали землю, а за пределами тьмы таилось неведомое. Люди благоговели перед тьмой и страшились неведомого. А истории, передаваемые из уст в уста, — вымыслы о необычном, страх перед тьмой — постепенно переплетались и сливались воедино.\n\nСама фантазия родилась именно из такого наследия."
 th_origin_dream_advance:"Изначальный сон"
 th_origin_dream_advance_desc:"Прежде чем мир обрёл форму, фантазия уже существовала. Фантазия — изначальная форма мира. Все тайны, легенды, диковинки и отвергнутые фантазии, привлечённые незримым зовом, собираются здесь. Так Генсокё стал их последним прибежищем, а также их изначальной точкой отсчёта."
 th_endless_fantasy_advance:"Вечная ночь"
 th_endless_fantasy_advance_desc:"Между реальностью и фантазией ещё не существовало чёткой границы — сны могли становиться явью, слухи могли порождать странных существ. Таинственное шло тем же путём, что и человечество, и всё сущее пребывало в той ещё не пробудившейся фантазии."
 th_gensokyo_chronicle_advance:"Хроника Генсокё"
 th_gensokyo_chronicle_advance_desc:"Только будучи записанным, нечто становится историей. Легенды и странные сказания здесь записывают и пересказывают, передавая из поколения в поколение вплоть до наших дней."
 th_balance_between_youkai_and_hito_advance:"Равновесие между людьми и ёкаями"
 th_balance_between_youkai_and_hito_advance_desc:"Это эпоха, когда люди ещё слабы. Когда наступает ночь, люди запирают двери и окна, не смея ступить за пределы деревни. За пределами деревень в лесах, бамбуковых рощах и диких пустошах таится бесчисленное множество тайн — и всё же большинство людей проживает всю жизнь, так и не узнав по-настоящему, что находится снаружи. Люди полагаются на защиту жриц святилищ ради спокойствия духа.\n\nЁкаи бродят во тьме, питаясь человеческим страхом и поддерживая своё существование ужасом, передающимся из уст в уста.\n\nЛюди боятся ёкаев, а ёкаям нужен человеческий страх. Две стороны противостоят друг другу, но остаются взаимозависимыми — вместе они образуют порядок этой эпохи."
 th_gensokyo_sages_advance:"Дозор мудрецов"
 th_gensokyo_sages_advance_desc:"Долгая ночь ещё не закончилась. Мудрецы Генсокё тихо наблюдают за этой землёй, благословенной фантазией. Они поддерживают границу между реальностью и фантазией, сохраняют равновесие между людьми и ёкаями. А мудрецы лишь наблюдают. Ночь за ночью. Эпоха за эпохой. И сегодня ночью мудрецы всё те же — они хранят истории, хранят традиции, хранят бесконечную фантазию."
 th_spell_card_rules_advance:"Правила заклинательных карт"
 th_spell_card_rules_advance_desc:"Чтобы ёкаи могли разрешать споры более справедливым образом, мудрецы сообща установили Правила заклинательных карт. С тех пор дуэли перестали быть лишь вопросом победы или поражения. Данмаку стало способом выразить своё существование и идеалы. Даже слабые получили право бросить вызов сильным. И этот завет, известный как Правила заклинательных карт, стал краеугольным камнем, поддерживающим равновесие Генсокё."
 th_incident_resolution_advance:"Порядок разрешения инцидентов"
 th_incident_resolution_advance_desc:"Для Генсокё сами инциденты — важная часть поддержания фантазии. Ёкаи используют их, чтобы заявить о своём существовании. Боги используют их, чтобы распространять свою веру. А люди восстанавливают равновесие, разрешая инциденты."
 th_age_of_stories_and_observations_advance:"Сказания, что разносятся далеко"
 th_age_of_stories_and_observations_advance_desc:"Это век путешественников, учёных и романистов. Когда книги, рукописи и истории широко распространились по Генсокё, люди начали покидать родные деревни и отправляться в более дальние места. Впечатления записываются, легенды собираются, а истории пересказываются заново."
 th_fantasy_book_compacts_advance:"Куда дует ветер"
 th_fantasy_book_compacts_advance_desc:"Никто не знает, откуда берётся ветер. И куда он подует. Одни слышат слухи из далёких земель, другие видят то, чего никогда не видели прежде, третьи записывают свои путешествия, а четвёртые сплетают их в новые истории. Так люди и события, некогда совершенно не связанные, соединяются дорогами, страницами и словами. От одного к другому, от одного к следующему. Все истории плывут по ветру во всё более дальние края, и Генсокё начинает меняться."
 th_the_distant_one_advance:"Далёкая"
 th_the_distant_one_advance_desc:"Перед началом каждой истории всегда есть недостижимая цель. Кто-то ищет пейзаж, которого не существует. Кто-то ищет утраченную историю. Кто-то преследует собственные мечты. Именно потому, что что-то остаётся недосягаемым, люди продолжают двигаться вперёд. И так пишутся истории, и начинается новая эпоха."
 th_scarlet_destiny_advance:"Алая судьба"
 th_scarlet_destiny_advance_desc:"Сначала люди просто видели даль. За туманом, за ёкаями и богами, казалось, скрывалось нечто, что ещё предстояло понять. Путешественники отправлялись в путь, учёные перелистывали страницы, романисты начинали писать новые сказания. Они не знали, где находится конец, но всё равно шли вперёд. Неизвестность приносит страх, но также и влечение. И вот впервые люди начали активно искать свою судьбу, а не ждать, когда она придёт сама."
 th_phantom_dreams_advance:"Призрачный сон"
 th_phantom_dreams_advance_desc:"Забытое. Погребённое. Запечатанное. Воспоминания, некогда дремавшие в глубинах истории, пробуждаются."
 th_eternal_night_advance:"Вечная ночь"
 th_eternal_night_advance_desc:"Мир продолжает расширяться, границы постоянно пересекаются, и люди начинают вглядываться во всё более далёкие места. Истории не заканчиваются, потому что загадки разгаданы. Мечты не прекращаются, потому что цель достигнута. И сказания всех, кто придёт после, начнутся с этой ночи."
 th_new_narratives_of_incidents_advance:"Новые истории об инцидентах"
 th_new_narratives_of_incidents_advance_desc:"Инциденты появляются вновь. Кто их начал? И зачем? Что пережили те, кто их разрешил? И с завершением каждого инцидента рождаются новые истории."
 th_words_like_pearls_advance:"Слова, подобные жемчужинам"
 th_words_like_pearls_advance_desc:"Люди начали верить, что запоминать стоит не только историю. Всё больше людей брались за кисть и чернила, сохраняя увиденное и услышанное на страницах. Так письменное слово вышло из школы и вошло в повседневную жизнь. Пишутся истории, записываются впечатления, распространяются идеи."
 th_cartography_of_rumors_advance:"Записи ста слухов"
 th_cartography_of_rumors_advance_desc:"Некогда смутный и расплывчатый мир постепенно обретал имена, и те неведомые земли впервые появились на бумаге."
 th_chronicles_of_mysteries_advance:"Хроники загадок"
 th_chronicles_of_mysteries_advance_desc:"По мере того как путешествия и обмен процветали, всё больше людей начинали записывать странные истории и необычайные события, распространявшиеся по Генсокё. Постепенно люди обнаружили, что даже самые сокровенные тайны не лишены различимых закономерностей. И истины, скрытые за бесчисленными загадками, ждут тех, кто ещё придёт."
 th_danmaku_reformation_advance:"Реформа карт заклинаний"
 th_danmaku_reformation_advance_desc:"С расцветом культуры люди начали вкладывать свои переживания, идеалы и способности в карты заклинаний. Блеск карт заклинаний стал решающим фактором победы, и бесчисленные истории сошлись в даммаку. Подобно тому как страницы сохраняют слова, карты заклинаний стали сосудами фантазии."
 th_printing_press_adoption_advance:"Печатный станок"
 th_printing_press_adoption_advance_desc:"По мере распространения печатной технологии книги и документы можно было копировать и распространять быстрее. История, легенды и знания, которые когда-то можно было только переписывать вручную, теперь могли более эффективно сохраняться и попадать в руки большего числа людей."
 th_emergent_journalism_advance:"Журналистика"
 th_emergent_journalism_advance_desc:"Повседневные наблюдения из деревень, городов и святилищ начали собираться и распространяться в более постоянных формах. Публика начала получать информацию и понимать мир через эти регулярно издаваемые публикации. Поток информации ускорился, и очертания мира становились яснее."
 th_silver_currency_standard_advance:"Обращение серебряной валюты"
 th_silver_currency_standard_advance_desc:"Использование серебра в качестве валюты расширилось по всему Генсокё. В давние времена серебряные монеты уже ходили на рынках как основа для оценки стоимости. В эту эпоху, с расширением сферы торговли и ростом частоты обмена, обращение серебряных монет значительно выросло, постепенно становясь универсальным средством обмена в более широкой экономической деятельности."
