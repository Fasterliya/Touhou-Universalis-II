l_russian:
 th_danmaku_challenge: "Вызов на данмаку"
 th_danmaku_challenge_desc: "Вызвать члена Международной организации Генсокё на дуэль данмаку один на один. Победа и поражение решаются огневой мощью данмаку и никогда не касаются территории."
 th_danmaku_challenge_title: "Вызов на данмаку!"
 th_danmaku_challenge_event_desc: "Один из членов Международной организации Генсокё бросил нам вызов на дуэль данмаку. По Правилам Карт Заклинаний победитель определяется огневой мощью данмаку — территории не изменятся."
 th_danmaku_challenge_accept: "Принять дуэль"
 th_danmaku_challenge_decline: "Вежливо отказаться"
 th_danmaku_win_title: "Победа в дуэли данмаку"
 th_danmaku_win_desc: "Наше данмаку восторжествовало! Дуэль наша, и наше имя гремит по Генсокё. Мы получаем вклад, влияние и славу — а также на время титул чемпиона данмаку."
 th_danmaku_lose_title: "Поражение в дуэли данмаку"
 th_danmaku_lose_desc: "Мы уступили в дуэли. По обычаю мы выплатили дань и потеряли славу — но не потеряли ни клочка территории. Поражение послужит уроком."
 th_danmaku_draw_title: "Ничья в дуэли данмаку"
 th_danmaku_draw_desc: "Ни одна из сторон не смогла одержать победу. Оба дуэлянта сохранили репутацию и получили скромный вклад."
 th_danmaku_declined_title: "Вызов отклонён"
 th_danmaku_declined_desc: "Наш вызов был вежливо отклонён. Дуэль не состоится."
 th_danmaku_ok: "Понятно"
 STATIC_MODIFIER_NAME_th_danmaku_champion_modifier: "Чемпион данмаку"
 STATIC_MODIFIER_DESC_th_danmaku_champion_modifier: "Победитель дуэли данмаку. Слава +0.10/мес, улучшение отношений +10%, дипломатическая репутация +1, людские ресурсы +5%."
 STATIC_MODIFIER_NAME_th_title_incident_resolver_modifier: "Решитель инцидентов"
 STATIC_MODIFIER_DESC_th_title_incident_resolver_modifier: "Тот, кто разрешает инциденты Генсокё. Слава +0.05/мес, улучшение отношений +5%."
 STATIC_MODIFIER_NAME_th_title_banquet_king_modifier: "Король пиров"
 STATIC_MODIFIER_DESC_th_title_banquet_king_modifier: "Душа каждого пира в Генсокё. Улучшение отношений +10%, дипломатическая репутация +1."
 STATIC_MODIFIER_NAME_th_title_fastest_in_gensokyo_modifier: "Быстрейший в Генсокё"
 STATIC_MODIFIER_DESC_th_title_fastest_in_gensokyo_modifier: "В этих землях нет никого быстрее. Людские ресурсы +3%, слава +0.03/мес."
 STATIC_MODIFIER_NAME_th_title_danmaku_goddess_modifier: "Богиня данмаку"
 STATIC_MODIFIER_DESC_th_title_danmaku_goddess_modifier: "Мастер данмаку, не знающий равных. Слава +0.10/мес, дипломатическая репутация +1."
