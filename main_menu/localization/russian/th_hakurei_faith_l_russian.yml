l_russian:
### Народная вера Хакурей (old_hakurei) — аспекты веры и действия переключения. Дизайн: 幻想乡神道「博丽风俗」神像.txt
### Божества (слот 1)
 th_old_hakurei_hakurei_god_aspect: "Бог Хакурей"
 th_old_hakurei_hakurei_god_aspect_desc: "Святилище Хакурей почитает «Бога Хакурей», но даже жрицы, передающие традицию из поколения в поколение, не знают его истинной сущности."
 th_old_hakurei_shinki_aspect: "Синки"
 th_old_hakurei_shinki_aspect_desc: "Богиня-создательница старого Макай. Даже в Генсокё её почитают и страшатся."
 th_old_hakurei_yuka_aspect: "Юка"
 th_old_hakurei_yuka_aspect_desc: "Великая ёкай, живущая в Подсолнуховых полях Генсокё, с силой, подавляющей обычных ёкаев, — одна из опор местного порядка."
 th_old_hakurei_sariel_aspect: "Сариэль"
 th_old_hakurei_sariel_aspect_desc: "Падший ангел, рождённый, как говорят, в древнюю эпоху смешения Небес и Макай, где она играла важнейшую роль."
 th_old_hakurei_mima_aspect: "Мима"
 th_old_hakurei_mima_aspect_desc: "Злой дух с малоизвестным обликом, чьё место в вере Хакурей упрочено бурной историей и связями со многими знаменитыми фигурами."
 th_old_hakurei_kutaka_aspect: "Кутака"
 th_old_hakurei_kutaka_aspect_desc: "Древняя богиня, страж врат ада, блюдущая порядок на рубеже миров и наделённая силой исцелять болезни горла."
 th_old_hakurei_hecatia_aspect: "Хекатия"
 th_old_hakurei_hecatia_aspect_desc: "Богиня трёх миров ада. Её лик не явлен, но почтение энма доказывает: она величайшая в Генсокё и за его пределами."
 th_old_hakurei_matara_aspect: "Матара"
 th_old_hakurei_matara_aspect_desc: "Сокровенная богиня, таящаяся за всем сущим; также богиня-мать, бог шелководства, звёзд, но, препятствий и гонимых. Мудрец, безмолвно хранящий порядок Генсокё."
 th_old_hakurei_kasen_aspect: "Касэн"
 th_old_hakurei_kasen_aspect_desc: "Не богиня и родом из они, но как мудрец, держащийся правого пути, всегда стоит на стороне людей, оберегая покой и порядок Генсокё, за что глубоко почитаема."
 th_old_hakurei_yukari_aspect: "Юкари"
 th_old_hakurei_yukari_aspect_desc: "Фактически не богиня, но как создательница Великого барьера Хакурей и мудрец-хранительница Генсокё пользуется не меньшим почитанием."
### Второстепенные аспекты (слот 2): боковое изваяние Матары, шесть божеств
 th_old_hakurei_earth_mother_aspect: "Богиня-мать"
 th_old_hakurei_earth_mother_aspect_desc: "Одно из боковых изваяний Матары. Мать-земля благословляет земледелие и урожай, повышая выход продукции."
 th_old_hakurei_silkworm_god_aspect: "Бог шелководства"
 th_old_hakurei_silkworm_god_aspect_desc: "Одно из боковых изваяний Матары. Покровитель шелководства, повышает производство шёлка."
 th_old_hakurei_star_god_aspect: "Бог созвездий"
 th_old_hakurei_star_god_aspect_desc: "Одно из боковых изваяний Матары. Властвует над звёздами и судьбой, повышает ежемесячное процветание."
 th_old_hakurei_noh_god_aspect: "Бог но"
 th_old_hakurei_noh_god_aspect_desc: "Одно из боковых изваяний Матары. Покровитель искусств и но, повышает культурные традиции."
 th_old_hakurei_obstacle_god_aspect: "Бог препятствий"
 th_old_hakurei_obstacle_god_aspect_desc: "Одно из боковых изваяний Матары. Властвует над препятствиями и испытаниями, повышает лимит крепостей."
 th_old_hakurei_discriminated_god_aspect: "Бог гонимых"
 th_old_hakurei_discriminated_god_aspect_desc: "Одно из боковых изваяний Матары. Покровитель гонимых, повышает скорость ассимиляции населения."
### Действия переключения
 th_hakurei_change_statue: "Сменить изваяние божества"
 th_hakurei_change_statue_desc: "Потратьте религиозное влияние, чтобы сменить почитаемое изваяние божества. Переключение изваяний имеет кулдаун 25 лет."
 th_hakurei_change_minor_aspect: "Сменить аспект бокового изваяния"
 th_hakurei_change_minor_aspect_desc: "Потратьте немного религиозного влияния, чтобы быстро сменить аспект бокового изваяния Матары (Богиня-мать, Бог шелководства, Бог созвездий, Бог но, Бог препятствий, Бог гонимых)."
 th_hakurei_change_statue_select_existing: "Выберите изваяние для замены"
 th_hakurei_change_statue_select_new: "Выберите новое изваяние"
 th_hakurei_change_minor_aspect_select_existing: "Выберите аспект для замены"
 th_hakurei_change_minor_aspect_select_new: "Выберите новый аспект"
 th_hakurei_change_aspect_no_existing: "Нет аспектов для замены"
 th_hakurei_change_aspect_no_new: "Нет доступных новых аспектов"
