### 思潮
 th_genesis_of_gensokyo_institution:"Хроника Генсокё"
 th_genesis_of_gensokyo_institution_desc:"В первые дни Генсокё истории рождались из праздных разговоров у костров, распространялись в перешёптываниях людей и передавались из поколения в поколение. Образы ёкаев, чудеса богов, рассказы о странных происшествиях и древние легенды — всё это сплеталось в самые ранние воспоминания этой земли.\n\nОднако даже самые чудесные сказания меркли в забвении, а древнейшие легенды терялись с течением времени. Чтобы ёкаи не были забыты, а легенды не оказались погребены под грузом лет, записывание постепенно стало важным делом.\n\nЭти истории, записанные на бумаге, начали выходить за пределы устной традиции, превращаясь в летописи, которые можно было передавать сквозь века. Так впервые у Генсокё появилась собственная память."
