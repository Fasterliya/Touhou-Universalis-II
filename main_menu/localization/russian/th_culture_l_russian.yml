 th_gensokyo_fantasy_journey_institution:"Путевые заметки и сказания"
 th_gensokyo_fantasy_journey_institution_desc:"На протяжении долгих лет историю Генсокё записывали предки и Дети Миарэ. Люди верили передаваемым историям, доверяли всему, что записано в Хронике Генсокё, и считали неизведанное неприкосновенной тайной.\n\nОднако с расцветом книгопечатания, переписывания и литературы в Деревне людей стало распространяться всё больше историй. Они больше не были только о богах и ёкаях. Рассказы путешественников, опыт купцов, исследования учёных и фантазии бесчисленных простых людей постепенно становились новыми историями. Впервые люди осознали, что можно записывать не только историю, но и истории 'людей'.\n\nТак люди начали покидать свои привычные деревни, исследуя леса, горы и озёра. Они стали пытаться понять законы, управляющие миром, а не довольствоваться объяснениями, оставленными предками. Тайна по-прежнему существовала, но больше не была лишь страхом и табу. Взаимодействие между людьми и ёкаями постепенно росло, торговля и путешествия становились всё более оживлёнными, а новые идеи распространялись по Генсокё дорогами и книгами.\n\nЭто была эпоха, принадлежавшая путешественникам, учёным и романистам. От историй, которые рассказывали, к историям, пережитым лично; от записанной истории — к эпохе, принадлежащей каждому."
 STATIC_MODIFIER_NAME_th_gensokyo_fantasy_journey_institution_birth:"$th_gensokyo_fantasy_journey_institution$ Колыбель"
 th_heavenly_artifact_institution:"Вещи извне"
 th_heavenly_artifact_institution_desc:"Истории распространялись по холмам и деревням, и границы пересекались вновь и вновь. Когда люди впервые подняли головы и по-настоящему взглянули на луну, повисшую над Генсокё, тихо всплыла мысль — может ли за краем фантазии существовать другой мир? Вещи извне начали пересекать барьер: павшие реликвии, потерянные люди, забытые легенды — все они утверждали, что пришли «извне». Мудрецы молча наблюдали за ними, не изгоняя и не принимая. И впервые народ Генсокё осознал — мир никогда не был лишь этой одной землёй. Те, кто пришёл издалека, кто не поддавался классификации и кого нельзя было игнорировать, теперь стучались в дверь Великого барьера."
 STATIC_MODIFIER_NAME_th_heavenly_artifact_institution_birth:"$th_heavenly_artifact_institution$ Колыбель"
 th_kagura_and_matsuri_institution:"Кагура и мацури"
 th_kagura_and_matsuri_institution_desc:"Стук вещей извне ещё не затих, когда вера Генсокё начала колебаться. Боги Мории спустились с далёких гор, неся невиданные прежде чудеса, и провозгласили, что «богов можно понять». Жрица Хакурей смотрела, как её ящик для подношений становится всё холоднее, и впервые задумалась — можно ли забыть и богов? Мудрец Мавзолея Божественного Духа выехала на своём паланкине, взяв разум за меч; монахиня Мёрёндзи стояла со сложенными ладонями, взяв милосердие за ладью. Деревня людей стала доской, где столкнулись четыре веры — каждый праздник был немой войной. Боги и люди, ёкаи и люди — кто кого почитает? И кто будет помнить?"
 STATIC_MODIFIER_NAME_th_kagura_and_matsuri_institution_birth:"$th_kagura_and_matsuri_institution$ Колыбель"
 th_all_things_as_one_institution:"Всё едино"
 th_all_things_as_one_institution_desc:"Даже шум веры обретает тишину. Когда боги и люди, ёкаи и люди наконец увидели друг друга сквозь бесчисленные праздники и распри, всплыл древний вопрос — не были ли они с самого начала единым родом? Всё в своей основе неразличимо; люди и ёкаи рождены одной фантазией, боги и смертные стоят перед одним алтарём. Хранительница, стоящая на границе между человеком и ёкаем как жрица, начала сомневаться, должна ли эта граница вообще существовать. Генсокё впервые услышал зов «единства» — и этот зов смутил даже старейших мудрецов."
