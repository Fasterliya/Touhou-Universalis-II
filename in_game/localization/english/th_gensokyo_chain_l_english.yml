 WE_PERFORM_th_gensokyo_crusade_leave_ACTION: "We left the Tribunal"
 OTHER_PERFORMS_th_gensokyo_crusade_leave_ACTION: "Left the Tribunal"
 ACTION_th_gensokyo_crusade_leave_PERFORMED_ON_US: "Left the Tribunal"
