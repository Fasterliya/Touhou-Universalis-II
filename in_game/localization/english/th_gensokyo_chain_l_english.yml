 WE_PERFORM_th_gensokyo_feast_ACTION: "We held a feast in Gensokyo"
 OTHER_PERFORMS_th_gensokyo_feast_ACTION: "Held a feast in Gensokyo"
 ACTION_th_gensokyo_feast_PERFORMED_ON_US: "Held a feast in Gensokyo"
 TH_FEAST_AI_HIGH_NOTORIETY: "Discordant heart running high, in need of temperance"

### Crusade peace treaty
 th_gensokyo_crusade_triumph: "Total Victory (Crusade)"
 th_gensokyo_crusade_triumph_desc: "Total victory in a punitive crusade: the enemy surrenders unconditionally and accepts all verdicts of Gensokyo."
