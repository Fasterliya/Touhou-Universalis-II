### WP-D 2026-08-15: Expansion request adjudication events (搂3.1)
### ============================================================
 th_gensokyo_expansion_request_events.1.title: "An Expansion Request"
 th_gensokyo_expansion_request_events.1.desc: "A nation requests permission to expand within Gensokyo and asks for your approval as a sage. You may grant a casus belli, or refuse as a lesson."
 th_gensokyo_expansion_request_events.1.a: "Approve: grant the casus belli for expansion"
 th_gensokyo_expansion_request_events.1.b: "Refuse: deny permission (the requester's chaotic heart is somewhat tempered)"
 th_gensokyo_expansion_request_events.2.title: "Expansion Approved by a Sage"
 th_gensokyo_expansion_request_events.2.desc: "A sage has approved your expansion request. You have gained a casus belli for the target location: ceding provinces costs +75% war score, and antagonism gained is reduced by 40%."
 th_gensokyo_expansion_request_events.2.a: "Understood"
 th_gensokyo_expansion_request_events.3.title: "Expansion Request Refused"
 th_gensokyo_expansion_request_events.3.desc: "The sage refused your expansion request and admonished you to temper your chaotic heart. Your chaotic leaning recedes slightly, and the sage's opinion of you has changed."
 th_gensokyo_expansion_request_events.3.a: "I shall heed the lesson"

