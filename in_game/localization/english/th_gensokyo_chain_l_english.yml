### ============================================================
### Gensokyo IO Chain System Localization (English)
### ============================================================

### Values (En <-> Ran, societal value bar)
 th_gensokyo_amity_vs_belligerence: "En and Ran"
 th_gensokyo_amity_vs_belligerence_desc: "Those of En weave bonds with all living things, joining hearts in harmony, guarding the Human Village and keeping the Great Barrier at peace; those of Ran raise arms in discord, waging endless war, chasing fleeting dreams and disturbing Gensokyo's order. The leaning of one's heart is plain for all to see."
 th_gensokyo_amity_focus: "En (Bond)"
 belligerence_focus: "Ran (Discord)"

### 2026-08-23: stage-based notorious value modifier keys removed
### (th_notorious_tier_clean/pariah/outcast — system deleted with tier auto_modifiers)

### Feast
 th_gensokyo_feast: "Hold a Feast"
 th_gensokyo_feast_desc: "Hold a grand feast in Gensokyo, entertaining yokai and sages alike to temper your discordant heart and return to the path of En."
