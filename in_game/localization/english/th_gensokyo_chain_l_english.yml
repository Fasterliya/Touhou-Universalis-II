 th_gensokyo_expansion_cost_authorized_modifier: "Sage-Authorized Expansion"
 th_gensokyo_expansion_cost_authorized_modifier_desc: "With the sages' approval, expansion is far cheaper."
 th_gensokyo_expansion_cost_incident_modifier: "Incident Expansion"
 th_gensokyo_expansion_cost_incident_modifier_desc: "Expanding during an incident, at a slightly higher cost."
 th_gensokyo_expansion_cost_unauthorized_modifier: "Unauthorized Expansion"
 th_gensokyo_expansion_cost_unauthorized_modifier_desc: "Expansion without the sages' approval is costly."
 th_gensokyo_notorious_pariah_modifier: "Outcast of Discord"
 th_gensokyo_notorious_pariah_modifier_desc: "This country has fallen into the way of discord. It may be proposed as a crusade target."

