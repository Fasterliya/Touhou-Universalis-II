### ============================================================
### Gensokyo IO Chain System Localization (English)
### ============================================================

### Values (En <-> Ran, societal value bar)
 th_gensokyo_amity_vs_belligerence: "En and Ran"
 th_gensokyo_amity_vs_belligerence_desc: "Those of En weave bonds with all living things, joining hearts in harmony, guarding the Human Village and keeping the Great Barrier at peace; those of Ran raise arms in discord, waging endless war, chasing fleeting dreams and disturbing Gensokyo's order. The leaning of one's heart is plain for all to see."
 th_gensokyo_amity_focus: "En (Bond)"
 belligerence_focus: "Ran (Discord)"

### Value tiers
 th_notorious_tier_clean: "Bond of En"
 th_notorious_tier_pariah: "Discord of Ran"
 th_notorious_tier_outcast: "Outcast of Gensokyo"

### Feast
 th_gensokyo_feast: "Hold a Feast"
 th_gensokyo_feast_desc: "Hold a grand feast in Gensokyo, entertaining yokai and sages alike to temper your discordant heart and return to the path of En."
 PERFORM_th_gensokyo_feast_ACTION: "Held a feast in Gensokyo"
 WE_PERFORM_th_gensokyo_feast_ACTION: "We held a feast in Gensokyo"
 OTHER_PERFORMS_th_gensokyo_feast_ACTION: "Held a feast in Gensokyo"
 ACTION_th_gensokyo_feast_PERFORMED_ON_US: "Held a feast in Gensokyo"
 TH_FEAST_AI_HIGH_NOTORIETY: "Discordant heart running high, in need of temperance"

### Crusade peace treaty
 th_gensokyo_crusade_triumph: "Total Victory (Crusade)"
 th_gensokyo_crusade_triumph_desc: "Total victory in a punitive crusade: the enemy surrenders unconditionally and accepts all verdicts of Gensokyo."
 TH_CRUSADE_INITIAL_SUPPORT: "Yama's initial support"
 TH_CRUSADE_AI_FOUND_TARGET: "A target with sufficient antagonism exists"

### Crusade
 th_gensokyo_crusade_cb: "Punitive Crusade"
 th_gensokyo_crusade_cb_desc: "A crusade declared by the Yama and the Sage Council against those who threaten Gensokyo's order."
 th_gensokyo_crusade: "Crusade Situation"
 th_gensokyo_crusade_desc: "Gensokyo's encirclement against the crusade target."
 th_gensokyo_trial: "Trial Situation"
 th_gensokyo_trial_desc: "The Yama's final judgment upon the defeated crusade target."
 th_gensokyo_propose_crusade: "Propose Punitive Crusade"
 th_gensokyo_propose_crusade_desc: "The Yama proposes a punitive crusade against a member with excessive antagonism."
 PERFORM_th_gensokyo_propose_crusade_ACTION: "Proposed a punitive crusade"
 WE_PERFORM_th_gensokyo_propose_crusade_ACTION: "We proposed a punitive crusade"
 OTHER_PERFORMS_th_gensokyo_propose_crusade_ACTION: "Proposed a punitive crusade"
 ACTION_th_gensokyo_propose_crusade_PERFORMED_ON_US: "Proposed a punitive crusade"
 th_gensokyo_counter_expansion: "Counter-Expansion"
 th_gensokyo_counter_expansion_desc: "Having turned the tide of the crusade, you gain the right to expand within Gensokyo."
 PERFORM_th_gensokyo_counter_expansion_ACTION: "Launched a counter-expansion"
 WE_PERFORM_th_gensokyo_counter_expansion_ACTION: "We launched a counter-expansion"
 OTHER_PERFORMS_th_gensokyo_counter_expansion_ACTION: "Launched a counter-expansion"
 ACTION_th_gensokyo_counter_expansion_PERFORMED_ON_US: "Launched a counter-expansion"

### Judgment law
 th_gensokyo_judgment_law: "Judgment Law"
 th_gensokyo_judgment_law_desc: "The principles the Yama follows when passing judgment."
 th_judgment_mercy_policy: "Mercy"
 th_judgment_mercy_policy_desc: "Lenient judgment, shorter sentences, less turmoil."
 th_judgment_order_policy: "Order"
 th_judgment_order_policy_desc: "Judgment by the book, impartial."
 th_judgment_karma_policy: "Karma"
 th_judgment_karma_policy_desc: "Harsh judgment, longer sentences, as a warning to all."

### Regulated state
 th_gensokyo_regulated_state: "Regulated State of the Underworld"
 th_gensokyo_regulated_state_desc: "A subject sentenced by the Yama, stripped of all autonomy, released as independent when the sentence ends."

### Initial special subjects (permanent, cannot be annexed)
 th_gensokyo_satori_vassal: "Satori Vassal"
 th_gensokyo_satori_vassal_desc: "Nominally the territory of Satori, in truth it is run by her pets on their own. The seas of fire and molten lava of the scorching hell are all managed single-handedly by her pets."
 th_gensokyo_forest_territory: "Forest Territory"
 th_gensokyo_forest_territory_desc: "The youkai lords of the Magic Forest keep a loose subordinate bond with the magician, rather than absolute submission."
 th_gensokyo_cloud_realm: "Cloud Realm"
 th_gensokyo_cloud_realm_desc: "A Dragon Palace system beyond Heaven's order, its rights of passage held by the Dragon Palace envoy Nagae Iku — even the lofty celestials must show respect before such a presence."

### Trial events
 th_gensokyo_trial_events.1.t: "The Final Judgment"
 th_gensokyo_trial_events.1.d: "The punitive crusade has ended. As the Yama, you must decide the fate of the target based on its sins."
 th_gensokyo_trial_events.1.a: "Light: Return unlawfully seized lands"
 th_gensokyo_trial_events.1.b: "Medium: Return lands and weaken their power"
 th_gensokyo_trial_events.1.c: "Utmost: Reduce them to a regulated state of the Underworld (transfer wealth and levy tribute)"

