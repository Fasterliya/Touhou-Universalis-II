### ============================================================
 th_gensokyo_trial_vote_events.1.title: "Verdict Preference Vote"
 th_gensokyo_trial_vote_events.1.desc: "The Yama is weighing the target's sins. You may voice your preference for the verdict 鈥?this vote only reflects opinion and does not affect the final ruling."
 th_gensokyo_trial_vote_events.1.a: "Lenient: exhort them toward good"
 th_gensokyo_trial_vote_events.1.b: "Moderate: judge by order"
 th_gensokyo_trial_vote_events.1.c: "Severe: karma reaped in full"
 th_gensokyo_trial_events.1.e: "Only reparations: transfer half the treasury and suffer the punishment of bankruptcy"
