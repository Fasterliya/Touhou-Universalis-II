 th_gensokyo_crusade_declare: "Declare Punitive Crusade"
 th_gensokyo_crusade_declare_desc: "The Yama or a sage selects a belligerent member and establishes the Tribunal — a temporary international organization against the target. Members join, then the Tribunal declares war on the target; the war situation begins once war is declared."
 PERFORM_th_gensokyo_crusade_declare_ACTION: "Established the Tribunal"
 WE_PERFORM_th_gensokyo_crusade_declare_ACTION: "We established the Tribunal"
