### Counter treaty
 th_gensokyo_crusade_counter: "Counter-Victory (Crusade)"
 th_gensokyo_crusade_counter_desc: "Turning the tide of the punitive crusade: you crushed Gensokyo's encirclement and earned the right to expand."

### Parliament issue
 th_gensokyo_crusade_issue: "Punitive Crusade Proposal"
 th_gensokyo_crusade_issue_desc: "A proposal by the Yama, voted on by the sages. Two votes in favor pass it."

