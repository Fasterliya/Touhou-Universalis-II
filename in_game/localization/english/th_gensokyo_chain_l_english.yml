### Join crusade
 th_gensokyo_join_crusade: "Join the Punitive Crusade"
 th_gensokyo_join_crusade_desc: "Join the encirclement against the crusade target to uphold Gensokyo's order."
 PERFORM_th_gensokyo_join_crusade_ACTION: "Joined the punitive crusade"
 WE_PERFORM_th_gensokyo_join_crusade_ACTION: "We joined the punitive crusade"
