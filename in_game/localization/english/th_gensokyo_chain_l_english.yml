### Events · proxy consent chain (namespace = th_gensokyo_tribunal_events)
 th_gensokyo_tribunal_events.1.title: "A Call to Lead"
 th_gensokyo_tribunal_events.1.desc: "The Court of Judgment has ruled that sanctions must be carried out by a secular hand. The Yama names you to lead: accept, and the sanctions against the accused rise by one tier and the observation period restarts; refuse, and the current tier stands while the Yama names another."
 th_gensokyo_tribunal_events.1.a: "Accept the lead"
 th_gensokyo_tribunal_events.1.b: "Refuse to lead"
 th_gensokyo_tribunal_events.2.title: "The Lead Was Refused"
 th_gensokyo_tribunal_events.2.desc: "The named country has refused to lead. The case keeps its current tier and the observation period is not reset. The Court of Judgment asks you to name another to lead."
 th_gensokyo_tribunal_events.2.a: "Understood"
 th_gensokyo_tribunal_events.3.title: "The Observation Period Has Expired"
 th_gensokyo_tribunal_events.3.desc: "The accused's observation period has expired with neither fulfillment nor repentance. The case may be escalated: the nearest strong power takes the lead, the sanctions rise one tier, and the observation period restarts."
 th_gensokyo_tribunal_events.3.a: "Understood"
 th_gensokyo_tribunal_events.4.title: "Final Judgment"
 th_gensokyo_tribunal_events.4.desc: "The debate is over, and the dossier is laid before Higan.\nThe sins of [th_verdict_accused.GetName] are established; the baseline under the law is tier #T[th_verdict_accused.MakeScope.GetVariable('th_gensokyo_sentence_baseline').GetValue]#!.\nYou may follow the law, follow the will of the member states, or rule alone — but every departure from that will, and every step beyond your discretion, is charged to Gensokyo's unity."
 th_gensokyo_tribunal_events.4.a.tt: "#T0. Reparations Bankruptcy#!\n$BULLET$Effect: half the accused's treasury is paid out and it goes bankrupt; the reparation enters the Gensokyo treasury\n$BULLET$Baseline under the law: tier #T[th_verdict_accused.MakeScope.GetVariable('th_gensokyo_sentence_baseline').GetValue]#!; discretion = one tier above or below it\n$BULLET$Against the will of the member states: each tier of deviation costs #R[th_verdict_accused.MakeScope.ScriptValue('th_verdict_deviation_unity_cost_value')|0]#! Gensokyo Unity\n$BULLET$Beyond your discretion: an additional #Requal#! amount of Unity is charged\n$BULLET$Aftermath: the verdict takes effect, the Tribunal is dissolved and the case enters its sentence"
 th_gensokyo_tribunal_events.4.b.tt: "#T1. Restitution#!\n$BULLET$Effect: the accused returns the land it took unlawfully\n$BULLET$Baseline under the law: tier #T[th_verdict_accused.MakeScope.GetVariable('th_gensokyo_sentence_baseline').GetValue]#!; discretion = one tier above or below it\n$BULLET$Against the will of the member states: each tier of deviation costs #R[th_verdict_accused.MakeScope.ScriptValue('th_verdict_deviation_unity_cost_value')|0]#! Gensokyo Unity\n$BULLET$Beyond your discretion: an additional #Requal#! amount of Unity is charged\n$BULLET$Aftermath: the verdict takes effect, the Tribunal is dissolved and the case enters its sentence"
 th_gensokyo_tribunal_events.4.c.tt: "#T2. Weakening#!\n$BULLET$Effect: the land is returned and the country is weakened for years\n$BULLET$Baseline under the law: tier #T[th_verdict_accused.MakeScope.GetVariable('th_gensokyo_sentence_baseline').GetValue]#!; discretion = one tier above or below it\n$BULLET$Against the will of the member states: each tier of deviation costs #R[th_verdict_accused.MakeScope.ScriptValue('th_verdict_deviation_unity_cost_value')|0]#! Gensokyo Unity\n$BULLET$Beyond your discretion: an additional #Requal#! amount of Unity is charged\n$BULLET$Aftermath: the verdict takes effect, the Tribunal is dissolved and the case enters its sentence"
 th_gensokyo_tribunal_events.4.d.tt: "#T3. The Regulated State#!\n$BULLET$Effect: the accused's treasury is emptied and it is reduced to a regulated state under Higan until its sentence is served\n$BULLET$Baseline under the law: tier #T[th_verdict_accused.MakeScope.GetVariable('th_gensokyo_sentence_baseline').GetValue]#!; discretion = one tier above or below it\n$BULLET$Against the will of the member states: each tier of deviation costs #R[th_verdict_accused.MakeScope.ScriptValue('th_verdict_deviation_unity_cost_value')|0]#! Gensokyo Unity\n$BULLET$Beyond your discretion: an additional #Requal#! amount of Unity is charged\n$BULLET$Aftermath: the verdict takes effect, the Tribunal is dissolved and the case enters its sentence"

### Marks and variables (required in the UI by the design)
 th_gensokyo_tarnish_mark: "Taint"
 th_gensokyo_tarnish_mark_desc: "The mark borne by a country indicted before the Tribunal.\n$BULLET$Every member of Gensokyo grows more antagonistic and less friendly toward it\n$BULLET$While its case is under review, the sages are no longer obliged to protect it\n$BULLET$Sanctions escalate tier by tier: from the second tier on, its vote in the Gensokyo parliament falls to zero\n$BULLET$Returning land, paying reparations, ending its wars or confessing lifts the mark"
 th_gensokyo_suspect_mark: "Suspicion"
 th_gensokyo_suspect_mark_desc: "The mark borne by a country that has crossed the line of belligerence.\n$BULLET$Its belligerent leaning has passed Gensokyo's line of tolerance\n$BULLET$It is now eligible for indictment by the Yama, though no case is open yet\n$BULLET$A country under sanction immunity is never marked as a suspect"
 th_gensokyo_observation_months: "Observation Period (months remaining)"
 th_gensokyo_tier_1_mark: "Condemnation"
 th_gensokyo_tier_1_mark_desc: "The first sanction tier.\n$BULLET$Every member of Gensokyo grows more antagonistic and less friendly toward it\n$BULLET$It is isolated diplomatically, but its military and finances are untouched\n$BULLET$Lifting the sanctions removes that antagonism and ill will together"
 th_gensokyo_tier_2_mark: "Disenfranchisement"
 th_gensokyo_tier_2_mark_desc: "The second sanction tier.\n$BULLET$Its vote in the Gensokyo parliament falls to zero\n$BULLET$Its contribution and influence no longer count toward Gensokyo\n$BULLET$Its voice is still heard in the Tribunal's votes of intent, but it no longer weighs"
 th_gensokyo_tier_3_mark: "Embargo"
 th_gensokyo_tier_3_mark_desc: "The third sanction tier.\n$BULLET$Every member of Gensokyo embargoes it, cutting off trade\n$BULLET$The embargo lasts until the sanctions are lifted\n$BULLET$From this tier on, the sanctions are no longer a matter of name alone"
 th_gensokyo_tier_4_mark: "Expansion Restraint"
 th_gensokyo_tier_4_mark_desc: "The fourth and final sanction tier.\n$BULLET$Its expansion within Gensokyo draws a far greater international backlash\n$BULLET$What it gains from expansion is unchanged; what it pays is heavier\n$BULLET$If it still does not repent, the Yama convenes the court and passes verdict"

