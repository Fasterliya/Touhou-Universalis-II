### === Introduce Institution Action ===
 th_sages_introduce_institution: "Introduce Institution"
 th_sages_introduce_institution_desc: "Petition the three sages to wield the power of the Great Barrier to introduce an advanced idea or technology that already exists among Gensokyo's nations but has not yet been embraced by this country."
 th_sages_introduce_institution_notification: "Introduce Institution"

 th_sages_propose_policy: "Propose Policy"
 th_sages_propose_policy_desc: "Propose a policy for the Sages' Council to debate. If at least two sages support it, the policy takes effect for the whole council. Costs 300 gold to convene."


