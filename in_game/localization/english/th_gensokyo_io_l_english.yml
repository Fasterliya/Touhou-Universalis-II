### ============================================================
### WP-G 2026-08-15: Hakurei Great Barrier core law (§7)
### ============================================================
 th_gensokyo_barrier_law: "Hakurei Great Barrier"
 th_gensokyo_barrier_law_desc: "The supreme barrier that separates Gensokyo from the outside world. It has five levels; the higher the level, the more stable and conservative it becomes. This law cannot be changed through debate or by its leader — only by great events."
 th_gensokyo_barrier_fantasy_policy: "Barrier · Fantasy (Level 5)"
 th_gensokyo_barrier_fantasy_policy_desc: "The barrier at its zenith, most conservative: great defense, firm order, slow change."
 th_gensokyo_barrier_profound_policy: "Barrier · Profound (Level 4)"
 th_gensokyo_barrier_profound_policy_desc: "A firm barrier: solid defense and order."
 th_gensokyo_barrier_flourish_policy: "Barrier · Flourish (Level 3)"
 th_gensokyo_barrier_flourish_policy_desc: "A steady barrier, the baseline."
 th_gensokyo_barrier_forgotten_policy: "Barrier · Forgotten (Level 2)"
 th_gensokyo_barrier_forgotten_policy_desc: "A waning barrier: defense and order begin to loosen."
 th_gensokyo_barrier_extinct_policy: "Barrier · Extinct (Level 1)"
 th_gensokyo_barrier_extinct_policy_desc: "The barrier teeters on collapse: order wavers and defense is gone."
 th_gensokyo_barrier_level: "Barrier Level"
 th_gensokyo_barrier_level_desc: "The current strength of the Hakurei Great Barrier (1-5). The higher the level, the more conservative and stable; only great events may change it."
 TH_GENSOKYO_BARRIER_LEVEL_FORMAT: "$VAL$"
 TH_GENSOKYO_BARRIER_BASE: "Barrier Maintenance"

