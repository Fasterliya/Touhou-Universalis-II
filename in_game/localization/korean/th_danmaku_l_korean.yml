l_korean:
### ============================================================
### 탄막전 시스템 로컬라이제이션 (한국어)
### ============================================================

### === 탄막 화력 수정 타입 ===
 MODIFIER_TYPE_NAME_th_danmaku_firepower_base_modifier: "탄막 화력치"
 MODIFIER_TYPE_NAME_th_danmaku_firepower_base_modifier_desc: "탄막 화력 수준의 가산 요소. 스펠 카드 규칙·스펠 카드 개혁 등 기술과 각종 사건·이변 수정에서 얻는다."
 MODIFIER_TYPE_NAME_th_danmaku_firepower_modifier: "탄막 화력치 수정"
 MODIFIER_TYPE_NAME_th_danmaku_firepower_modifier_desc: "탄막 화력 수준을 백분율로 증폭한다."

### === 결투 임시 수정 ===
 STATIC_MODIFIER_NAME_th_danmaku_champion_modifier: "탄막전 챔피언"
 STATIC_MODIFIER_DESC_th_danmaku_champion_modifier: "일대일 탄막전에서 실력을 증명했다. 월간 위신 +0.10, 탄막 화력치 +30."

### === 도전 행동 ===
 th_danmaku_challenge: "스펠 카드 도전"
 th_danmaku_challenge_desc: "환상향의 일원에게 일대일 탄막 결투를 신청한다. 승자는 위신과 명성을 얻고, 패자는 대가를 치른다."
 th_danmaku_challenge_none_available: "도전할 대상이 없습니다"
 PERFORM_th_danmaku_challenge_ACTION: "탄막 결투를 신청했다"
 WE_PERFORM_th_danmaku_challenge_ACTION: "우리는 탄막 결투를 신청했다"
 OTHER_PERFORMS_th_danmaku_challenge_ACTION: "탄막 결투를 신청했다"
 ACTION_th_danmaku_challenge_PERFORMED_ON_US: "탄막 결투를 신청받았다"

### ============================================================
### 조우전 사건
### ============================================================
 th_danmaku_events.1.title: "이름 없는 요괴와 조우"
 th_danmaku_events.1.desc: "환상향의 변경에서 이름 없는 요괴가 길을 막는다. 의도는 불분명하지만 이미 탄막 자세를 취하고 있다——조우전은 피할 수 없어 보인다."
 th_danmaku_events.1.a: "응전한다!"
 th_danmaku_events.1.a.tt: "우리 화력 #T [ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_firepower_value')]#!\n요괴 화력 #T [ROOT.GetCountry.MakeScope.GetVariable('th_danmaku_encounter_youkai_fp_var').GetValue]#!\n\n대승 확률：#G [ROOT.GetCountry.MakeScope.GetVariable('th_danmaku_great_v_prob_var').GetValue]#!%\n승리 확률：#G [ROOT.GetCountry.MakeScope.GetVariable('th_danmaku_victory_prob_var').GetValue]#!%\n무승부 확률：#G [ROOT.GetCountry.MakeScope.GetVariable('th_danmaku_draw_prob_var').GetValue]#!%\n패배 확률：#G [ROOT.GetCountry.MakeScope.GetVariable('th_danmaku_defeat_prob_var').GetValue]#!%\n대패 확률：#G [ROOT.GetCountry.MakeScope.GetVariable('th_danmaku_great_defeat_prob_var').GetValue]#!%"
 th_danmaku_events.1.b: "회피한다"
 th_danmaku_events.1.b.tt: "화를 피해 이름 없는 요괴와 얽히지 않는다.\n위신 #R [ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_cowardice_prestige_value')]#!"

 th_danmaku_events.2.title: "대승: 탄막이 압도"
 th_danmaku_events.2.desc: "탄막이 폭우처럼 쏟아져 요괴의 방어선이 순식간에 무너졌다. 요괴는 밤 속으로 도망쳐 다시는 감히 오지 않는다."
 th_danmaku_events.2.a: "흥, 분수 모르는 놈."
 th_danmaku_events.2.a.tt: "금 #G [ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_encounter_great_victory_gold_value')]#! 과 위신 #G [ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_encounter_great_victory_prestige_value')]#! 을 획득."
 th_danmaku_events.2.b: "조사 진행"
 th_danmaku_events.2.b.tt: "이변 조사 진행도 #G +[ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_encounter_great_victory_investigation_value')]#!"

 th_danmaku_events.3.title: "승리: 적 격퇴"
 th_danmaku_events.3.desc: "격렬한 탄막 교전 끝에 요괴는 서서히 밀려 산 속으로 퇴각했다. 당신은 조우전에서 승리했다."
 th_danmaku_events.3.a: "전리품을 챙긴다."
 th_danmaku_events.3.a.tt: "금 #G [ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_encounter_victory_gold_value')]#! 과 위신 #G [ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_encounter_victory_prestige_value')]#! 을 획득."
 th_danmaku_events.3.b: "조사 진행"
 th_danmaku_events.3.b.tt: "이변 조사 진행도 #G +[ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_encounter_victory_investigation_value')]#!"

 th_danmaku_events.4.title: "패배: 싸우며 퇴각"
 th_danmaku_events.4.desc: "요괴의 탄막은 예상외로 날카로웠고, 당신은 싸우면서 물러날 수밖에 없었다. 치명적이진 않지만 체면은 상했다."
 th_danmaku_events.4.a: "이 교훈을 기억한다."
 th_danmaku_events.4.a.tt: "금 #R [ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_encounter_defeat_gold_value')]#! 과 위신 #R [ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_encounter_defeat_prestige_value')]#! 을 잃는다."

 th_danmaku_events.5.title: "대패: 초라한 도주"
 th_danmaku_events.5.desc: "탄막이 완전히 무너져 당신은 초라하게 전장에서 도망쳤다. 이름 없는 요괴에게 이토록 강한 실력이 있을 줄은 예상 밖이었다."
 th_danmaku_events.5.a: "……기회는 또 온다."
 th_danmaku_events.5.a.tt: "금 #R [ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_encounter_great_defeat_gold_value')]#! 과 위신 #R [ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_encounter_great_defeat_prestige_value')]#! 을 잃는다."

 th_danmaku_events.6.title: "무승부: 호각"
 th_danmaku_events.6.desc: "마지막 탄막이 양쪽에서 동시에 사라졌다. 어느 쪽도 상대를 압도하지 못했다. 상대는 시무룩하게 물러나고, 당신도 무사히 돌아왔다."
 th_danmaku_events.6.a: "서로 잘 싸웠다."
 th_danmaku_events.6.a.tt: "금과 위신의 득실이 없다."

### ============================================================
### 결투 사건
### ============================================================
 th_danmaku_events.10.title: "탄막 결투"
 th_danmaku_events.10.desc: "[target.GetName]의 통치자가 맞은편에 서서 스펠 카드를 손에 쥐고 있다. 일대일 스펠 카드 결투——승패가 위신과 명성의 귀속을 결정한다."
 th_danmaku_events.10.a: "도전을 확인한다"
 th_danmaku_events.10.a.tt: "예의를 갖추어 공정하게 싸운다.\n우리 화력 #T [actor.MakeScope.ScriptValue('th_danmaku_firepower_value')]#!\n상대 화력 #T [target.MakeScope.ScriptValue('th_danmaku_firepower_value')]#!\n확인 후 상대에게 응전 초대가 전달된다."
 th_danmaku_events.10.b: "기죽어 물러난다"
 th_danmaku_events.10.b.tt: "응전할 의사가 없어 이 결투를 취소한다.\n위신 #R [actor.MakeScope.ScriptValue('th_danmaku_cowardice_prestige_value')]#!"

 th_danmaku_events.11.title: "탄막 결투 · 응전 확인"
 th_danmaku_events.11.desc: "[actor.GetName]의 통치자가 스펠 카드 도전을 보내왔다. 이 일대일 탄막 결투를 받아들이겠는가?"
 th_danmaku_events.11.a: "결투를 받아들인다"
 th_danmaku_events.11.a.tt: "예의를 갖추어 응전한다.\n우리 화력 #T [target.MakeScope.ScriptValue('th_danmaku_firepower_value')]#!\n상대 화력 #T [actor.MakeScope.ScriptValue('th_danmaku_firepower_value')]#!"
 th_danmaku_events.11.b: "항복한다"
 th_danmaku_events.11.b.tt: "상대가 안 된다고 인정하고 응전을 포기한다.\n위신 #R [target.MakeScope.ScriptValue('th_danmaku_cowardice_prestige_value')]#!\n도전자에게 결투 취소 통지가 전달된다."
 th_danmaku_events.12.title: "결투 취소"
 th_danmaku_events.12.desc: "이 탄막 결투는 시작되지 못하고 도전은 취소되었다."
 th_danmaku_events.12.a: "어쩔 수 없지."

 th_danmaku_events.20.title: "탄막 결투 · 제 [actor.MakeScope.GetVariable('th_danmaku_duel_round_var').GetValue] 라운드"
 th_danmaku_events.20.desc: "탄막이 교차하며 빛의 비가 내린다.\n우리 점수: #T [actor.MakeScope.GetVariable('th_danmaku_duel_player_score_var').GetValue]#!\n상대 점수: #T [actor.MakeScope.GetVariable('th_danmaku_duel_enemy_score_var').GetValue]#!\n지난 라운드: 우리 +[actor.MakeScope.GetVariable('th_danmaku_duel_last_player_gain_var').GetValue], 상대 +[actor.MakeScope.GetVariable('th_danmaku_duel_last_enemy_gain_var').GetValue]\n이번 라운드의 전술을 선택하라:"
 th_danmaku_events.20.a: "수세적 포진"
 th_danmaku_events.20.a.tt: "안정적이고 신중하게.\n명중률 #T [actor.MakeScope.ScriptValue('th_danmaku_tactic_1_hit_chance_value')]#!%\n명중 시 #G 6~10#!, 빗나감 시 #G 2~4#! (0이 되지 않음)"
 th_danmaku_events.20.b: "안정적 공세"
 th_danmaku_events.20.b.tt: "공수의 균형.\n명중률 #T [actor.MakeScope.ScriptValue('th_danmaku_tactic_2_hit_chance_value')]#!%\n명중 시 #G 8~14#!, 빗나감 시 #G 3~6#! (0이 되지 않음)"
 th_danmaku_events.20.c: "전력 탄막"
 th_danmaku_events.20.c.tt: "화력을 모두 쏟아 고득점을 노린다.\n명중률 #T [actor.MakeScope.ScriptValue('th_danmaku_tactic_3_hit_chance_value')]#!%\n명중 시 #G 10~20#!, 빗나감 시 #G 4~8#! (0이 되지 않음)"
 th_danmaku_events.20.d: "한 방 승부"
 th_danmaku_events.20.d.tt: "모든 것을 건 일격!\n명중률 #T [actor.MakeScope.ScriptValue('th_danmaku_tactic_4_hit_chance_value')]#!%\n명중 시 #G 12~26#!, 빗나감 시 #G 5~10#! (0이 되지 않음)"

 th_danmaku_events.21.title: "상대 턴"
 th_danmaku_events.21.desc: "상대가 다음 탄막을 준비하고 있다."
 th_danmaku_events.21.a: "계속"

 th_danmaku_events.22.title: "탄막 결투 · 결판"
 th_danmaku_events.22.desc: "마지막 탄막이 밤하늘에 사라진다.\n우리 점수: [actor.MakeScope.GetVariable('th_danmaku_duel_player_score_var').GetValue]\n상대 점수: [actor.MakeScope.GetVariable('th_danmaku_duel_enemy_score_var').GetValue]"
 th_danmaku_events.22.a: "대승"
 th_danmaku_events.22.a.tt: "압도적인 차이로 결투에서 이겼다.\n금 #G [actor.MakeScope.GetVariable('th_danmaku_duel_final_gold_var').GetValue]#! 과 위신 #G [actor.MakeScope.GetVariable('th_danmaku_duel_final_prestige_var').GetValue]#! 을 획득.\n연구 포인트 #G +[actor.MakeScope.ScriptValue('th_danmaku_duel_great_victory_research_value')]#!, 안정도 #G +[actor.MakeScope.ScriptValue('th_danmaku_duel_great_victory_stability_value')]#!.\n'탄막전 챔피언' 이득 획득 (탄막 화력치 +30, 월간 위신 +0.10, 1년간)"
 th_danmaku_events.22.b: "승리"
 th_danmaku_events.22.b.tt: "탄막 결투에서 승리했다.\n금 #G [actor.MakeScope.GetVariable('th_danmaku_duel_final_gold_var').GetValue]#! 과 위신 #G [actor.MakeScope.GetVariable('th_danmaku_duel_final_prestige_var').GetValue]#! 을 획득.\n연구 포인트 #G +[actor.MakeScope.ScriptValue('th_danmaku_duel_victory_research_value')]#!, 안정도 #G +[actor.MakeScope.ScriptValue('th_danmaku_duel_victory_stability_value')]#!.\n'탄막전 챔피언' 이득 획득 (탄막 화력치 +30, 월간 위신 +0.10, 1년간)"
 th_danmaku_events.22.c: "무승부"
 th_danmaku_events.22.c.tt: "양측이 호각을 이루어 결투는 무승부로 끝났다.\n연구 포인트 #G +[actor.MakeScope.ScriptValue('th_danmaku_duel_draw_research_value')]#!, 공헌도 #G +[actor.MakeScope.ScriptValue('th_danmaku_duel_draw_contribution_value')]#!"
 th_danmaku_events.22.d: "패배"
 th_danmaku_events.22.d.tt: "근소한 차이로 패배했다.\n금 #R [actor.MakeScope.GetVariable('th_danmaku_duel_final_gold_var').GetValue]#! 과 위신 #R [actor.MakeScope.GetVariable('th_danmaku_duel_final_prestige_var').GetValue]#! 을 잃는다.\n연구 포인트 #G +[actor.MakeScope.ScriptValue('th_danmaku_duel_defeat_research_value')]#!"
 th_danmaku_events.22.e: "참담한 초토화"
 th_danmaku_events.22.e.tt: "참패하여 체면을 완전히 잃었다.\n금 #R [actor.MakeScope.GetVariable('th_danmaku_duel_final_gold_var').GetValue]#! 과 위신 #R [actor.MakeScope.GetVariable('th_danmaku_duel_final_prestige_var').GetValue]#! 을 잃는다.\n연구 포인트 #G +[actor.MakeScope.ScriptValue('th_danmaku_duel_rout_research_value')]#!, 안정도 #R [actor.MakeScope.ScriptValue('th_danmaku_duel_rout_stability_value')]#!"
 th_danmaku_events.22.f: "……수습하자."
 th_danmaku_events.22.f.tt: "결투 상태가 비정상이어서 어물어물 끝났다."

 th_danmaku_events.23.title: "흐지부지된 결투"
 th_danmaku_events.23.desc: "상대가 끝내 나타나지 않아 탄막 결투는 흐지부지되었다."
 th_danmaku_events.23.a: "어쩔 수 없지."

### ============================================================
### 요괴의 난 / 요괴 퇴치
### ============================================================
 STATIC_MODIFIER_NAME_th_beast_rampage_modifier: "요괴의 난"
 STATIC_MODIFIER_DESC_th_beast_rampage_modifier: "광포한 요괴가 이 땅을 유린하고 있다. 세금(생산) 효율 #R -10%#!。「요괴 퇴치」행동으로 쫓아낼 수 있다."
 th_danmaku_subjugate_beast: "요괴 퇴치"
 th_danmaku_subjugate_beast_desc: "요괴의 난이 벌어진 곳으로 가서 탄막으로 승부를 가른다. 승리하면 요괴를 몰아내고 세금을 회복한다."
 th_danmaku_subjugate_beast_none_available: "영토에 요괴의 난이 벌어진 곳이 없습니다"
 PERFORM_th_danmaku_subjugate_beast_ACTION: "요괴 퇴치에 나섰다"
 WE_PERFORM_th_danmaku_subjugate_beast_ACTION: "우리는 요괴 퇴치에 나섰다"
 OTHER_PERFORMS_th_danmaku_subjugate_beast_ACTION: "요괴 퇴치에 나섰다"
 ACTION_th_danmaku_subjugate_beast_PERFORMED_ON_US: "요괴의 난 지역이 퇴치되었다"

 th_danmaku_events.30.title: "요괴와의 조우"
 th_danmaku_events.30.desc: "[SCOPE.sLocation('th_danmaku_beast_loc').GetName]에서 광포한 요괴가 들판을 짓밟고 백성을 두렵게 하고 있다. 요괴가 당신의 기척을 맡고 탄막 자세를 취했다——이기기만 하면 이 땅에 평화가 돌아온다."
 th_danmaku_events.30.a: "응전한다!"
 th_danmaku_events.30.a.tt: "우리 화력 #T [ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_firepower_value')]#!\n요괴 화력 #T [ROOT.GetCountry.MakeScope.GetVariable('th_danmaku_encounter_youkai_fp_var').GetValue]#!\n\n대승 확률：#G [ROOT.GetCountry.MakeScope.GetVariable('th_danmaku_great_v_prob_var').GetValue]#!%\n승리 확률：#G [ROOT.GetCountry.MakeScope.GetVariable('th_danmaku_victory_prob_var').GetValue]#!%\n무승부 확률：#G [ROOT.GetCountry.MakeScope.GetVariable('th_danmaku_draw_prob_var').GetValue]#!%\n패배 확률：#G [ROOT.GetCountry.MakeScope.GetVariable('th_danmaku_defeat_prob_var').GetValue]#!%\n대패 확률：#G [ROOT.GetCountry.MakeScope.GetVariable('th_danmaku_great_defeat_prob_var').GetValue]#!%"

 th_danmaku_events.31.title: "요괴 퇴치 · 대승"
 th_danmaku_events.31.desc: "탄막이 해일처럼 요괴를 삼키고, 요괴는 울부짖으며 빛의 알갱이로 흩어졌다. 난의 그늘이 일순간에 걷혔다."
 th_danmaku_events.31.a: "이 땅에 평화가 돌아왔다."
 th_danmaku_events.31.a.tt: "요괴의 난이 퇴치되었다. 금 #G [ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_beast_victory_gold_value')]#! 과 연구 포인트 #G [ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_beast_victory_research_value')]#! 을 획득."
 th_danmaku_events.32.title: "요괴 퇴치 · 승리"
 th_danmaku_events.32.desc: "긴 공방 끝에 요괴는 마침내 지쳐 흩어져 산 속으로 도망쳤다. 다시는 돌아오지 못할 것이다."
 th_danmaku_events.32.a: "수고했어."
 th_danmaku_events.32.a.tt: "요괴의 난이 퇴치되었다. 금 #G [ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_beast_victory_gold_value')]#! 과 연구 포인트 #G [ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_beast_victory_research_value')]#! 을 획득."
 th_danmaku_events.33.title: "요괴 퇴치 · 패배"
 th_danmaku_events.33.desc: "요괴의 탄막은 맹렬하여 전장에서 물러날 수밖에 없었다. 요괴는 여전히 이 땅을 유린 중이며, 다음 기회를 노려야 한다."
 th_danmaku_events.33.a: "다시 도전하겠다."
 th_danmaku_events.33.a.tt: "요괴는 여전히 날뛰고 있다. 금 #R [ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_encounter_defeat_gold_value')]#! 과 위신 #R [ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_encounter_defeat_prestige_value')]#! 을 잃는다."
 th_danmaku_events.34.title: "요괴 퇴치 · 대패"
 th_danmaku_events.34.desc: "탄막이 완전히 무너져 초라하게 후퇴했다. 뒤에서 요괴의 포효가 길게 울려 퍼지고, 이 땅의 재앙은 더욱 깊어졌다."
 th_danmaku_events.34.a: "……정비 후 다시 오겠다."
 th_danmaku_events.34.a.tt: "요괴는 여전히 날뛰고 있다. 금 #R [ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_encounter_great_defeat_gold_value')]#! 과 위신 #R [ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_encounter_great_defeat_prestige_value')]#! 을 잃는다."
 th_danmaku_events.40.title: "광란의 요괴"
 th_danmaku_events.40.desc: "최근 환상향에 요기가 들끓으며, 광란의 요괴가 국경 근처에 출몰한다는 소문이 돌고 있다. 방치하면 백성이 고통받고 세금도 줄어들 것이다."
 th_danmaku_events.40.a: "요괴가 나타나 그대로 날뛰게 둔다"
 th_danmaku_events.40.a.tt: "영토 내 무작위 지역에 '요괴의 난' 발생: 세금(생산) 효율 #R -10%#!, 기간 #T 10#! 년. '요괴 퇴치' 행동으로 쫓아낼 수 있다."
 th_danmaku_events.40.b: "헛걸음——요괴는 떠났다"
