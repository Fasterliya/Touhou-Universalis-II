 th_gensokyo_tribunal_events.1.b: "대표직을 거부한다"
 th_gensokyo_tribunal_events.2.title: "대표 지명 거부"
 th_gensokyo_tribunal_events.2.desc: "지명된 나라가 대표를 거부했습니다. 사건의 원래 단계는 유지되고 관찰기는 초기화되지 않습니다. 시비곡직청은 다른 나라를 지명해 주기를 청합니다."
 th_gensokyo_tribunal_events.2.a: "알겠습니다"
 th_gensokyo_tribunal_events.3.title: "관찰기 만료"
 th_gensokyo_tribunal_events.3.desc: "피고국의 관찰기가 끝났으나 이행도, 뉘우침도 없습니다. 사건을 한 단계 올릴 수 있습니다. 가장 가까운 강국이 대표를 맡고 제재가 한 단계 오르며, 관찰기가 다시 시작됩니다."
 th_gensokyo_tribunal_events.3.a: "알겠습니다"
 th_gensokyo_tribunal_events.4.title: "최종 판결"
 th_gensokyo_tribunal_events.4.desc: "변론이 끝나고 사건이 피안으로 올라왔습니다.\n[th_verdict_accused.GetName]의 죄과가 확정되었고, 법에 따른 기준은 #T[th_verdict_accused.MakeScope.GetVariable('th_gensokyo_sentence_baseline').GetValue]#!단계입니다.\n법을 따르거나 구성원의 뜻을 따르거나 독단할 수 있습니다. 다만 뜻을 벗어난 만큼, 재량을 넘은 만큼이 환상향 결속에 기록됩니다."
 th_gensokyo_tribunal_events.4.a.tt: "#T0. 배상금·파산#!\n$BULLET$결과: 피고국 국고의 절반이 징수되어 파산하고, 배상금은 환상향 국고로 들어갑니다\n$BULLET$법에 따른 기준: #T[th_verdict_accused.MakeScope.GetVariable('th_gensokyo_sentence_baseline').GetValue]#!단계, 재량 범위는 기준 위아래 한 단계입니다\n$BULLET$구성원의 뜻을 벗어난 경우: 한 단계마다 환상향 결속 #R[th_verdict_accused.MakeScope.ScriptValue('th_verdict_deviation_unity_cost_value')|0]#!이 차감됩니다\n$BULLET$재량을 넘은 경우: 같은 양의 결속이 #R추가로#! 차감됩니다\n$BULLET$마무리: 판결이 확정되고 심판정이 해산되며, 사건은 형기 단계로 넘어갑니다"
 th_gensokyo_tribunal_events.4.b.tt: "#T1. 반환#!\n$BULLET$결과: 피고국이 부당하게 얻은 영지를 반환합니다\n$BULLET$법에 따른 기준: #T[th_verdict_accused.MakeScope.GetVariable('th_gensokyo_sentence_baseline').GetValue]#!단계, 재량 범위는 기준 위아래 한 단계입니다\n$BULLET$구성원의 뜻을 벗어난 경우: 한 단계마다 환상향 결속 #R[th_verdict_accused.MakeScope.ScriptValue('th_verdict_deviation_unity_cost_value')|0]#!이 차감됩니다\n$BULLET$재량을 넘은 경우: 같은 양의 결속이 #R추가로#! 차감됩니다\n$BULLET$마무리: 판결이 확정되고 심판정이 해산되며, 사건은 형기 단계로 넘어갑니다"
 th_gensokyo_tribunal_events.4.c.tt: "#T2. 약화#!\n$BULLET$결과: 영지를 반환하고 수년간 국력이 약화됩니다\n$BULLET$법에 따른 기준: #T[th_verdict_accused.MakeScope.GetVariable('th_gensokyo_sentence_baseline').GetValue]#!단계, 재량 범위는 기준 위아래 한 단계입니다\n$BULLET$구성원의 뜻을 벗어난 경우: 한 단계마다 환상향 결속 #R[th_verdict_accused.MakeScope.ScriptValue('th_verdict_deviation_unity_cost_value')|0]#!이 차감됩니다\n$BULLET$재량을 넘은 경우: 같은 양의 결속이 #R추가로#! 차감됩니다\n$BULLET$마무리: 판결이 확정되고 심판정이 해산되며, 사건은 형기 단계로 넘어갑니다"
 th_gensokyo_tribunal_events.4.d.tt: "#T3. 감독국#!\n$BULLET$결과: 국고가 비워지고 피고국이 형기가 끝날 때까지 피안의 감독국으로 내려갑니다\n$BULLET$법에 따른 기준: #T[th_verdict_accused.MakeScope.GetVariable('th_gensokyo_sentence_baseline').GetValue]#!단계, 재량 범위는 기준 위아래 한 단계입니다\n$BULLET$구성원의 뜻을 벗어난 경우: 한 단계마다 환상향 결속 #R[th_verdict_accused.MakeScope.ScriptValue('th_verdict_deviation_unity_cost_value')|0]#!이 차감됩니다\n$BULLET$재량을 넘은 경우: 같은 양의 결속이 #R추가로#! 차감됩니다\n$BULLET$마무리: 판결이 확정되고 심판정이 해산되며, 사건은 형기 단계로 넘어갑니다"

### 표식과 변수 (설계상 UI 에 노출)
 th_gensokyo_tarnish_mark: "저주"
 th_gensokyo_tarnish_mark_desc: "심판정에 기소된 나라가 지니는 표식입니다.\n$BULLET$환상향의 모든 구성원이 더 적대하고 덜 호의적으로 대합니다\n$BULLET$심리가 진행되는 동안 현자들의 보호를 받지 못합니다\n$BULLET$제재는 단계마다 가중됩니다. 2단계부터 환상향 의회의 표결권이 0이 됩니다\n$BULLET$영지를 반환하거나 배상금을 지불하거나 전쟁을 멈추거나 자백하면 표식이 풀립니다"
 th_gensokyo_suspect_mark: "혐의"
 th_gensokyo_suspect_mark_desc: "호전성의 선을 넘은 나라가 지니는 표식입니다.\n$BULLET$호전 성향이 환상향의 용인선을 넘었습니다\n$BULLET$염마가 기소할 수 있는 대상이 되었으나, 아직 사건은 열리지 않았습니다\n$BULLET$제재 면제기에는 이 표식이 붙지 않습니다"
 th_gensokyo_observation_months: "관찰기 (남은 개월)"
 th_gensokyo_tier_1_mark: "규탄"
 th_gensokyo_tier_1_mark_desc: "제재 1단계.\n$BULLET$환상향의 모든 구성원이 더 적대하고 덜 호의적으로 대합니다\n$BULLET$외교적으로 고립되지만 군사와 재정에는 영향이 없습니다\n$BULLET$제재를 철회하면 그 적대감과 호감도도 함께 사라집니다"
 th_gensokyo_tier_2_mark: "의결권 박탈"
 th_gensokyo_tier_2_mark_desc: "제재 2단계.\n$BULLET$환상향 의회의 표결권이 0이 됩니다\n$BULLET$그 나라의 기여와 영향력이 환상향에 반영되지 않습니다\n$BULLET$심판정의 의향 표결에서 의견은 보이지만 무게는 없습니다"
 th_gensokyo_tier_3_mark: "통상 금지"
 th_gensokyo_tier_3_mark_desc: "제재 3단계.\n$BULLET$환상향의 모든 구성원이 통상 금지를 시행하여 교역이 끊깁니다\n$BULLET$통상 금지는 제재가 철회될 때까지 이어집니다\n$BULLET$이 단계부터 제재는 명예 문제가 아닙니다"
 th_gensokyo_tier_4_mark: "확장 억제"
 th_gensokyo_tier_4_mark_desc: "제재 4단계이자 마지막 단계.\n$BULLET$환상향에서의 확장이 훨씬 큰 국제적 반발을 부릅니다\n$BULLET$확장으로 얻는 것은 그대로이나 치르는 대가가 무거워집니다\n$BULLET$이 단계에서도 뉘우치지 않으면 염마가 개정하여 판결을 내립니다"

