### 이벤트 · 대리인 동의 연쇄 (namespace = th_gensokyo_tribunal_events)
 th_gensokyo_tribunal_events.1.title: "대표 지명 요청"
 th_gensokyo_tribunal_events.1.desc: "시비곡직청은 제재를 세속의 손으로 집행해야 한다고 판정했습니다. 염마가 그대를 대표로 지명합니다. 응하면 피고국에 대한 제재가 한 단계 오르고 관찰기가 다시 시작되며, 거부하면 원래 단계가 유지되고 염마가 다른 나라를 지명합니다."
