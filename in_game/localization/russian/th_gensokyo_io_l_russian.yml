### ============================================================
### Touhou-Universalis-II Russian Localization
### Автоматический перевод (машинный) — глоссарий согласован
### ============================================================

### Gensokyo International Organization — Localization

### === IO Name & Description ===
 th_gensokyo_io:"Генсокё"
 th_gensokyo_io_desc:"Международная организация, поддерживающая баланс государств Генсокё, в которой мудрецы и Яма совместно поддерживают порядок Великого барьера."

### === Special Statuses ===
 th_gensokyo_io_sages_special_status:"Мудрец"
 th_gensokyo_io_sages_special_status_desc:"Один из трёх древнейших мудрецов Генсокё, каждый из которых охраняет ключевой узел Великого барьера."
 th_gensokyo_io_yama_special_status:"Яма"
 th_gensokyo_io_yama_special_status_desc:"Судья, вершащий суд в Хигане, разрешающий тяжбы между государствами Генсокё и служащий главой Парламента Генсокё."
 th_gensokyo_io_guardian_special_status:"Хранительница Генсокё"
 th_gensokyo_io_guardian_special_status_desc:"Жрица святилища Хакурей, вечная хранительница Великого барьера. Сила Хакурей, передаваемая из поколения в поколение, поддерживает границу между Генсокё и Внешним миром."
 th_gensokyo_io_human_village_special_status:"Деревня людей"
 th_gensokyo_io_human_village_special_status_desc:"Представители Деревни людей, защищающие интересы человеческих поселений Генсокё."

### === Leader Title ===
 th_gensokyo_io_yama_leader_title:"Яма"
 th_gensokyo_io_yama_leader_title_desc:"Судья Генсокё и глава его парламента."

### === Parliament ===
 th_gensokyo_io_parliament:"Парламент Генсокё"
 th_gensokyo_parliament_seat:"Место в парламенте Генсокё"

### === IO Variable Names ===
 th_gensokyo_unity_var:"Единство Генсокё"
 th_gensokyo_unity_var_desc:"Показатель сплочённости наций Генсокё, получаемый за счёт урегулирования инцидентов, посредничества в конфликтах и мирного развития. Он истощается из-за агрессивной экспансии и внешних вторжений."

### === IO Variable Format ===
 TH_GENSOKYO_UNITY_FORMAT:"$VAL$"
 TH_SAGES_PRESTIGE_FORMAT:"$VAL$"

### === IO Variable Monthly Change Descriptions ===
 TH_GENSOKYO_UNITY_BASE:"Содержание базы"
 TH_GENSOKYO_UNITY_FROM_PEACE:"Внутренний мир"

### === Country Variable Names ===
 th_gensokyo_personal_contribution_var:"Личный вклад"
 th_gensokyo_personal_contribution_var_desc:"Осязаемый вклад этой нации в стабильность Генсокё, накапливаемый ежемесячно на основе налоговых поступлений и огневой мощи данмаку."
 th_gensokyo_personal_influence_var:"Личное влияние"
 th_gensokyo_personal_influence_var_desc:"Политическое влияние этой нации в парламенте Генсокё. Каждые 50 очков дают 1 дополнительный вес голоса в парламентских решениях. Сбрасывается до нуля в конце каждой эпохи."
 # Ценности (Добрососедство <-> Воинственность) перенесены в общественные ценности societal_value:th_gensokyo_amity_vs_belligerence; текст в th_gensokyo_chain_l_*.yml

### === Variable Hover Display ===
 th_gensokyo_member_vars_display:"Обзор личных переменных"
 th_gensokyo_member_vars_display_desc:"Просмотр личного влияния и личного вклада этой нации в Генсокё."

### === Parliament Issues ===
 th_gensokyo_parliament_resolution_1_title:"Резолюция о мире в Генсокё"
 th_gensokyo_parliament_resolution_1_desc:"Предложение о поддержании мирного порядка в Генсокё."
 th_gensokyo_parliament_resolution_2_title:"Резолюция о реагировании на инциденты"
 th_gensokyo_parliament_resolution_2_desc:"Предложение о координации реагирования на инциденты, происходящие в Генсокё."
 th_gensokyo_parliament_resolution_3_title:"Резолюция о внешней обороне"
 th_gensokyo_parliament_resolution_3_desc:"Предложение об укреплении обороны Генсокё против внешних вторжений."

### === Law: Unity Vision ===
 th_gensokyo_unity_vision_law:"Видение единства"
 th_gensokyo_unity_vision_law_desc:"Определяет направление, в котором развивается и применяется единство Генсокё."
 isolation_defense_policy:"Оборонительная изоляция"
 isolation_defense_policy_desc:"Плотно запечатать Великий барьер, укрепляя единство через внутренний мир. Внешним угрозам трудно проникнуть, но и новые идеи проникают медленно."
 balance_path_policy:"Путь равновесия"
 balance_path_policy_desc:"Сохранять Великий барьер таким, каким он был всегда, беспристрастным и устойчивым. Единство течёт естественно, и каждая нация находит своё место."
 open_inclusive_policy:"Открытая инклюзивность"
 open_inclusive_policy_desc:"Ослабить ограничения Великого барьера, чтобы приветствовать новые идеи извне. Распространение институтов ускоряется, а дипломатические горизонты расширяются, хотя единство немного страдает."

### === Law: Great Barrier Policy ===
 th_gensokyo_barrier_policy_law:"Политика Великого барьера"
 th_gensokyo_barrier_policy_law_desc:"Определяет интенсивность поддержания и степень открытости Великого барьера Генсокё."
 reinforced_barrier_policy:"Усиленный барьер"
 reinforced_barrier_policy_desc:"Вложить все силы Генсокё в укрепление Великого барьера. Оборона и людские ресурсы значительно усиливаются, но дипломатическая репутация страдает, а внешние идеи с трудом проникают внутрь."
 maintained_barrier_policy:"Поддерживаемый барьер"
 maintained_barrier_policy_desc:"Поддерживать Великий барьер согласно установленным традициям. Оборона остаётся стабильной, и всё идёт так, как должно."
 relaxed_barrier_policy:"Ослабленный барьер"
 relaxed_barrier_policy_desc:"Умеренно ослабить ограничения Великого барьера для облегчения обмена. Распространение институтов значительно ускоряется, но оборонительные возможности несколько снижаются."

### === Law: Incident Response Doctrine ===
 th_gensokyo_incident_response_law:"Доктрина реагирования на инциденты"
 th_gensokyo_incident_response_law_desc:"Определяет стратегию и кодекс поведения при реагировании на инциденты в Генсокё."
 duel_resolution_policy:"Правила дуэлей данмаку"
 duel_resolution_policy_desc:"Разрешать инциденты через дуэли данмаку один на один. Победители получают престиж, но те, кто не искусен в бою, с трудом могут защитить себя."
 joint_suppression_policy:"Совместное подавление"
 joint_suppression_policy_desc:"Государства действуют сообща, подавляя инциденты коллективной силой. Людских ресурсов в избытке, а реакция быстра."
 diplomatic_mediation_policy:"Дипломатическое посредничество"
 diplomatic_mediation_policy_desc:"Устранять коренные причины инцидентов путём переговоров и посредничества. Дипломатическая репутация растёт, но военная готовность относительно недостаточна."

### ============================================================

### Sages' Council — Localization

### ============================================================
 th_sages_council_io:"Совет мудрецов"
 th_sages_council_io_desc:"Высший совещательный орган, сформированный тремя древнейшими мудрецами Генсокё, поддерживающий равновесие Великого барьера и направляющий судьбу Генсокё."

### Sage Prestige
 th_sages_prestige_var:"Престиж мудрецов"
 th_sages_prestige_var_desc:"Престиж и влияние трёх мудрецов среди государств Генсокё (0-100). Он приобретается через единство Генсокё и поддержание мира и теряется из-за войн, внешних вторжений и незаконной экспансии. Более высокий престиж даёт Генсокё более сильные глобальные бонусы."

### Threshold Tiers
 th_sages_prestige_tier_20:"Престиж мудрецов · Пробуждение"
 th_sages_prestige_tier_20_desc:"Воля мудрецов начинает ощущаться государствами, даруя Генсокё слабое благословение."
 th_sages_prestige_tier_40:"Престиж мудрецов · Единение"
 th_sages_prestige_tier_40_desc:"Указы мудрецов становятся растущим консенсусом, даруя Генсокё умеренное благословение."
 th_sages_prestige_tier_60:"Престиж мудрецов · Власть"
 th_sages_prestige_tier_60_desc:"Суждения мудрецов внушают благоговение среди государств, даруя Генсокё заметное благословение."
 th_sages_prestige_tier_80:"Престиж мудрецов · Почитание"
 th_sages_prestige_tier_80_desc:"Воля мудрецов непоколебима, как сам Великий барьер, даруя Генсокё могущественное благословение."
 th_sages_prestige_tier_100:"Престиж мудрецов · Легенда"
 th_sages_prestige_tier_100_desc:"Имена трёх мудрецов стали легендой, и все живые существа обращают взоры к их свету, даруя Генсокё высшее благословение."
 TH_SAGES_ACTIVE_TIERS_LABEL:"Активные бонусы престижа мудрецов"
 TH_SAGES_NO_ACTIVE_TIER:"Престижа мудрецов недостаточно; в данный момент бонусы не активны."
 TH_SAGES_MAX_PREVIEW_LABEL:"Просмотр максимальных значений"
 TH_SAGES_TIER_100_MODIFIERS_PREVIEW:"Глобальный налог +15%  Ежемесячная легитимность +0.20\nУлучшение отношений +35%  Ежемесячный престиж +0.30\nГлобальные людские ресурсы +15%  Дипломатическая репутация +2\nЕжемесячная стабильность +0.05"

### === Introduce Institution Action ===
 th_sages_introduce_institution:"Внедрить институт"
 th_sages_introduce_institution_desc:"Обратиться к трём мудрецам, чтобы они применили силу Великого барьера и внедрили передовую идею или технологию, которая уже существует в государствах Генсокё, но ещё не принята в этой стране."
 th_sages_introduce_institution_notification:"Внедрить институт"

 th_sages_propose_policy:"Предложить политику"
 th_sages_propose_policy_desc:"Предложить политику для обсуждения Советом мудрецов. Если её поддержат хотя бы двое мудрецов, политика вступит в силу для всего совета. Созыв стоит 300 золота."


### Static Modifiers (Sage Prestige Tiers)
 STATIC_MODIFIER_NAME_th_sages_tier_20_modifier:"Пробуждение мудрецов"
 STATIC_MODIFIER_DESC_th_sages_tier_20_modifier:"Воля мудрецов впервые даёт о себе знать. Эффективность налогов +3%, ежемесячный престиж +0.05."

 STATIC_MODIFIER_NAME_th_sages_tier_40_modifier:"Единение мудрецов"
 STATIC_MODIFIER_DESC_th_sages_tier_40_modifier:"Совет мудрецов становится консенсусом. Эффективность налогов +5%, ежемесячный престиж +0.08, улучшение отношений +15%, дипломатическая репутация +1."

 STATIC_MODIFIER_NAME_th_sages_tier_60_modifier:"Власть мудрецов"
 STATIC_MODIFIER_DESC_th_sages_tier_60_modifier:"Суждения мудрецов внушают благоговение. Эффективность налогов +8%, ежемесячный престиж +0.10, улучшение отношений +20%, людские ресурсы +5%."

 STATIC_MODIFIER_NAME_th_sages_tier_80_modifier:"Почитание мудрецов"
 STATIC_MODIFIER_DESC_th_sages_tier_80_modifier:"Воля мудрецов стоит непоколебимо. Эффективность налогов +10%, ежемесячный престиж +0.20, улучшение отношений +25%, людские ресурсы +10%, дипломатическая репутация +1, инвестиции в стабильность +10%."

 STATIC_MODIFIER_NAME_th_sages_tier_100_modifier:"Легенда мудрецов"
 STATIC_MODIFIER_DESC_th_sages_tier_100_modifier:"Три мудреца стали легендой. Эффективность налогов +15%, ежемесячный престиж +0.30, улучшение отношений +35%, людские ресурсы +15%, дипломатическая репутация +2, глобальная оборона +10%. Мудрецы могут вмешиваться в войны и принуждать к миру."

### === Политики Совета мудрецов ===
 STATIC_MODIFIER_NAME_th_sages_barrier_policy_modifier:"Укрепление Великого барьера"
 STATIC_MODIFIER_NAME_th_sages_barrier_policy_modifier_desc:"Оборона +10%, стоимость стабильности -5%."
 STATIC_MODIFIER_NAME_th_sages_unity_policy_modifier:"Хартия единства Генсокё"
 STATIC_MODIFIER_NAME_th_sages_unity_policy_modifier_desc:"Престиж +0.1/мес, улучшение отношений +15%, дипломатическая репутация +1."
 STATIC_MODIFIER_NAME_th_sages_reform_policy_modifier:"Реформа Совета мудрецов"
 STATIC_MODIFIER_NAME_th_sages_reform_policy_modifier_desc:"Налоговый доход +10%, людские резервы +10%."

### === Values Consequence Auto-Modifiers ===
 th_gensokyo_io_notorious_tier1_auto_modifier:"Ростки смуты"
 th_gensokyo_io_notorious_tier1_auto_modifier_desc:"Когда смута только пускает корни, Генсокё смотрит на эту нацию с настороженностью. Дипломатическая репутация -1, улучшение отношений -15%."

 th_gensokyo_io_notorious_tier2_auto_modifier:"Открытая смута"
 th_gensokyo_io_notorious_tier2_auto_modifier_desc:"Смута очевидна, и эта нация подозревается в неоднократных злодеяниях. Дипломатическая репутация -2, улучшение отношений -30%, инвестиции в стабильность +10%."

 th_gensokyo_io_notorious_tier3_auto_modifier:"Изгой раздора"
 th_gensokyo_io_notorious_tier3_auto_modifier_desc:"Смута вышла из-под контроля, и эта нация отвергается обществом Генсокё. Дипломатическая репутация -4, улучшение отношений -50%."

 th_gensokyo_io_notorious_tier4_auto_modifier:"Отмеченный для суда"
 th_gensokyo_io_notorious_tier4_auto_modifier_desc:"Смута непростительна, и Яма и мудрецы могут объявить карательную войну без дальнейших совещаний. Дипломатическая репутация -6, улучшение отношений -75%."

### === Tab Labels ===
 TH_SAGES_TAB_OVERVIEW:"Обзор"
 TH_SAGES_TAB_DEBATE:"Дебаты"
 TH_SAGES_ACTIONS_LABEL:"Действия международной организации"
 TH_SAGES_MAIN_ACTIONS:"Действия Совета мудрецов"
