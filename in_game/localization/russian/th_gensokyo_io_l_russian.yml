### WP-D 2026-08-15: Запрос экспансии в Генсокё (§3.1)
### ============================================================
 th_gensokyo_request_expansion:"Запросить экспансию в Генсокё"
 th_gensokyo_request_expansion_desc:"Попросите у мудреца разрешение на экспансию: сначала выберите мудреца, затем участок, соседствующий с вашей территорией. Деревня людей и земли самого мудреца защищены и не могут быть востребованы; при согласии вы получите повод к войне, при отказе — умиротворение хаотичного сердца."
