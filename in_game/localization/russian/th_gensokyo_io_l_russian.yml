 th_gensokyo_bankruptcy_modifier:"Наказание банкротством"
 th_gensokyo_bankruptcy_modifier_desc:"Репарации, наложенные Ямой, опустошили казну и повергли экономику в хаос."
 th_gensokyo_sanction_immunity:"Иммунитет от санкций"
 th_gensokyo_sanction_immunity_desc:"Эта страна одержала верх в карательной войне; государства Генсокё не могут санкционировать её 20 лет."
