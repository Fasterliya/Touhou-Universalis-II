### WP-G 2026-08-15: Великий барьер Хакурей — базовый закон (§7)
### ============================================================
 th_gensokyo_barrier_law:"Великий барьер Хакурей"
 th_gensokyo_barrier_law_desc:"Верховный барьер, отделяющий Генсокё от внешнего мира. У него пять уровней; чем выше уровень, тем консервативнее и устойчивее барьер. Этот закон нельзя изменить дебатами или волей лидера — только великими событиями."
 th_gensokyo_barrier_fantasy_policy:"Барьер · Фантазия (уровень 5)"
 th_gensokyo_barrier_fantasy_policy_desc:"Барьер в расцвете, самый консервативный: большая оборона, твёрдый порядок, медленные перемены."
 th_gensokyo_barrier_profound_policy:"Барьер · Глубина (уровень 4)"
 th_gensokyo_barrier_profound_policy_desc:"Крепкий барьер: надёжная оборона и порядок."
 th_gensokyo_barrier_flourish_policy:"Барьер · Расцвет (уровень 3)"
 th_gensokyo_barrier_flourish_policy_desc:"Устойчивый барьер, базовый уровень."
 th_gensokyo_barrier_forgotten_policy:"Барьер · Забвение (уровень 2)"
 th_gensokyo_barrier_forgotten_policy_desc:"Слабеющий барьер: оборона и порядок начинают расшатываться."
 th_gensokyo_barrier_extinct_policy:"Барьер · Истребление (уровень 1)"
 th_gensokyo_barrier_extinct_policy_desc:"Барьер на грани крушения: порядок колеблется, оборона исчезла."
 th_gensokyo_barrier_level:"Уровень барьера"
 th_gensokyo_barrier_level_desc:"Текущая сила Великого барьера Хакурей (1-5). Чем выше уровень, тем консервативнее и устойчивее; изменить его могут только великие события."
 TH_GENSOKYO_BARRIER_LEVEL_FORMAT:"$VAL$"
