 th_gensokyo_expansion_request_events.2.desc:"Мудрец одобрил ваш запрос. Вы получили повод к войне за целевой участок: уступка провинций стоит +75% военных очков, получаемая враждебность снижена на 40%."
 th_gensokyo_expansion_request_events.2.a:"Понятно"
