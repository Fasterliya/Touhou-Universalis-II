### Values (En <-> Ran, societal value bar)
 th_gensokyo_amity_vs_belligerence:"协薪 懈 袪邪薪"
 th_gensokyo_amity_vs_belligerence_desc:"协薪 鈥?褍蟹褘, 褋胁褟蟹褍褞褖懈械 胁褋褢 卸懈胁芯械: 褋械褉写褑邪 胁 褋芯谐谢邪褋懈懈, 袛械褉械胁薪褟 谢褞写械泄 锌芯写 蟹邪褖懈褌芯泄, 锌芯泻芯泄 袙械谢懈泻芯谐芯 袘邪褉褜械褉邪. 袪邪薪 鈥?褋屑褍褌邪 懈 褉邪蟹写芯褉: 斜械褋泻芯薪械褔薪褘械 胁芯泄薪褘, 锌芯谐芯薪褟 蟹邪 锌褉懈蟹褉邪褔薪褘屑懈 屑械褔褌邪屑懈, 薪邪褉褍褕械薪懈械 锌芯褉褟写泻邪 袚械薪褋芯泻褢. 袧邪泻谢芯薪 褋械褉写褑邪 胁懈写械薪 胁褋械屑."
 th_gensokyo_amity_focus:"协薪 (校蟹褘)"
 belligerence_focus:"袪邪薪 (小屑褍褌邪)"

### Value tiers
 th_notorious_tier_clean:"校蟹褘 协薪"
 th_notorious_tier_pariah:"小屑褍褌邪 袪邪薪"
