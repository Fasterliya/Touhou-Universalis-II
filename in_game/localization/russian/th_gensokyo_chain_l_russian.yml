### Values (En <-> Ran, societal value bar)
 th_gensokyo_amity_vs_belligerence:"Эн и Ран"
 th_gensokyo_amity_vs_belligerence_desc:"Эн — узы, связующие всё живое: сердца в согласии, Деревня людей под защитой, покой Великого Барьера. Ран — смута и раздор: бесконечные войны, погоня за призрачными мечтами, нарушение порядка Генсокё. Наклон сердца виден всем."
 th_gensokyo_amity_focus:"Эн (Узы)"
 belligerence_focus:"Ран (Смута)"

### Value tiers
 th_notorious_tier_clean:"Узы Эн"
 th_notorious_tier_pariah:"Смута Ран"
 th_notorious_tier_outcast:"Изгой Генсокё"

### Feast
 th_gensokyo_feast:"Устроить пир"
 th_gensokyo_feast_desc:"Устройте грандиозный пир в Генсокё, развлекая и ёкаев, и мудрецов, чтобы смягчить своё мятежное сердце и вернуться на путь Эн."
 PERFORM_th_gensokyo_feast_ACTION:"Устроен пир в Генсокё"
 WE_PERFORM_th_gensokyo_feast_ACTION:"Мы устроили пир в Генсокё"
 OTHER_PERFORMS_th_gensokyo_feast_ACTION:"Устроен пир в Генсокё"
 ACTION_th_gensokyo_feast_PERFORMED_ON_US:"Устроен пир в Генсокё"
 TH_FEAST_AI_HIGH_NOTORIETY:"Мятежное сердце на подъёме, нуждается в смягчении"

### Crusade peace treaty
 th_gensokyo_crusade_triumph:"Полная победа (крестовый поход)"
 th_gensokyo_crusade_triumph_desc:"Полная победа в карательном походе: враг безоговорочно сдаётся и принимает все приговоры Генсокё."
 TH_CRUSADE_INITIAL_SUPPORT:"Изначальная поддержка Ямы"
 TH_CRUSADE_AI_FOUND_TARGET:"Существует цель с достаточной враждебностью"

### Crusade
 th_gensokyo_crusade_cb:"Карательный поход"
 th_gensokyo_crusade_cb_desc:"Карательный поход, объявленный Ямой и Советом мудрецов против тех, кто угрожает порядку Генсокё."
 th_gensokyo_crusade:"Ситуация с походом"
 th_gensokyo_crusade_desc:"Окружение цели похода силами Генсокё."
 th_gensokyo_trial:"Ситуация с судом"
 th_gensokyo_trial_desc:"Окончательный приговор Ямы в отношении поверженной цели похода."
 th_gensokyo_propose_crusade:"Предложить карательный поход"
 th_gensokyo_propose_crusade_desc:"Яма предлагает карательный поход против члена с чрезмерной враждебностью."
 PERFORM_th_gensokyo_propose_crusade_ACTION:"Предложен карательный поход"
 WE_PERFORM_th_gensokyo_propose_crusade_ACTION:"Мы предложили карательный поход"
 OTHER_PERFORMS_th_gensokyo_propose_crusade_ACTION:"Предложен карательный поход"
 ACTION_th_gensokyo_propose_crusade_PERFORMED_ON_US:"Предложен карательный поход"
 th_gensokyo_counter_expansion:"Встречная экспансия"
 th_gensokyo_counter_expansion_desc:"Переломив ход похода, вы получаете право на экспансию в Генсокё."
 PERFORM_th_gensokyo_counter_expansion_ACTION:"Начата встречная экспансия"
 WE_PERFORM_th_gensokyo_counter_expansion_ACTION:"Мы начали встречную экспансию"
 OTHER_PERFORMS_th_gensokyo_counter_expansion_ACTION:"Начата встречная экспансия"
 ACTION_th_gensokyo_counter_expansion_PERFORMED_ON_US:"Начата встречная экспансия"

### Judgment law
 th_gensokyo_judgment_law:"Закон суда"
 th_gensokyo_judgment_law_desc:"Принципы, которым следует Яма при вынесении приговора."
 th_judgment_mercy_policy:"Милосердие"
 th_judgment_mercy_policy_desc:"Мягкий приговор, более короткие сроки, меньше потрясений."
 th_judgment_order_policy:"Порядок"
 th_judgment_order_policy_desc:"Суд по закону, беспристрастный."
 th_judgment_karma_policy:"Карма"
 th_judgment_karma_policy_desc:"Суровый приговор, более длительные сроки, как предупреждение для всех."

### Regulated state
 th_gensokyo_regulated_state:"Поднадзорное государство Подземного мира"
 th_gensokyo_regulated_state_desc:"Субъект, приговорённый Ямой, лишённый всякой автономии, вновь обретает независимость по окончании срока."

### Initial special subjects (permanent, cannot be annexed)
 th_gensokyo_satori_vassal:"Вассал Сатори"
 th_gensokyo_satori_vassal_desc:"Номинально это владения Сатори, но на деле всем заправляют её питомцы. Моря огня и лава Раскалённого ада — всё это дело рук её питомцев."
 th_gensokyo_forest_territory:"Лесная территория"
 th_gensokyo_forest_territory_desc:"Ёкаи-лорды Магического леса связаны с магами свободными вассальными узами, а не абсолютным подчинением."
 th_gensokyo_cloud_realm:"Облачный удел"
 th_gensokyo_cloud_realm_desc:"Система Драконьего дворца вне порядка Небес: правом прохода ведает посланница Драконьего дворца Нагаэ Ику — даже высокомерные небожители вынуждены уступать ей."

### Trial events
 th_gensokyo_trial_events.1.t:"Финальный приговор"
 th_gensokyo_trial_events.1.d:"Карательный поход завершён. Как Яма, вы должны решить судьбу цели на основе её грехов."
 th_gensokyo_trial_events.1.a:"Лёгкое: Вернуть незаконно захваченные земли"
 th_gensokyo_trial_events.1.b:"Среднее: Вернуть земли и ослабить их власть"
 th_gensokyo_trial_events.1.c:"Максимальное: Привести их в Поднадзорное государство Подземного мира (передать богатства и взимать дань)"

