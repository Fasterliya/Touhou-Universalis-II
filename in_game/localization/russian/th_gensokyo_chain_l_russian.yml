### Feast
 th_gensokyo_feast:"校褋褌褉芯懈褌褜 锌懈褉"
 th_gensokyo_feast_desc:"校褋褌褉芯泄褌械 谐褉邪薪写懈芯蟹薪褘泄 锌懈褉 胁 袚械薪褋芯泻褢, 褉邪蟹胁谢械泻邪褟 懈 褢泻邪械胁, 懈 屑褍写褉械褑芯胁, 褔褌芯斜褘 褋屑褟谐褔懈褌褜 褋胁芯褢 屑褟褌械卸薪芯械 褋械褉写褑械 懈 胁械褉薪褍褌褜褋褟 薪邪 锌褍褌褜 协薪."
 PERFORM_th_gensokyo_feast_ACTION:"校褋褌褉芯械薪 锌懈褉 胁 袚械薪褋芯泻褢"
 WE_PERFORM_th_gensokyo_feast_ACTION:"袦褘 褍褋褌褉芯懈谢懈 锌懈褉 胁 袚械薪褋芯泻褢"
 OTHER_PERFORMS_th_gensokyo_feast_ACTION:"校褋褌褉芯械薪 锌懈褉 胁 袚械薪褋芯泻褢"
 ACTION_th_gensokyo_feast_PERFORMED_ON_US:"校褋褌褉芯械薪 锌懈褉 胁 袚械薪褋芯泻褢"
 TH_FEAST_AI_HIGH_NOTORIETY:"袦褟褌械卸薪芯械 褋械褉写褑械 薪邪 锌芯写褗褢屑械, 薪褍卸写邪械褌褋褟 胁 褋屑褟谐褔械薪懈懈"

### Crusade peace treaty
 th_gensokyo_crusade_triumph:"袩芯谢薪邪褟 锌芯斜械写邪 (泻褉械褋褌芯胁褘泄 锌芯褏芯写)"
 th_gensokyo_crusade_triumph_desc:"袩芯谢薪邪褟 锌芯斜械写邪 胁 泻邪褉邪褌械谢褜薪芯屑 锌芯褏芯写械: 胁褉邪谐 斜械蟹芯谐芯胁芯褉芯褔薪芯 褋写邪褢褌褋褟 懈 锌褉懈薪懈屑邪械褌 胁褋械 锌褉懈谐芯胁芯褉褘 袚械薪褋芯泻褢."
 TH_CRUSADE_INITIAL_SUPPORT:"袠蟹薪邪褔邪谢褜薪邪褟 锌芯写写械褉卸泻邪 携屑褘"
 TH_CRUSADE_AI_FOUND_TARGET:"小褍褖械褋褌胁褍械褌 褑械谢褜 褋 写芯褋褌邪褌芯褔薪芯泄 胁褉邪卸写械斜薪芯褋褌褜褞"

### Crusade
 th_gensokyo_crusade_cb:"袣邪褉邪褌械谢褜薪褘泄 锌芯褏芯写"
 th_gensokyo_crusade_cb_desc:"袣邪褉邪褌械谢褜薪褘泄 锌芯褏芯写, 芯斜褗褟胁谢械薪薪褘泄 携屑芯泄 懈 小芯胁械褌芯屑 屑褍写褉械褑芯胁 锌褉芯褌懈胁 褌械褏, 泻褌芯 褍谐褉芯卸邪械褌 锌芯褉褟写泻褍 袚械薪褋芯泻褢."
 th_gensokyo_crusade:"小懈褌褍邪褑懈褟 褋 锌芯褏芯写芯屑"
 th_gensokyo_crusade_desc:"袨泻褉褍卸械薪懈械 褑械谢懈 锌芯褏芯写邪 褋懈谢邪屑懈 袚械薪褋芯泻褢."
 th_gensokyo_trial:"小懈褌褍邪褑懈褟 褋 褋褍写芯屑"
 th_gensokyo_trial_desc:"袨泻芯薪褔邪褌械谢褜薪褘泄 锌褉懈谐芯胁芯褉 携屑褘 胁 芯褌薪芯褕械薪懈懈 锌芯胁械褉卸械薪薪芯泄 褑械谢懈 锌芯褏芯写邪."
 th_gensokyo_propose_crusade:"袩褉械写谢芯卸懈褌褜 泻邪褉邪褌械谢褜薪褘泄 锌芯褏芯写"
 th_gensokyo_propose_crusade_desc:"携屑邪 锌褉械写谢邪谐邪械褌 泻邪褉邪褌械谢褜薪褘泄 锌芯褏芯写 锌褉芯褌懈胁 褔谢械薪邪 褋 褔褉械蟹屑械褉薪芯泄 胁褉邪卸写械斜薪芯褋褌褜褞."
 PERFORM_th_gensokyo_propose_crusade_ACTION:"袩褉械写谢芯卸械薪 泻邪褉邪褌械谢褜薪褘泄 锌芯褏芯写"
 WE_PERFORM_th_gensokyo_propose_crusade_ACTION:"袦褘 锌褉械写谢芯卸懈谢懈 泻邪褉邪褌械谢褜薪褘泄 锌芯褏芯写"
 OTHER_PERFORMS_th_gensokyo_propose_crusade_ACTION:"袩褉械写谢芯卸械薪 泻邪褉邪褌械谢褜薪褘泄 锌芯褏芯写"
 ACTION_th_gensokyo_propose_crusade_PERFORMED_ON_US:"袩褉械写谢芯卸械薪 泻邪褉邪褌械谢褜薪褘泄 锌芯褏芯写"
 th_gensokyo_counter_expansion:"袙褋褌褉械褔薪邪褟 褝泻褋锌邪薪褋懈褟"
 th_gensokyo_counter_expansion_desc:"袩械褉械谢芯屑懈胁 褏芯写 锌芯褏芯写邪, 胁褘 锌芯谢褍褔邪械褌械 锌褉邪胁芯 薪邪 褝泻褋锌邪薪褋懈褞 胁 袚械薪褋芯泻褢."
 PERFORM_th_gensokyo_counter_expansion_ACTION:"袧邪褔邪褌邪 胁褋褌褉械褔薪邪褟 褝泻褋锌邪薪褋懈褟"
 WE_PERFORM_th_gensokyo_counter_expansion_ACTION:"袦褘 薪邪褔邪谢懈 胁褋褌褉械褔薪褍褞 褝泻褋锌邪薪褋懈褞"
 OTHER_PERFORMS_th_gensokyo_counter_expansion_ACTION:"袧邪褔邪褌邪 胁褋褌褉械褔薪邪褟 褝泻褋锌邪薪褋懈褟"
 ACTION_th_gensokyo_counter_expansion_PERFORMED_ON_US:"袧邪褔邪褌邪 胁褋褌褉械褔薪邪褟 褝泻褋锌邪薪褋懈褟"

### Judgment law
 th_gensokyo_judgment_law:"袟邪泻芯薪 褋褍写邪"
 th_gensokyo_judgment_law_desc:"袩褉懈薪褑懈锌褘, 泻芯褌芯褉褘屑 褋谢械写褍械褌 携屑邪 锌褉懈 胁褘薪械褋械薪懈懈 锌褉懈谐芯胁芯褉邪."
 th_judgment_mercy_policy:"袦懈谢芯褋械褉写懈械"
 th_judgment_mercy_policy_desc:"袦褟谐泻懈泄 锌褉懈谐芯胁芯褉, 斜芯谢械械 泻芯褉芯褌泻懈械 褋褉芯泻懈, 屑械薪褜褕械 锌芯褌褉褟褋械薪懈泄."
 th_judgment_order_policy:"袩芯褉褟写芯泻"
 th_judgment_order_policy_desc:"小褍写 锌芯 蟹邪泻芯薪褍, 斜械褋锌褉懈褋褌褉邪褋褌薪褘泄."
 th_judgment_karma_policy:"袣邪褉屑邪"
 th_judgment_karma_policy_desc:"小褍褉芯胁褘泄 锌褉懈谐芯胁芯褉, 斜芯谢械械 写谢懈褌械谢褜薪褘械 褋褉芯泻懈, 泻邪泻 锌褉械写褍锌褉械卸写械薪懈械 写谢褟 胁褋械褏."

### Regulated state
 th_gensokyo_regulated_state:"袩芯写薪邪写蟹芯褉薪芯械 谐芯褋褍写邪褉褋褌胁芯 袩芯写蟹械屑薪芯谐芯 屑懈褉邪"
 th_gensokyo_regulated_state_desc:"小褍斜褗械泻褌, 锌褉懈谐芯胁芯褉褢薪薪褘泄 携屑芯泄, 谢懈褕褢薪薪褘泄 胁褋褟泻芯泄 邪胁褌芯薪芯屑懈懈, 胁薪芯胁褜 芯斜褉械褌邪械褌 薪械蟹邪胁懈褋懈屑芯褋褌褜 锌芯 芯泻芯薪褔邪薪懈懈 褋褉芯泻邪."

### Initial special subjects (permanent, cannot be annexed)
 th_gensokyo_satori_vassal:"袙邪褋褋邪谢 小邪褌芯褉懈"
 th_gensokyo_satori_vassal_desc:"袧芯屑懈薪邪谢褜薪芯 褝褌芯 胁谢邪写械薪懈褟 小邪褌芯褉懈, 薪芯 薪邪 写械谢械 胁褋械屑 蟹邪锌褉邪胁谢褟褞褌 械褢 锌懈褌芯屑褑褘. 袦芯褉褟 芯谐薪褟 懈 谢邪胁邪 袪邪褋泻邪谢褢薪薪芯谐芯 邪写邪 鈥?胁褋褢 褝褌芯 写械谢芯 褉褍泻 械褢 锌懈褌芯屑褑械胁."
 th_gensokyo_forest_territory:"袥械褋薪邪褟 褌械褉褉懈褌芯褉懈褟"
 th_gensokyo_forest_territory_desc:"衼泻邪懈-谢芯褉写褘 袦邪谐懈褔械褋泻芯谐芯 谢械褋邪 褋胁褟蟹邪薪褘 褋 屑邪谐邪屑懈 褋胁芯斜芯写薪褘屑懈 胁邪褋褋邪谢褜薪褘屑懈 褍蟹邪屑懈, 邪 薪械 邪斜褋芯谢褞褌薪褘屑 锌芯写褔懈薪械薪懈械屑."
 th_gensokyo_cloud_realm:"袨斜谢邪褔薪褘泄 褍写械谢"
 th_gensokyo_cloud_realm_desc:"小懈褋褌械屑邪 袛褉邪泻芯薪褜械谐芯 写胁芯褉褑邪 胁薪械 锌芯褉褟写泻邪 袧械斜械褋: 锌褉邪胁芯屑 锌褉芯褏芯写邪 胁械写邪械褌 锌芯褋谢邪薪薪懈褑邪 袛褉邪泻芯薪褜械谐芯 写胁芯褉褑邪 袧邪谐邪褝 袠泻褍 鈥?写邪卸械 胁褘褋芯泻芯屑械褉薪褘械 薪械斜芯卸懈褌械谢懈 胁褘薪褍卸写械薪褘 褍褋褌褍锌邪褌褜 械泄."

### 小懈褋褌械屑邪 蟹邪泻芯薪芯胁 袚械薪褋芯泻褢 (泻邪褌械谐芯褉懈懈)
 th_feudal_legalism_law:"肖械芯写邪谢褜薪褘泄 谢械谐懈蟹屑"
 th_legal_code_law:"小胁芯写 蟹邪泻芯薪芯胁"
 th_education_law:"袨斜褉邪蟹芯胁邪薪懈械"
 th_cultural_traditions_law:"袣褍谢褜褌褍褉薪褘械 褌褉邪写懈褑懈懈"
 th_administration_law:"袗写屑懈薪懈褋褌褉邪褑懈褟"
### 肖械芯写邪谢褜薪褘泄 谢械谐懈蟹屑
 th_old_charter:"小褌邪褉邪褟 褏邪褉褌懈褟"
 th_old_charter_desc:"袨斜褘褔邪懈 薪邪褋谢械写芯胁邪薪懈褟, 褍褋褌邪薪芯胁谢械薪薪褘械 锌褉懈 褋芯褌胁芯褉械薪懈懈 袙械谢懈泻芯谐芯 斜邪褉褜械褉邪, 锌械褉械写邪褞褌褋褟 懈蟹 锌芯泻芯谢械薪懈褟 胁 锌芯泻芯谢械薪懈械, 薪械 屑械薪褟褟褋褜 褋芯 胁褉械屑械薪械屑. 袨褋薪芯胁邪 锌褉邪胁邪 蟹邪写邪薪邪 鈥?锌芯褌芯屑泻邪屑 芯褋褌邪褢褌褋褟 谢懈褕褜 褏褉邪薪懈褌褜 械褢."
### 小胁芯写 蟹邪泻芯薪芯胁
 th_old_customary_law:"小褌邪褉芯械 芯斜褘褔薪芯械 锌褉邪胁芯"
 th_old_customary_law_desc:"袣邪卸写邪褟 谐褉褍锌锌邪 褢泻邪械胁 褋谢械写褍械褌 褋褌邪褉褘屑 芯斜褘褔邪褟屑 褋胁芯械泄 蟹械屑谢懈; 褍 泻邪卸写芯谐芯 泻谢邪薪邪 褋胁芯懈 薪褉邪胁褘, 谢懈褕褜 斜褘 薪械 薪邪褉褍褕邪谢懈褋褜 蟹邪胁械褌褘 锌褉械写泻芯胁."
 th_harmony_first_law:"袦懈褉 锌褉械胁褘褕械 胁褋械谐芯"
 th_harmony_first_law_desc:"袟邪泻芯薪褘 谢褞写褋泻芯泄 写械褉械胁薪懈 褑械薪褟褌 锌褉懈屑懈褉械薪懈械 胁褘褕械 褋褍褉芯胁褘褏 泻邪褉. 袩褉懈 褋锌芯褉械 褋谢芯胁芯 斜械褉褍褌 褍胁邪卸邪械屑褘械 褋褌邪褉械泄褕懈薪褘 懈 屑懈褉褟褌 褋褌芯褉芯薪褘."
 th_separate_laws:"袪邪蟹写械谢褜薪褘械 蟹邪泻芯薪褘 写谢褟 谢褞写械泄 懈 褢泻邪械胁"
 th_separate_laws_desc:"袥褞写懈 懈 褢泻邪懈 褋谢械写褍褞褌 褋胁芯懈屑 芯斜褘褔邪褟屑 懈 薪械 胁屑械褕懈胁邪褞褌褋褟 胁 写械谢邪 写褉褍谐 写褉褍谐邪. 袥褞写褋泻懈械 褉邪褋锌褉懈 褉械褕邪褞褌褋褟 蟹邪泻芯薪芯屑, 褢泻邪泄褋泻懈械 鈥?褋褌邪褉褘屑 芯斜褘褔邪械屑."
 th_statute_law:"袩懈褋邪薪褘泄 蟹邪泻芯薪 袚械薪褋芯泻褢"
 th_statute_law_desc:"小 褉邪褋锌褉芯褋褌褉邪薪械薪懈械屑 泻薪懈谐芯锌械褔邪褌邪薪懈褟 褉邪蟹褉芯蟹薪械薪薪褘械 芯斜褘褔邪懈 蟹械屑谢懈 褋胁芯写褟褌褋褟 胁 褟褋薪褘械 懈 褍锌芯褉褟写芯褔械薪薪褘械 泻芯写械泻褋褘."
### 袨斜褉邪蟹芯胁邪薪懈械
 th_farming_and_reading:"袟械屑谢械写械谢懈械 懈 谐褉邪屑芯褌邪"
 th_farming_and_reading_desc:"袥褞写褋泻懈械 写械褉械胁薪懈 蟹懈卸写褍褌褋褟 薪邪 蟹械屑谢械写械谢懈懈; 写械褌械泄 褍褔邪褌 谢懈褕褜 褏谢械斜芯锌邪褕械褋褌胁褍 懈 褋屑械薪械 胁褉械屑褢薪 谐芯写邪, 邪 薪械 泻薪懈谐邪屑."
 th_no_education:"袘械蟹 褍褔械薪懈褟"
 th_no_education_desc:"校 褢泻邪械胁 薪械褌 褕泻芯谢; 锌褉邪胁懈褌 谢懈褕褜 褋懈谢邪. 袧懈 芯斜褉邪蟹芯胁邪薪懈褟, 薪懈 锌懈褋褜屑邪 鈥?芯写薪芯 锌褉懈褉芯写薪芯械 褔褍褌褜褢."
 th_old_learning_only:"孝芯谢褜泻芯 褋褌邪褉芯械 褍褔械薪懈械"
 th_old_learning_only_desc:"校褔械薪懈械 锌褉懈蟹薪邪褢褌 谢懈褕褜 写褉械胁薪懈械 泻薪懈谐懈 懈 芯褌胁械褉谐邪械褌 褔褍卸懈械 懈 薪芯胁褘械 写芯泻褌褉懈薪褘. 袧芯胁褘械 蟹薪邪薪懈褟 懈蟹胁薪械 薪械 锌褉懈薪懈屑邪褞褌褋褟."
 th_publications:"袚邪蟹械褌褘 懈 卸褍褉薪邪谢褘"
 th_publications_desc:"小 褉邪蟹胁懈褌懈械屑 锌械褔邪褌懈 褉邪褋锌褉芯褋褌褉邪薪褟褞褌褋褟 谢懈褋褌芯胁泻懈 懈 谐邪蟹械褌褘; 褋谢褍褏懈 懈 褋泻邪蟹邪薪懈褟 锌械褔邪褌邪褞褌褋褟, 懈 薪邪褉芯写 褍蟹薪邪褢褌 芯 写械谢邪褏 胁 褋褌褉邪薪械 懈 蟹邪 械褢 锌褉械写械谢邪屑懈."
 th_terakoya_system:"楔泻芯谢褘-褌褝褉邪泻芯褟"
 th_terakoya_system_desc:"袩芯 胁褋械泄 蟹械屑谢械 胁芯蟹薪懈泻邪褞褌 薪邪褋褌芯褟褖懈械 褔邪褋褌薪褘械 褕泻芯谢褘 胁 褋褌懈谢械 褌褝褉邪泻芯褟. 袚褉邪屑芯褌邪 锌械褉械褋褌邪褢褌 斜褘褌褜 锌褉懈胁懈谢械谐懈械泄 薪械屑薪芯谐懈褏."
 th_farming_and_education:"袟械屑谢械写械谢懈械 懈 褍褔械薪懈械 胁屑械褋褌械"
 th_farming_and_education_desc:"校褔械薪懈械 懈 褏谢械斜芯锌邪褕械褋褌胁芯 懈写褍褌 褉褍泻邪 芯斜 褉褍泻褍: 写械褌懈 褍褔邪褌褋褟 胁 褕泻芯谢械 懈 褉邪斜芯褌邪褞褌 胁 锌芯谢械 鈥?薪懈 褌芯, 薪懈 写褉褍谐芯械 薪械 胁 褍褖械褉斜."
### 袣褍谢褜褌褍褉薪褘械 褌褉邪写懈褑懈懈
 th_hundred_youkai_banquet:"袩懈褉 褋褌邪 褢泻邪械胁"
 th_hundred_youkai_banquet_desc:"衼泻邪懈 褋褏芯写褟褌褋褟 蟹邪 芯写薪懈屑 褋褌芯谢芯屑, 芯斜屑械薪懈胁邪褟褋褜 褔邪褉芯写械泄褋泻懈屑懈 写褍褝谢褟屑懈 懈 褔邪褉邪屑懈, 懈 褏褉邪薪褟褌 褋褌邪褉褘械 褍蟹褘 袚械薪褋芯泻褢."
 th_word_of_mouth:"袠蟹 褍褋褌 胁 褍褋褌邪"
 th_word_of_mouth_desc:"小谢褍褏懈 懈 谢械谐械薪写褘 锌械褉械写邪褞褌褋褟 懈蟹 褍褋褌 胁 褍褋褌邪 懈 蟹邪锌懈褋褘胁邪褞褌褋褟 胁 芦啸褉芯薪懈泻褍 袚械薪褋芯泻褢禄. 小谢褘褕邪 芯 屑懈褉械 蟹邪 锌褉械写械谢邪屑懈 写械褉械胁薪懈, 谢褞写懈 锌芯蟹薪邪褞褌 褋褌褉邪褏, 懈 褋褌邪褉懈薪邪 卸懈胁褢褌."
### 袗写屑懈薪懈褋褌褉邪褑懈褟
 th_personal_rule:"袥懈褔薪芯械 锌褉邪胁谢械薪懈械"
 th_personal_rule_desc:"袗写屑懈薪懈褋褌褉邪褑懈褟, 蟹懈卸写褍褖邪褟褋褟 薪邪 谢懈褔薪芯泄 屑芯褖懈 懈 邪胁褌芯褉懈褌械褌械 胁芯卸写褟, 薪芯 泻褉邪泄薪械 芯谐褉邪薪懈褔械薪薪邪褟 胁 褝褎褎械泻褌懈胁薪芯褋褌懈 芯斜褋褌芯褟褌械谢褜褋褌胁邪屑懈."
 th_youkai_autonomy:"袗胁褌芯薪芯屑懈褟 褢泻邪械胁"
 th_youkai_autonomy_desc:"衼泻邪懈 锌褉邪胁褟褌 褋胁芯懈屑懈 蟹械屑谢褟屑懈 褋邪屑懈; 胁褋械 写械谢邪 胁 锌褉械写械谢邪褏 褉械褕邪褞褌 褢泻邪懈 褝褌懈褏 胁谢邪写械薪懈泄."
 th_clan_society:"袪芯写芯胁芯械 芯斜褖械褋褌胁芯"
 th_clan_society_desc:"袥褞写褋泻懈械 写械褉械胁薪懈 褍锌褉邪胁谢褟褞褌褋褟 褉芯写邪屑懈, 泻邪卸写褘泄 写械褉卸懈褌褋褟 褋胁芯懈褏 锌褉邪胁懈谢. 袪芯写芯胁褘械 褉邪褋锌褉懈 懈 胁芯褋锌懈褌邪薪懈械 褉械褕邪褞褌褋褟 胁薪褍褌褉懈; 褔褍卸邪泻邪屑 胁褏芯写 胁芯褋锌褉械褖褢薪."

### Trial events
 th_gensokyo_trial_events.1.title:"肖懈薪邪谢褜薪褘泄 锌褉懈谐芯胁芯褉"
 th_gensokyo_trial_events.1.desc:"袣邪褉邪褌械谢褜薪褘泄 锌芯褏芯写 蟹邪胁械褉褕褢薪. 袣邪泻 携屑邪, 胁褘 写芯谢卸薪褘 褉械褕懈褌褜 褋褍写褜斜褍 褑械谢懈 薪邪 芯褋薪芯胁械 械褢 谐褉械褏芯胁."
 th_gensokyo_trial_events.1.a:"袥褢谐泻芯械: 袙械褉薪褍褌褜 薪械蟹邪泻芯薪薪芯 蟹邪褏胁邪褔械薪薪褘械 蟹械屑谢懈"
 th_gensokyo_trial_events.1.b:"小褉械写薪械械: 袙械褉薪褍褌褜 蟹械屑谢懈 懈 芯褋谢邪斜懈褌褜 懈褏 胁谢邪褋褌褜"
 th_gensokyo_trial_events.1.c:"袦邪泻褋懈屑邪谢褜薪芯械: 袩褉懈胁械褋褌懈 懈褏 胁 袩芯写薪邪写蟹芯褉薪芯械 谐芯褋褍写邪褉褋褌胁芯 袩芯写蟹械屑薪芯谐芯 屑懈褉邪 (锌械褉械写邪褌褜 斜芯谐邪褌褋褌胁邪 懈 胁蟹懈屑邪褌褜 写邪薪褜)"

