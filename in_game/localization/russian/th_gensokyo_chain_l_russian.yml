### Initial special subjects (permanent, cannot be annexed)
 th_gensokyo_satori_vassal:"Вассал Сатори"
 th_gensokyo_satori_vassal_desc:"Номинально это владения Сатори, но на деле всем заправляют её питомцы. Моря огня и лава Раскалённого ада — всё это дело рук её питомцев."
 th_gensokyo_forest_territory:"Лесная территория"
 th_gensokyo_forest_territory_desc:"Ёкаи-лорды Магического леса связаны с магами свободными вассальными узами, а не абсолютным подчинением."
 th_gensokyo_cloud_realm:"Облачный удел"
 th_gensokyo_cloud_realm_desc:"Система Драконьего дворца вне порядка Небес: правом прохода ведает посланница Драконьего дворца Нагаэ Ику — даже высокомерные небожители вынуждены уступать ей."

### Система законов Генсокё (категории)
 th_feudal_legalism_law:"Феодальный легизм"
 th_legal_code_law:"Свод законов"
 th_education_law:"Образование"
 th_cultural_traditions_law:"Культурные традиции"
 th_administration_law:"Администрация"
### Феодальный легизм
 th_old_charter:"Старая хартия"
 th_old_charter_desc:"Обычаи наследования, установленные при сотворении Великого барьера, передаются из поколения в поколение, не меняясь со временем. Основа права задана — потомкам остаётся лишь хранить её."
### Свод законов
 th_old_customary_law:"Старое обычное право"
 th_old_customary_law_desc:"Каждая группа ёкаев следует старым обычаям своей земли; у каждого клана свои нравы, лишь бы не нарушались заветы предков."
 th_harmony_first_law:"Мир превыше всего"
 th_harmony_first_law_desc:"Законы людской деревни ценят примирение выше суровых кар. При споре слово берут уважаемые старейшины и мирят стороны."
 th_separate_laws:"Раздельные законы для людей и ёкаев"
 th_separate_laws_desc:"Люди и ёкаи следуют своим обычаям и не вмешиваются в дела друг друга. Людские распри решаются законом, ёкайские — старым обычаем."
 th_statute_law:"Писаный закон Генсокё"
 th_statute_law_desc:"С распространением книгопечатания разрозненные обычаи земли сводятся в ясные и упорядоченные кодексы."
### Образование
 th_farming_and_reading:"Земледелие и грамота"
 th_farming_and_reading_desc:"Людские деревни зиждутся на земледелии; детей учат лишь хлебопашеству и смене времён года, а не книгам."
 th_no_education:"Без учения"
 th_no_education_desc:"У ёкаев нет школ; правит лишь сила. Ни образования, ни письма — одно природное чутьё."
 th_old_learning_only:"Только старое учение"
 th_old_learning_only_desc:"Учение признаёт лишь древние книги и отвергает чужие и новые доктрины. Новые знания извне не принимаются."
 th_publications:"Газеты и журналы"
 th_publications_desc:"С развитием печати распространяются листовки и газеты; слухи и сказания печатаются, и народ узнаёт о делах в стране и за её пределами."
 th_terakoya_system:"Школы-тэракоя"
 th_terakoya_system_desc:"По всей земле возникают настоящие частные школы в стиле тэракоя. Грамота перестаёт быть привилегией немногих."
 th_farming_and_education:"Земледелие и учение вместе"
 th_farming_and_education_desc:"Учение и хлебопашество идут рука об руку: дети учатся в школе и работают в поле — ни то, ни другое не в ущерб."
### Культурные традиции
 th_hundred_youkai_banquet:"Пир ста ёкаев"
 th_hundred_youkai_banquet_desc:"Ёкаи сходятся за одним столом, обмениваясь чародейскими дуэлями и чарами, и хранят старые узы Генсокё."
 th_word_of_mouth:"Из уст в уста"
 th_word_of_mouth_desc:"Слухи и легенды передаются из уст в уста и записываются в «Хронику Генсокё». Слыша о мире за пределами деревни, люди познают страх, и старина живёт."
### Администрация
 th_personal_rule:"Личное правление"
 th_personal_rule_desc:"Администрация, зиждущаяся на личной мощи и авторитете вождя, но крайне ограниченная в эффективности обстоятельствами."
 th_youkai_autonomy:"Автономия ёкаев"
 th_youkai_autonomy_desc:"Ёкаи правят своими землями сами; все дела в пределах решают ёкаи этих владений."
 th_clan_society:"Родовое общество"
 th_clan_society_desc:"Людские деревни управляются родами, каждый держится своих правил. Родовые распри и воспитание решаются внутри; чужакам вход воспрещён."

