### Judgment law
 th_gensokyo_judgment_law:"Закон суда"
 th_gensokyo_judgment_law_desc:"Принципы, которым следует Яма при вынесении приговора."
 th_judgment_mercy_policy:"Милосердие"
 th_judgment_mercy_policy_desc:"Мягкий приговор, более короткие сроки, меньше потрясений."
 th_judgment_order_policy:"Порядок"
 th_judgment_order_policy_desc:"Суд по закону, беспристрастный."
 th_judgment_karma_policy:"Карма"
 th_judgment_karma_policy_desc:"Суровый приговор, более длительные сроки, как предупреждение для всех."

### Regulated state
 th_gensokyo_regulated_state:"Поднадзорное государство Подземного мира"
 th_gensokyo_regulated_state_desc:"Субъект, приговорённый Ямой, лишённый всякой автономии, вновь обретает независимость по окончании срока."
