### События · цепочка согласия посредника (namespace = th_gensokyo_tribunal_events)
 th_gensokyo_tribunal_events.1.title:"Предложение возглавить"
 th_gensokyo_tribunal_events.1.desc:"Суд Ямы постановил, что санкции должны проводить в жизнь мирские руки. Яма называет главой вас: если вы согласитесь, санкции против обвиняемого поднимутся на одну ступень, а срок наблюдения начнётся заново; при отказе ступень сохранится, и Яма назовёт другого."
 th_gensokyo_tribunal_events.1.a:"Принять главенство"
 th_gensokyo_tribunal_events.1.b:"Отказаться возглавить"
 th_gensokyo_tribunal_events.2.title:"В главенстве отказано"
 th_gensokyo_tribunal_events.2.desc:"Названная страна отказалась возглавить. Дело сохраняет текущую ступень, срок наблюдения не сбрасывается. Суд Ямы просит вас назвать другого главу."
 th_gensokyo_tribunal_events.2.a:"Понятно"
 th_gensokyo_tribunal_events.3.title:"Срок наблюдения истёк"
 th_gensokyo_tribunal_events.3.desc:"Срок наблюдения за обвиняемым истёк: ни исполнения, ни раскаяния. Дело можно поднять на ступень: ближайшая сильная держава возглавит, санкции вырастут на одну ступень, а срок наблюдения начнётся заново."
 th_gensokyo_tribunal_events.3.a:"Понятно"
 th_gensokyo_tribunal_events.4.title:"Последний приговор"
 th_gensokyo_tribunal_events.4.desc:"Прения окончены, дело представлено Хигану.\nВиновность [th_verdict_accused.GetName] установлена; основание по закону — ступень #T[th_verdict_accused.MakeScope.GetVariable('th_gensokyo_sentence_baseline').GetValue]#!.\nМожно следовать закону, воле членов или решать единолично — но каждое отклонение от этой воли и каждый шаг за пределы усмотрения записывается в единство Генсокё."
 th_gensokyo_tribunal_events.4.a.tt:"#T0. Репарации и банкротство#!\n$BULLET$Итог: половина казны обвиняемого изымается, он становится банкротом, а репарации идут в казну Генсокё\n$BULLET$Основание по закону: ступень #T[th_verdict_accused.MakeScope.GetVariable('th_gensokyo_sentence_baseline').GetValue]#!; усмотрение = одна ступень вверх или вниз\n$BULLET$Против воли членов: каждая ступень отклонения — #R[th_verdict_accused.MakeScope.ScriptValue('th_verdict_deviation_unity_cost_value')|0]#! к единству Генсокё\n$BULLET$За пределами усмотрения: дополнительно #Rстолько же#! единства\n$BULLET$Итог дела: приговор вступает в силу, Трибунал распускается, дело переходит к отбыванию"
 th_gensokyo_tribunal_events.4.b.tt:"#T1. Возврат#!\n$BULLET$Итог: обвиняемый возвращает незаконно занятые земли\n$BULLET$Основание по закону: ступень #T[th_verdict_accused.MakeScope.GetVariable('th_gensokyo_sentence_baseline').GetValue]#!; усмотрение = одна ступень вверх или вниз\n$BULLET$Против воли членов: каждая ступень отклонения — #R[th_verdict_accused.MakeScope.ScriptValue('th_verdict_deviation_unity_cost_value')|0]#! к единству Генсокё\n$BULLET$За пределами усмотрения: дополнительно #Rстолько же#! единства\n$BULLET$Итог дела: приговор вступает в силу, Трибунал распускается, дело переходит к отбыванию"
 th_gensokyo_tribunal_events.4.c.tt:"#T2. Ослабление#!\n$BULLET$Итог: земли возвращаются, а страна ослабляется на несколько лет\n$BULLET$Основание по закону: ступень #T[th_verdict_accused.MakeScope.GetVariable('th_gensokyo_sentence_baseline').GetValue]#!; усмотрение = одна ступень вверх или вниз\n$BULLET$Против воли членов: каждая ступень отклонения — #R[th_verdict_accused.MakeScope.ScriptValue('th_verdict_deviation_unity_cost_value')|0]#! к единству Генсокё\n$BULLET$За пределами усмотрения: дополнительно #Rстолько же#! единства\n$BULLET$Итог дела: приговор вступает в силу, Трибунал распускается, дело переходит к отбыванию"
 th_gensokyo_tribunal_events.4.d.tt:"#T3. Поднадзорное государство#!\n$BULLET$Итог: казна обнуляется, страна переходит под надзор Хигана до конца срока\n$BULLET$Основание по закону: ступень #T[th_verdict_accused.MakeScope.GetVariable('th_gensokyo_sentence_baseline').GetValue]#!; усмотрение = одна ступень вверх или вниз\n$BULLET$Против воли членов: каждая ступень отклонения — #R[th_verdict_accused.MakeScope.ScriptValue('th_verdict_deviation_unity_cost_value')|0]#! к единству Генсокё\n$BULLET$За пределами усмотрения: дополнительно #Rстолько же#! единства\n$BULLET$Итог дела: приговор вступает в силу, Трибунал распускается, дело переходит к отбыванию"

### Метки и переменные (по решению должны быть в интерфейсе)
 th_gensokyo_tarnish_mark:"Скверна"
 th_gensokyo_tarnish_mark_desc:"Метка, которую несёт страна, против которой Трибунал возбудил дело.\n$BULLET$Все члены Генсокё питают к ней больше враждебности и меньше расположения\n$BULLET$Пока её дело рассматривается, мудрецы больше не обязаны её защищать\n$BULLET$Санкции растут ступень за ступенью: со второй ступени её голос в парламенте Генсокё обнуляется\n$BULLET$Возврат земель, выплата репараций, прекращение войн или признание вины снимают метку"
 th_gensokyo_suspect_mark:"Подозрение"
 th_gensokyo_suspect_mark_desc:"Метка, которую несёт страна, перешедшая черту воинственности.\n$BULLET$Её воинственный настрой перешёл черту терпимости Генсокё\n$BULLET$Она подлежит обвинению Ямой, хотя дело ещё не возбуждено\n$BULLET$Страна под иммунитетом от санкций не получает эту метку"
 th_gensokyo_observation_months:"Срок наблюдения (осталось месяцев)"
 th_gensokyo_tier_1_mark:"Осуждение"
 th_gensokyo_tier_1_mark_desc:"Первая ступень санкций.\n$BULLET$Все члены Генсокё питают к ней больше враждебности и меньше расположения\n$BULLET$Она в дипломатической изоляции, но её армия и казна не затронуты\n$BULLET$При снятии санкций враждебность и расположение снимаются вместе"
 th_gensokyo_tier_2_mark:"Лишение голоса"
 th_gensokyo_tier_2_mark_desc:"Вторая ступень санкций.\n$BULLET$Её голос в парламенте Генсокё обнуляется\n$BULLET$Её вклад и влияние больше не учитываются в Генсокё\n$BULLET$В голосованиях о намерении при Трибунале её мнение видно, но ничего не весит"
 th_gensokyo_tier_3_mark:"Эмбарго"
 th_gensokyo_tier_3_mark_desc:"Третья ступень санкций.\n$BULLET$Все члены Генсокё вводят против неё эмбарго, торговля прерывается\n$BULLET$Эмбарго держится до снятия санкций\n$BULLET$С этой ступени санкции перестают быть вопросом одной лишь репутации"
