l_japanese:
### ============================================================
### 弾幕戦システム ローカライズ（日本語）
### ============================================================

### === 弾幕火力 修正タイプ ===
 MODIFIER_TYPE_NAME_th_danmaku_firepower_base_modifier: "弾幕火力値"
 MODIFIER_TYPE_NAME_th_danmaku_firepower_base_modifier_desc: "弾幕火力水準の加算要素。スペルカード規則・スペルカード改革などの技術、および各種イベント・異変修正から得られる。"
 MODIFIER_TYPE_NAME_th_danmaku_firepower_modifier: "弾幕火力値修正"
 MODIFIER_TYPE_NAME_th_danmaku_firepower_modifier_desc: "弾幕火力水準をパーセントで増幅する。"

### === 決闘の一時修正 ===
 th_danmaku_champion_modifier: "弾幕戦チャンピオン"
 th_danmaku_champion_modifier_desc: "一対一の弾幕戦で実力を証明した。毎月の威信 +0.10、弾幕火力値 +3。"
 th_danmaku_provoke_buff_modifier: "挑発の炎"
 th_danmaku_provoke_buff_modifier_desc: "挑発の姿勢で決闘に勝ち、勢いに乗っている。毎月の威信 +0.10、弾幕火力値 +5、陸軍士気 +5%。"
 th_danmaku_provoke_penalty_modifier: "挑発の恥"
 th_danmaku_provoke_penalty_modifier_desc: "挑発して敗北し、面目を失った。毎月の威信 -0.10、外交評価 -1、毎月の戦争疲弊 +0.05。"

### === 挑戦アクション ===
 th_danmaku_challenge: "スペルカード挑戦"
 th_danmaku_challenge_desc: "幻想郷のメンバーに一対一の弾幕決闘を申し込む。勝者は威信と名声を得て、敗者は代償を払う。"
 th_danmaku_challenge_none_available: "挑戦できる対象がいない"
 PERFORM_th_danmaku_challenge_ACTION: "弾幕決闘を申し込んだ"
 WE_PERFORM_th_danmaku_challenge_ACTION: "私たちは弾幕決闘を申し込んだ"
 OTHER_PERFORMS_th_danmaku_challenge_ACTION: "弾幕決闘を申し込んだ"
 ACTION_th_danmaku_challenge_PERFORMED_ON_US: "弾幕決闘を申し込まれた"

### ============================================================
### 遭遇戦イベント
### ============================================================
 th_danmaku_events.1.title: "無名の妖怪と遭遇"
 th_danmaku_events.1.desc: "幻想郷の辺境で、無名の妖怪が行く手を阻む。その意図は不明だが、すでに弾幕の構えを見せている——遭遇戦は避けられそうにない。"
 th_danmaku_events.1.a: "応戦する！"
 th_danmaku_events.1.a.tt: "こちら火力 #T [ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_firepower_value')]#!\n妖怪火力 #T [ROOT.GetCountry.MakeScope.GetVariable('th_danmaku_encounter_youkai_fp_var').GetValue]#!"

 th_danmaku_events.2.title: "大勝：弾幕が圧倒"
 th_danmaku_events.2.desc: "弾幕が豪雨のように降り注ぎ、妖怪の守りは瞬く間に崩れた。妖怪は夜闇に逃げ去り、二度と近づこうとしない。"
 th_danmaku_events.2.a: "ふん、身の程知らず。"
 th_danmaku_events.2.a.tt: "金 #G [ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_encounter_great_victory_gold_value')]#! と威信 #G [ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_encounter_great_victory_prestige_value')]#! を獲得。"
 th_danmaku_events.2.b: "調査を進める"
 th_danmaku_events.2.b.tt: "異変調査の進行度 #G +[ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_encounter_great_victory_investigation_value')]#!"

 th_danmaku_events.3.title: "勝利：敵を撃退"
 th_danmaku_events.3.desc: "激しい弾幕の応酬の末、妖怪は徐々に劣勢となり山へ退いていった。あなたは遭遇戦に勝利した。"
 th_danmaku_events.3.a: "戦利品を回収。"
 th_danmaku_events.3.a.tt: "金 #G [ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_encounter_victory_gold_value')]#! と威信 #G [ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_encounter_victory_prestige_value')]#! を獲得。"
 th_danmaku_events.3.b: "調査を進める"
 th_danmaku_events.3.b.tt: "異変調査の進行度 #G +[ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_encounter_victory_investigation_value')]#!"

 th_danmaku_events.4.title: "敗北：退きながら戦う"
 th_danmaku_events.4.desc: "妖怪の弾幕は予想外に鋭く、あなたは戦いながら退くことを余儀なくされた。致命傷ではないが、面目は傷ついた。"
 th_danmaku_events.4.a: "この教訓を忘れない。"
 th_danmaku_events.4.a.tt: "金 #R [ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_encounter_defeat_gold_value')]#! と威信 #R [ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_encounter_defeat_prestige_value')]#! を失う。"

 th_danmaku_events.5.title: "大敗：逃亡"
 th_danmaku_events.5.desc: "弾幕は完全に崩壊し、あなたは無様に戦場から逃げ出した。無名の妖怪にこれほどの実力があるとは、まったく予想外だった。"
 th_danmaku_events.5.a: "……またの機会がある。"
 th_danmaku_events.5.a.tt: "金 #R [ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_encounter_great_defeat_gold_value')]#! と威信 #R [ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_encounter_great_defeat_prestige_value')]#! を失う。"

### ============================================================
### 決闘イベント
### ============================================================
 th_danmaku_events.10.title: "弾幕決闘"
 th_danmaku_events.10.desc: "[target.GetName]の統治者が向かい側に立ち、スペルカードを手にしている。これは一対一のスペルカード決闘——勝敗が威信と名声の帰趨を決める。"
 th_danmaku_events.10.a: "礼儀正しく請う"
 th_danmaku_events.10.a.tt: "礼儀正しく、公平に戦う。\nこちら火力 #T [actor.MakeScope.ScriptValue('th_danmaku_firepower_value')]#!\n相手火力 #T [target.MakeScope.ScriptValue('th_danmaku_firepower_value')]#!"
 th_danmaku_events.10.b: "挑発"
 th_danmaku_events.10.b.tt: "相手を挑発し、決闘を激化させる。\nこちら火力 #T [actor.MakeScope.ScriptValue('th_danmaku_firepower_value')]#!\n相手火力 #T [target.MakeScope.ScriptValue('th_danmaku_firepower_value')]#!\n勝利時の報酬と恩恵は倍増、敗北時のペナルティも倍増！"

 th_danmaku_events.11.title: "弾幕決闘・応戦確認"
 th_danmaku_events.11.desc: "[actor.GetName]の統治者からスペルカード挑戦が届いた。この一対一の弾幕決闘を受けるか？"
 th_danmaku_events.11.a: "決闘を受ける"
 th_danmaku_events.11.a.tt: "礼儀正しく応戦する。\nこちら火力 #T [target.MakeScope.ScriptValue('th_danmaku_firepower_value')]#!\n相手火力 #T [actor.MakeScope.ScriptValue('th_danmaku_firepower_value')]#!"
 th_danmaku_events.11.b: "決闘を辞退する"
 th_danmaku_events.11.b.tt: "応戦する気はない。この挑戦を断る。"
 th_danmaku_events.12.title: "決闘中止"
 th_danmaku_events.12.desc: "[target.GetName]はスペルカード挑戦を辞退し、決闘は始まらなかった。"
 th_danmaku_events.12.a: "仕方ない。"

 th_danmaku_events.20.title: "弾幕決闘・第 [actor.MakeScope.GetVariable('th_danmaku_duel_round_var').GetValue] ラウンド"
 th_danmaku_events.20.desc: "弾幕が交錯し、光の雨が降り注ぐ。\nこちらの得点：#T [actor.MakeScope.GetVariable('th_danmaku_duel_player_score_var').GetValue]#!\n相手の得点：#T [actor.MakeScope.GetVariable('th_danmaku_duel_enemy_score_var').GetValue]#!\n前ラウンド：こちら +[actor.MakeScope.GetVariable('th_danmaku_duel_last_player_gain_var').GetValue]、相手 +[actor.MakeScope.GetVariable('th_danmaku_duel_last_enemy_gain_var').GetValue]\nこのラウンドの戦術を選べ："
 th_danmaku_events.20.a: "守勢の布陣"
 th_danmaku_events.20.a.tt: "堅実で慎重。\n得点範囲 #G 2~8#!、失敗なし。"
 th_danmaku_events.20.b: "堅実な攻勢"
 th_danmaku_events.20.b.tt: "攻守のバランス。\n得点範囲 #G 4~16#!、10% の確率で無得点。"
 th_danmaku_events.20.c: "全力弾幕"
 th_danmaku_events.20.c.tt: "火力を全て解放し高得点を狙う。\n得点範囲 #G 0~26#!、30% の確率で無得点。"
 th_danmaku_events.20.d: "一か八か"
 th_danmaku_events.20.d.tt: "全てを懸けた一撃！\n得点範囲 #G 0~42#!、50% の確率で無得点。"

 th_danmaku_events.21.title: "相手のターン"
 th_danmaku_events.21.desc: "相手は次の弾幕を準備している。"
 th_danmaku_events.21.a: "続行"

 th_danmaku_events.22.title: "弾幕決闘・決着"
 th_danmaku_events.22.desc: "最後の弾幕が夜闇に消える。\nこちらの得点：[actor.MakeScope.GetVariable('th_danmaku_duel_player_score_var').GetValue]\n相手の得点：[actor.MakeScope.GetVariable('th_danmaku_duel_enemy_score_var').GetValue]"
 th_danmaku_events.22.a: "勝利の栄光"
 th_danmaku_events.22.a.tt: "金 #G [actor.MakeScope.GetVariable('th_danmaku_duel_final_gold_var').GetValue]#! と威信 #G [actor.MakeScope.GetVariable('th_danmaku_duel_final_prestige_var').GetValue]#! を獲得し、さらに貢献度と影響力を得る。挑発決闘の場合、報酬はすでに倍増されている。"
 th_danmaku_events.22.b: "敗北の苦渋"
 th_danmaku_events.22.b.tt: "金 #R [actor.MakeScope.GetVariable('th_danmaku_duel_final_gold_var').GetValue]#! と威信 #R [actor.MakeScope.GetVariable('th_danmaku_duel_final_prestige_var').GetValue]#! を失う。挑発決闘の場合、ペナルティはすでに倍増されている。"
 th_danmaku_events.22.c: "……後始末を。"
 th_danmaku_events.22.c.tt: "決闘の状態が異常なため、中途半端に終わった。"

 th_danmaku_events.23.title: "水に流れた決闘"
 th_danmaku_events.23.desc: "相手は一向に現れず、弾幕決闘は自然消滅した。"
 th_danmaku_events.23.a: "仕方ない。"

### ============================================================
### 獣の乱 / 獣退治
### ============================================================
 th_beast_rampage_modifier: "獣の乱"
 th_beast_rampage_modifier_desc: "狂暴な獣がこの地を荒らしている。税収（生産）効率 #R -10%#!。「獣退治」アクションで駆除できる。"
 th_danmaku_subjugate_beast: "獣退治"
 th_danmaku_subjugate_beast_desc: "獣の乱に悩む地点へ赴き、弾幕で雌雄を決する。勝利すれば獣を追い払い、税収を回復できる。"
 th_danmaku_subjugate_beast_none_available: "治下に獣の乱の地点がない"
 PERFORM_th_danmaku_subjugate_beast_ACTION: "獣退治へ赴いた"
 WE_PERFORM_th_danmaku_subjugate_beast_ACTION: "私たちは獣退治へ赴いた"
 OTHER_PERFORMS_th_danmaku_subjugate_beast_ACTION: "獣退治へ赴いた"
 ACTION_th_danmaku_subjugate_beast_PERFORMED_ON_US: "獣の乱の地が退治された"

 th_danmaku_events.30.title: "獣との遭遇"
 th_danmaku_events.30.desc: "[SCOPE.sLocation('th_danmaku_beast_loc').GetName]で、狂暴な獣が田畑を踏み荒らし、人々を怯えさせている。獣はあなたの気配を嗅ぎつけ、弾幕の構えを取った——勝つことだけがこの地に平穏をもたらす。"
 th_danmaku_events.30.a: "応戦する！"
 th_danmaku_events.30.a.tt: "こちら火力 #T [ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_firepower_value')]#!\n獣の火力 #T [ROOT.GetCountry.MakeScope.GetVariable('th_danmaku_encounter_youkai_fp_var').GetValue]#!"

 th_danmaku_events.31.title: "獣退治・大勝"
 th_danmaku_events.31.desc: "弾幕が津波のように獣を飲み込み、獣は悲鳴とともに光の粒へと消えた。乱の翳は一瞬で晴れた。"
 th_danmaku_events.31.a: "この地に平穏が戻った。"
 th_danmaku_events.31.a.tt: "獣の乱は駆除された。金 #G [ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_encounter_great_victory_gold_value')]#! と威信 #G [ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_encounter_great_victory_prestige_value')]#! を獲得。"
 th_danmaku_events.32.title: "獣退治・勝利"
 th_danmaku_events.32.desc: "長い攻防の末、獣は力尽きて散り、山の奥へ逃げ去った。二度と戻ってこないだろう。"
 th_danmaku_events.32.a: "ご苦労だった。"
 th_danmaku_events.32.a.tt: "獣の乱は駆除された。金 #G [ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_encounter_victory_gold_value')]#! と威信 #G [ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_encounter_victory_prestige_value')]#! を獲得。"
 th_danmaku_events.33.title: "獣退治・敗北"
 th_danmaku_events.33.desc: "獣の弾幕は凄まじく、あなたは戦場から退くことを余儀なくされた。獣はなおこの地を荒らしており、次の機会をうかがうしかない。"
 th_danmaku_events.33.a: "またの機会に。"
 th_danmaku_events.33.a.tt: "獣はなお暴れている。金 #R [ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_encounter_defeat_gold_value')]#! と威信 #R [ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_encounter_defeat_prestige_value')]#! を失う。"
 th_danmaku_events.34.title: "獣退治・大敗"
 th_danmaku_events.34.desc: "弾幕は完全に崩れ、あなたは無様に退却した。背後で獣の咆哮が長く響き、この地の禍はますます深まった。"
 th_danmaku_events.34.a: "……態勢を整えて再び。"
 th_danmaku_events.34.a.tt: "獣はなお暴れている。金 #R [ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_encounter_great_defeat_gold_value')]#! と威信 #R [ROOT.GetCountry.MakeScope.ScriptValue('th_danmaku_encounter_great_defeat_prestige_value')]#! を失う。"
 th_danmaku_events.40.title: "狂乱の獣"
 th_danmaku_events.40.desc: "近来、幻想郷では妖気が騒ぎ、狂乱の獣が国境近くに出没するという噂が流れている。放置すれば民が苦しみ、税収も損なわれるだろう。"
 th_danmaku_events.40.a: "獣が現れ、そのまま荒らさせる"
 th_danmaku_events.40.a.tt: "治下のランダムな地点に「獣の乱」が発生する：税収（生産）効率 #R -10%#!、期間 #T 10#! 年。「獣退治」で駆除できる。"
 th_danmaku_events.40.b: "取り越し苦労——獣は去っていった"
