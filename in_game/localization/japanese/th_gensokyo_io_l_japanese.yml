 TH_SAGES_TAB_OVERVIEW: "概要"
 TH_SAGES_TAB_DEBATE: "討論"
 TH_SAGES_ACTIONS_LABEL: "国際組織行動"
 TH_SAGES_MAIN_ACTIONS: "賢者議会行動"
 TH_SAGES_DEBATE_TITLE: "賢者議会討論場"
 TH_SAGES_DEBATE_PLACEHOLDER: "幻想郷の諸国による議会討論と法律提案がここに表示される。\n近日公開予定。"
