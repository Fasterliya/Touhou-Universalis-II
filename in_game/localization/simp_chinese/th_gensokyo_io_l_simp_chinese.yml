### 幻想乡国际组织 — 本地化

### === IO名称与描述 ===
 th_gensokyo_io: "幻想乡"
 th_gensokyo_io_desc: "维系幻想乡诸国平衡的国际组织，由贤者与阎魔共同维护大结界秩序。"

### === 特殊席位 ===
 th_gensokyo_io_sages_special_status: "贤者"
 th_gensokyo_io_sages_special_status_desc: "幻想乡最古老的三位贤者，分别镇守大结界的关键节点。"

 th_gensokyo_io_yama_special_status: "阎魔"
 th_gensokyo_io_yama_special_status_desc: "执掌彼岸的审判者，裁决幻想乡诸国的是非善恶，担任幻想乡议会的领袖。"

 th_gensokyo_io_guardian_special_status: "幻想乡守护"
 th_gensokyo_io_guardian_special_status_desc: "博丽神社的巫女，大结界永恒的守护者。代代相传的博丽之力维系着幻想乡与外界的边界。"

 th_gensokyo_io_human_village_special_status: "人类村落"
 th_gensokyo_io_human_village_special_status_desc: "人间之里的代表，守护幻想乡人类聚居地的权益。"

### 2026-08-21（bug 1 修复）：普通成员基础席位（全体成员自动授予，投票权重载体）
 th_gensokyo_io_regular_member_special_status: "幻想乡成员"
 th_gensokyo_io_regular_member_special_status_desc: "幻想乡的普通成员。所有成员均享有议会投票权，权重取决于本国在幻想乡中的影响力。"

### === 幻想乡影响力修正 ===
### 2026-08-21（用户规格）：价值观条渐进给予 ±50%，影响议会投票权重
