### === 法律：团结愿景 ===
 th_gensokyo_unity_vision_law: "团结愿景"
 th_gensokyo_unity_vision_law_desc: "决定幻想乡团结之力的获取方向与运用之道。"

 isolation_defense_policy: "孤立坚守"
 isolation_defense_policy_desc: "紧闭大结界之门，以内部和平凝聚团结之力。外部威胁难以侵入，但新思潮亦难流入。"

 balance_path_policy: "平衡之道"
 balance_path_policy_desc: "维持大结界既有之法，不偏不倚。团结之力自然流转，诸国各得其所。"

 open_inclusive_policy: "开放包容"
 open_inclusive_policy_desc: "放宽大结界限制，欢迎外界新思。思潮传播加速，外交空间扩大，但团结凝聚略受影响。"

### === 法律：大结界政策 ===
 th_gensokyo_barrier_policy_law: "大结界政策"
 th_gensokyo_barrier_policy_law_desc: "决定幻想乡大结界的维护强度与开放程度。"

 reinforced_barrier_policy: "强化结界"
 reinforced_barrier_policy_desc: "倾全乡之力加固大结界。防御与人力大幅提升，但外交声誉受损，外来思潮难以渗透。"

 maintained_barrier_policy: "维持结界"
 maintained_barrier_policy_desc: "按既有传统维持大结界运转。防御稳定，诸事如常。"

 relaxed_barrier_policy: "宽松结界"
 relaxed_barrier_policy_desc: "适度放松大结界限制以利交流。思潮传播显著加快，但防御能力有所削弱。"

### === 法律：异变应对法则 ===
 th_gensokyo_incident_response_law: "异变应对法则"
 th_gensokyo_incident_response_law_desc: "决定幻想乡发生异变时的应对策略与行动准则。"

 duel_resolution_policy: "弹幕决斗规则"
 duel_resolution_policy_desc: "以一对一弹幕决斗解决异变。胜者赢得声望，但不擅战斗者难以自保。"

 joint_suppression_policy: "联合镇压"
 joint_suppression_policy_desc: "诸国联合行动，以集体之力镇压异变。人力充沛，应对迅速。"

 diplomatic_mediation_policy: "外交调解"
 diplomatic_mediation_policy_desc: "以谈判与调解化解异变根源。外交声誉提升，但军事准备相对不足。"

