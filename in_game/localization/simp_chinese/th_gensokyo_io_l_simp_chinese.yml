 TH_SAGES_TAB_OVERVIEW: "总览"
 TH_SAGES_TAB_DEBATE: "辩论"
 TH_SAGES_ACTIONS_LABEL: "国际组织行动"
 TH_SAGES_MAIN_ACTIONS: "贤者议会行动"
 TH_SAGES_DEBATE_TITLE: "贤者辩论厅"
 TH_SAGES_DEBATE_PLACEHOLDER: "此处将展示幻想乡诸国的议会辩论与法律提案。\n待后续版本开放。"
