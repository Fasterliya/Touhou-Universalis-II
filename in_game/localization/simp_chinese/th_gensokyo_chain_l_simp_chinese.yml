 th_gensokyo_suspect_mark: "嫌疑"
 th_gensokyo_suspect_mark_desc: "好战越线的国家所背负的标记。\n$BULLET$好战倾向已越过幻想乡的容忍线\n$BULLET$已够格被阎魔纠弹立案，但尚未立案\n$BULLET$处于免制裁期者不会被记为嫌疑"
 th_gensokyo_observation_months: "观察期（剩余月数）"
 th_gensokyo_tier_1_mark: "谴责"
 th_gensokyo_tier_1_mark_desc: "制裁第 1 档。\n$BULLET$幻想乡全体成员对其敌意上升、好感下降\n$BULLET$外交上被孤立，但不影响其军事与财政\n$BULLET$制裁撤销时，这些敌意与好感一并移除"
 th_gensokyo_tier_2_mark: "夺权"
 th_gensokyo_tier_2_mark_desc: "制裁第 2 档。\n$BULLET$在幻想乡议会的投票权归零\n$BULLET$其贡献与影响力不再计入幻想乡\n$BULLET$在审判庭的意向表决中，其意见仍可见，但已无分量"
 th_gensokyo_tier_3_mark: "禁运"
 th_gensokyo_tier_3_mark_desc: "制裁第 3 档。\n$BULLET$幻想乡全体成员对其禁运，贸易往来中断\n$BULLET$禁运持续至制裁撤销\n$BULLET$自此档起，制裁不再只是名誉问题"
 th_gensokyo_tier_4_mark: "限张"
 th_gensokyo_tier_4_mark_desc: "制裁第 4 档，阶梯顶点。\n$BULLET$其在幻想乡的扩张会招致更大的国际反弹\n$BULLET$扩张所得不变，代价变重\n$BULLET$此档之后仍不悔改，阎魔即开庭宣判"

