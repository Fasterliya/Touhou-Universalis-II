 th_gensokyo_tribunal_events.1.title: "领衔征询"
 th_gensokyo_tribunal_events.1.desc: "是非曲直厅已裁定，制裁须由世俗之手领衔执行。阎魔指名由你领衔：应允则对被诉国的制裁提升一档，观察期重新起算；拒绝则原档位保留，阎魔另选他人。"
