 th_gensokyo_tribunal_events.1.b: "拒绝领衔"
 th_gensokyo_tribunal_events.2.title: "领衔被拒"
 th_gensokyo_tribunal_events.2.desc: "被指名的国家拒绝领衔。本案原档位保留，观察期不予重置。是非曲直厅请你另行择定领衔之国。"
 th_gensokyo_tribunal_events.2.a: "明白了"
 th_gensokyo_tribunal_events.3.title: "观察期届满"
 th_gensokyo_tribunal_events.3.desc: "被诉国的观察期已届满，既未履约，亦无悔改之举。本案可以升档：由最近强国领衔，制裁再进一档，观察期重新起算。"
 th_gensokyo_tribunal_events.3.a: "明白了"
 th_gensokyo_tribunal_events.4.title: "终审 · 裁决"
 th_gensokyo_tribunal_events.4.desc: "辩论已毕，案卷呈至彼岸。\n被诉国 [th_verdict_accused.GetName] 的罪业已定，依律基准 #T[th_verdict_accused.MakeScope.GetVariable('th_gensokyo_sentence_baseline').GetValue]#! 档。\n你可以依律、顺民意，也可以独断——但每一次偏离民意、每一次越出裁量范围，都记在幻想乡的团结度上。"
 th_gensokyo_tribunal_events.4.a.tt: "#T0. 赔款破产#!\n$BULLET$本档后果：被诉国国库半数转出并陷入破产，罚金入幻想乡公库\n$BULLET$依律基准：#T[th_verdict_accused.MakeScope.GetVariable('th_gensokyo_sentence_baseline').GetValue]#! 档；裁量范围 = 基准上下各一档\n$BULLET$偏离诸国意向：每偏一档，幻想乡团结度扣除 #R[th_verdict_accused.MakeScope.ScriptValue('th_verdict_deviation_unity_cost_value')|0]#!\n$BULLET$越出裁量范围：额外再扣 #R同额#! 团结度\n$BULLET$收尾：判决落地、审判庭解散，本案转入服刑"
 th_gensokyo_tribunal_events.4.b.tt: "#T1. 归还#!\n$BULLET$本档后果：被诉国交还非法所得的领地\n$BULLET$依律基准：#T[th_verdict_accused.MakeScope.GetVariable('th_gensokyo_sentence_baseline').GetValue]#! 档；裁量范围 = 基准上下各一档\n$BULLET$偏离诸国意向：每偏一档，幻想乡团结度扣除 #R[th_verdict_accused.MakeScope.ScriptValue('th_verdict_deviation_unity_cost_value')|0]#!\n$BULLET$越出裁量范围：额外再扣 #R同额#! 团结度\n$BULLET$收尾：判决落地、审判庭解散，本案转入服刑"
 th_gensokyo_tribunal_events.4.c.tt: "#T2. 削弱#!\n$BULLET$本档后果：交还领地，且国力被削弱若干年\n$BULLET$依律基准：#T[th_verdict_accused.MakeScope.GetVariable('th_gensokyo_sentence_baseline').GetValue]#! 档；裁量范围 = 基准上下各一档\n$BULLET$偏离诸国意向：每偏一档，幻想乡团结度扣除 #R[th_verdict_accused.MakeScope.ScriptValue('th_verdict_deviation_unity_cost_value')|0]#!\n$BULLET$越出裁量范围：额外再扣 #R同额#! 团结度\n$BULLET$收尾：判决落地、审判庭解散，本案转入服刑"
 th_gensokyo_tribunal_events.4.d.tt: "#T3. 监管国#!\n$BULLET$本档后果：被诉国国库清零，降为彼岸的监管国，刑满方可释放\n$BULLET$依律基准：#T[th_verdict_accused.MakeScope.GetVariable('th_gensokyo_sentence_baseline').GetValue]#! 档；裁量范围 = 基准上下各一档\n$BULLET$偏离诸国意向：每偏一档，幻想乡团结度扣除 #R[th_verdict_accused.MakeScope.ScriptValue('th_verdict_deviation_unity_cost_value')|0]#!\n$BULLET$越出裁量范围：额外再扣 #R同额#! 团结度\n$BULLET$收尾：判决落地、审判庭解散，本案转入服刑"

